<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXNA Downloader - GitHub Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0b0f19; color: #f1f5f9; }</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-slate-900/60 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-red-500 to-orange-500 bg-clip-text text-transparent">
                EXNA Downloader
            </h1>
            <p class="text-slate-400 mt-2 text-sm">Versão GitHub Pages (Processamento via API Pública)</p>
        </div>

        <div class="flex flex-col sm:flex-row gap-2 mb-6">
            <input type="text" id="playlistUrl" placeholder="Cole o link da playlist aqui..." 
                class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 text-sm focus:outline-none focus:border-red-500">
            <button onclick="carregarPlaylist()" id="btnAcao" class="bg-red-600 hover:bg-red-500 text-white font-medium px-6 py-3 rounded-xl transition-all shadow-lg text-sm">
                Analisar Lista
            </button>
        </div>

        <div id="statusPainel" class="hidden space-y-4 border-t border-slate-800 pt-4">
            <div class="flex justify-between items-center text-sm">
                <span id="statusTxt" class="text-orange-400 font-medium">Buscando faixas...</span>
                <span id="contador" class="text-slate-500 text-xs">0 / 0</span>
            </div>
            <div id="listaMusicas" class="max-h-64 overflow-y-auto space-y-2 pr-1"></div>
        </div>
    </div>

    <script>
        let fila = [];
        let indexAtual = 0;

        async function carregarPlaylist() {
            const url = document.getElementById('playlistUrl').value.trim();
            if(!url) return alert('Insira um link!');

            let listId = "";
            if(url.includes("list=")) {
                listId = url.split("list=")[1].split("&")[0];
            } else {
                return alert('Por favor, insira um link de PLAYLIST válido.');
            }

            const btn = document.getElementById('btnAcao');
            const painel = document.getElementById('statusPainel');
            const statusTxt = document.getElementById('statusTxt');
            const lista = document.getElementById('listaMusicas');

            btn.disabled = true;
            painel.classList.remove('hidden');
            statusTxt.innerText = 'Buscando vídeos no YouTube...';
            lista.innerHTML = '';

            try {
                // Usando um espelho de API gratuito para ler os dados da lista sem precisar de backend
                const res = await fetch(`https://yt.lemnoslife.com/noKey/playlistItems?playlistId=${listId}&part=snippet&maxResults=50`);
                const data = await res.json();
                
                if(!data || !data.items) throw new Error();

                fila = data.items.map(item => ({
                    id: item.snippet.resourceId.videoId,
                    title: item.snippet.title
                }));

                document.getElementById('contador').innerText = `0 / ${fila.length}`;

                lista.innerHTML = fila.map((track, i) => `
                    <div id="item-${i}" class="flex items-center justify-between p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs">
                        <span class="truncate max-w-[70%] text-slate-300 font-medium">${i+1}. ${track.title}</span>
                        <span id="badge-${i}" class="text-slate-500 bg-slate-900 px-2 py-1 rounded font-bold uppercase tracking-wider text-[10px]">Na Fila</span>
                    </div>
                `).join('');

                indexAtual = 0;
                baixarProxima();

            } catch (err) {
                statusTxt.innerText = 'Erro ao ler playlist pública.';
                btn.disabled = false;
            }
        }

        async function baixarProxima() {
            if(indexAtual >= fila.length) {
                document.getElementById('statusTxt').innerText = '🎉 Fila de downloads concluída!';
                document.getElementById('statusTxt').className = 'text-emerald-400 font-medium';
                document.getElementById('btnAcao').disabled = false;
                return;
            }

            const musica = fila[indexAtual];
            document.getElementById('statusTxt').innerText = `Baixando: ${musica.title}`;
            document.getElementById('contador').innerText = `${indexAtual + 1} / ${fila.length}`;

            const badge = document.getElementById(`badge-${indexAtual}`);
            const linha = document.getElementById(`item-${indexAtual}`);
            
            badge.innerText = 'Baixando';
            badge.className = 'text-orange-400 bg-orange-950/30 border border-orange-900/50 px-2 py-1 rounded font-bold uppercase tracking-wider text-[10px]';
            linha.classList.add('border-orange-500/30', 'bg-orange-950/10');

            // Aciona o gateway externo de download
            window.location.href = `https://api.vevioz.com/api/button/mp3/${musica.id}`;

            // Dá um tempo de 5 segundos para o navegador iniciar o download antes de pular para o próximo item
            setTimeout(() => {
                badge.innerText = 'Iniciado';
                badge.className = 'text-emerald-400 bg-emerald-950/30 border border-emerald-800/50 px-2 py-1 rounded font-bold uppercase tracking-wider text-[10px]';
                linha.classList.remove('border-orange-500/30', 'bg-orange-950/10');
                linha.classList.add('opacity-40');
                indexAtual++;
                baixarProxima();
            }, 5000);
        }
    </script>
</body>
</html>
