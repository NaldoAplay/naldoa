<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADIO EXNA FM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo-quadrada.png">
            
    <style>
        :root {
            --primary-purple: #8a2be2;
            --neon-aqua: #66fcf1;
            --neon-pink: #ff0055;
            --dark-bg: #050608;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        .blur-background {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: url('logo-quadrada.png');
            background-position: center;
            background-size: cover;
            filter: blur(50px) brightness(0.25);
            z-index: -1;
            transition: background-image 0.7s ease-in-out;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .glass-player {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            width: 100%;
            max-width: 380px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            position: relative;
        }

        .radio-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
        }

        .header-brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .radio-top-logo {
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 0 8px var(--neon-aqua));
        }

        .radio-brand-text h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin: 0;
            text-align: left;
        }
        .radio-brand-text h2 span { color: var(--neon-aqua); }
        .radio-brand-text p {
            margin: 0;
            font-size: 0.7rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: left;
        }

        .hamburger-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.3s;
            padding: 5px 10px;
        }
        .hamburger-btn:hover {
            color: var(--neon-aqua);
            filter: drop-shadow(0 0 5px var(--neon-aqua));
        }

        .cover-area {
            width: 190px;
            height: 190px;
            margin: 0 auto 20px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }

        .playing .cover-area {
            border-color: var(--neon-aqua);
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.2);
        }

        .cover-img { width: 100%; height: 100%; object-fit: cover; background-color: #111; }

        .info-area h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-area p {
            font-size: 1rem;
            color: var(--neon-aqua);
            margin: 4px 0 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-btn:hover, .nav-btn.active { color: var(--neon-aqua); filter: drop-shadow(0 0 5px var(--neon-aqua)); }

        .play-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(45deg, var(--primary-purple), var(--neon-pink));
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
        }
        .play-btn.active { background: #fff; color: #000; box-shadow: 0 0 25px #fff; }

        .playlist-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 320px;
            height: 100vh;
            background: rgba(5, 6, 8, 0.96);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-left: 1px solid var(--glass-border);
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            z-index: 9999;
            transition: cubic-bezier(0.16, 1, 0.3, 1) 0.4s;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .playlist-sidebar.open { right: 0; }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .sidebar-header h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin: 0;
            color: var(--neon-aqua);
            letter-spacing: 1px;
        }

        .close-sidebar-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-sidebar-btn:hover { color: var(--neon-pink); }

        .playlist-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        .playlist-scroll-area::-webkit-scrollbar { width: 4px; }
        .playlist-scroll-area::-webkit-scrollbar-thumb { background: var(--neon-aqua); border-radius: 10px; }

        .playlist-item {
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.01);
        }
        .playlist-item:hover { background: rgba(255, 255, 255, 0.04); }
        
        .playlist-item.current-track {
            background: rgba(102, 252, 241, 0.1);
            border: 1px solid rgba(102, 252, 241, 0.3);
            color: var(--neon-aqua);
            font-weight: 600;
        }

        .list-thumb {
            width: 35px;
            height: 35px;
            border-radius: 6px;
            object-fit: cover;
            background-color: #111;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .track-meta-box {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-meta-box span { display: block; font-size: 0.7rem; color: #666; margin-top: 1px; }
        .current-track .track-meta-box span { color: var(--neon-pink); }

        .pwa-float-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--neon-aqua);
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
        }

        .pwa-float-btn.visible { opacity: 1; transform: scale(1); pointer-events: auto; }

        footer {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.5);
            border-top: 1px solid var(--glass-border);
            position: relative;
            z-index: 1;
        }
        .social-links { margin-bottom: 10px; display: flex; justify-content: center; gap: 20px; }
        .social-links a { color: var(--neon-aqua); font-size: 1.3rem; transition: 0.3s; }
        .social-links a:hover { color: var(--neon-pink); }
        .copyright { font-size: 0.7rem; color: #555; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="blur-background" id="bg-glow"></div>

    <div class="playlist-sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-list-ul"></i> EXNA PLAYLIST</h3>
            <button class="close-sidebar-btn" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <div class="playlist-scroll-area" id="playlist-box">
            <div style="text-align: center; color: #444; padding: 20px; font-size: 0.85rem;">Carregando playlist do Drive...</div>
        </div>
    </div>

    <main>
        <div class="glass-player" id="main-player">
            
            <div class="radio-header">
                <div class="header-brand-box">
                    <img src="logo-quadrada.png" class="radio-top-logo" alt="EXNA Logo">
                    <div class="radio-brand-text">
                        <h2>EXNA <span>MUSIC</span></h2>
                        <p>Playlist Online Global</p>
                    </div>
                </div>
                <button class="hamburger-btn" onclick="toggleSidebar()" title="Abrir Playlist">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <div class="cover-area">
                <img src="logo-quadrada.png" id="track-cover" class="cover-img" alt="Capa da Música">
            </div>

            <div class="info-area">
                <h1 id="track-title">SINTONIZANDO...</h1>
                <p id="artist-name">EXNA MUSIC</p>
            </div>

            <div class="controls-row">
                <button class="nav-btn" id="shuffle-btn" onclick="toggleShuffle()" title="Modo Aleatório"><i class="fas fa-random"></i></button>
                <button class="nav-btn" onclick="voltarFaixa()" title="Faixa Anterior"><i class="fas fa-step-backward"></i></button>
                <button class="play-btn" id="master-play" onclick="toggleRadio()" disabled>
                    <i class="fas fa-spinner fa-spin" id="btn-icon"></i>
                </button>
                <button class="nav-btn" onclick="proximaFaixa()" title="Próxima Faixa"><i class="fas fa-step-forward"></i></button>
                <button class="nav-btn" id="loop-btn" onclick="toggleLoop()" title="Repetir Faixa"><i class="fas fa-redo"></i></button>
            </div>
            
            <p id="status-text" style="margin-top:20px; font-size: 0.8rem; color: #45a29e; font-weight: bold; letter-spacing: 1px; text-transform: uppercase;"></p>
        </div>
    </main>

    <button id="pwa-install-btn" class="pwa-float-btn" title="Baixar App">
        <i class="fas fa-download"></i>
    </button>

    <footer>
        <div class="social-links">
            <a href="https://instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://youtube.com/" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://tiktok.com/" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
        <div class="copyright">
            EXNA ECOSSISTEMAS © 2026 | NaldoA
        </div>
    </footer>

    <audio id="audio-core" crossorigin="anonymous" preload="auto"></audio>

    <script>
        const PASTA_ID = '1vcukZmaqRgdkg6hEe-zgMjY7H9VwwY9J'; 
        const API_KEY = 'AIzaSyBVpSXuoQT0jjh6nqzKo5U1IYlaP_qolSs'; 

        const player = document.getElementById('audio-core');
        const btn = document.getElementById('master-play');
        const icon = document.getElementById('btn-icon');
        const card = document.getElementById('main-player');
        const txtTitle = document.getElementById('track-title');
        const txtArtist = document.getElementById('artist-name');
        const txtCover = document.getElementById('track-cover');
        const bgGlow = document.getElementById('bg-glow');
        const txtStatus = document.getElementById('status-text');
        const playlistBox = document.getElementById('playlist-box');
        const sidebar = document.getElementById('sidebar');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const loopBtn = document.getElementById('loop-btn');

        let acervoOriginal = [];
        let gradeSincronizadaGlobal = [];
        let indiceMusicaAtual = 0;
        let deferredPrompt;
        let estaPausadoManualmente = true;
        let isShuffle = false;
        let isLoop = false;

        txtTitle.innerText = "SINTONIA ONLINE";
        txtStatus.innerText = "Conectando à torre...";

        function toggleSidebar() {
            sidebar.classList.toggle('open');
        }

        let touchStartX = 0;
        sidebar.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
        sidebar.addEventListener('touchend', (e) => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchEndX - touchStartX > 80) { sidebar.classList.remove('open'); }
        });

        async function fetchDriveData() {
            const url = `https://www.googleapis.com/drive/v3/files?q='${PASTA_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(data.files && data.files.length > 0) {
                    let musicas = data.files.filter(f => f.name.toLowerCase().endsWith('.mp3') || f.mimeType.includes('audio')).sort((a,b) => a.name.localeCompare(b.name));
                    let imagens = data.files.filter(f => f.mimeType.includes('image') || f.name.toLowerCase().endsWith('.jpg') || f.name.toLowerCase().endsWith('.png'));

                    if (musicas.length === 0) {
                        txtTitle.innerText = "EXNA MUSIC";
                        txtStatus.innerText = "Nenhuma música disponível.";
                        return;
                    }

                    acervoOriginal = musicas.map((m, index) => {
                        const nomeSemExtensao = m.name.replace(/\.[^/.]+$/, "");
                        let artistaDetectado = "EXNA MUSIC";
                        let tituloDetectado = nomeSemExtensao;
                        if(nomeSemExtensao.includes(" - ")) {
                            let partes = nomeSemExtensao.split(" - ");
                            artistaDetectado = partes[0].trim();
                            tituloDetectado = partes[1].trim();
                        }

                        const capaCorrespondente = imagens.find(img => img.name.toLowerCase().startsWith(nomeSemExtensao.toLowerCase()));
                        
                        return {
                            idInterno: index,
                            id: m.id,
                            name: tituloDetectado,
                            artist: artistaDetectado,
                            capaUrl: capaCorrespondente ? `https://www.googleapis.com/drive/v3/files/${capaCorrespondente.id}?alt=media&key=${API_KEY}` : 'logo-quadrada.png'
                        };
                    });
                    
                    montarOrdemExecucao();

                    btn.disabled = false;
                    icon.className = "fas fa-play";
                    txtStatus.innerText = "Sinal sintonizado";

                    renderializarInterface();
                    carregarFaixa(0);

                    setTimeout(buscarCapasNoiTunesEmMassa, 500);

                } else {
                    txtStatus.innerText = "Pasta vazia.";
                }
            } catch (e) {
                txtStatus.innerText = "Falha ao conectar com o servidor.";
            }
        }

        function montarOrdemExecucao() {
            gradeSincronizadaGlobal = [...acervoOriginal];
            if (isShuffle) {
                let pool = [...acervoOriginal];
                let dataAtual = new Date();
                let semente = dataAtual.getFullYear() * 1000 + dataAtual.getMonth() * 100 + dataAtual.getDate();

                function randomSemente() {
                    let x = Math.sin(semente++) * 10000;
                    return x - Math.floor(x);
                }

                for (let i = pool.length - 1; i > 0; i--) {
                    const j = Math.floor(randomSemente() * (i + 1));
                    [pool[i], pool[j]] = [pool[j], pool[i]];
                }
                gradeSincronizadaGlobal = pool;
            }
        }

        function renderializarInterface() {
            playlistBox.innerHTML = "";
            gradeSincronizadaGlobal.forEach((faixa, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === indiceMusicaAtual ? 'current-track' : ''}`;
                
                item.addEventListener('click', () => { pularParaMusicaDaLista(index); });

                item.innerHTML = `
                    <img src="${faixa.capaUrl}" id="list-thumb-${faixa.idInterno}" class="list-thumb" alt="Thumb">
                    <div class="track-meta-box">
                        ${ConvertName(faixa.name)}
                        <span id="list-artist-${faixa.idInterno}">${faixa.artist}</span>
                    </div>
                `;
                playlistBox.appendChild(item);
            });
        }

        function buscarCapasNoiTunesEmMassa() {
            acervoOriginal.forEach(faixa => {
                if (faixa.capaUrl !== 'logo-quadrada.png') return;

                let termoBusca = faixa.name.replace(/remix/gi, "").replace(/mix/gi, "").trim();
                const urlSearch = `https://itunes.apple.com/search?term=${encodeURIComponent(termoBusca)}&media=music&limit=1`;

                fetch(urlSearch)
                    .then(res => res.json())
                    .then(data => {
                        if (data.results && data.results.length > 0) {
                            const track = data.results[0];
                            const capaAltaDefinicao = track.artworkUrl100.replace("100x100bb.jpg", "600x600bb.jpg");
                            
                            faixa.capaUrl = capaAltaDefinicao;
                            if (faixa.artist === "EXNA MUSIC" && track.artistName) {
                                faixa.artist = track.artistName.toUpperCase();
                            }

                            const thumbEl = document.getElementById(`list-thumb-${faixa.idInterno}`);
                            const artistEl = document.getElementById(`list-artist-${faixa.idInterno}`);
                            if (thumbEl) thumbEl.src = capaAltaDefinicao;
                            if (artistEl) artistEl.innerText = faixa.artist;

                            if (gradeSincronizadaGlobal[indiceMusicaAtual].idInterno === faixa.idInterno) {
                                txtCover.src = capaAltaDefinicao;
                                bgGlow.style.backgroundImage = `url('${capaAltaDefinicao}')`;
                                txtArtist.innerText = faixa.artist;
                                updateLockScreen(faixa.name, faixa.artist, capaAltaDefinicao);
                            }
                        }
                    }).catch(err => console.log("Aguardando indexação..."));
            });
        }

        function pularParaMusicaDaLista(index) {
            estaPausadoManualmente = false;
            carregarFaixa(index);
            player.play().then(() => {
                icon.className = "fas fa-stop";
                btn.classList.add('active');
                card.classList.add('playing');
            });
        }

        function marcarFaixaAtivaNaLista() {
            const itens = document.querySelectorAll('.playlist-item');
            itens.forEach((item, idx) => {
                if (idx === indiceMusicaAtual) {
                    item.classList.add('current-track');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove('current-track');
                }
            });
        }

        function carregarFaixa(index) {
            if (gradeSincronizadaGlobal.length === 0) return;

            if (index >= gradeSincronizadaGlobal.length) index = 0;
            if (index < 0) index = gradeSincronizadaGlobal.length - 1;
            indiceMusicaAtual = index;

            const faixa = gradeSincronizadaGlobal[indiceMusicaAtual];
            player.src = `https://www.googleapis.com/drive/v3/files/${faixa.id}?alt=media&key=${API_KEY}`;
            player.load(); 

            txtTitle.innerText = ConvertName(faixa.name);
            txtArtist.innerText = faixa.artist;
            txtCover.src = faixa.capaUrl;
            bgGlow.style.backgroundImage = `url('${faixa.capaUrl}')`;

            txtStatus.innerText = "Sinal Pronto";
            marcarFaixaAtivaNaLista();
            updateLockScreen(faixa.name, faixa.artist, faixa.capaUrl);
        }

        function ConvertName(str) {
            return str.replace(/_/g, " ").toUpperCase();
        }

        function toggleRadio() {
            if (player.paused) {
                estaPausadoManualmente = false;
                icon.className = "fas fa-spinner fa-spin";
                
                player.play().then(() => {
                    icon.className = "fas fa-stop";
                    btn.classList.add('active');
                    card.classList.add('playing');
                    txtStatus.innerText = "Playlist Online Ativa";
                }).catch(() => {
                    carregarFaixa(indiceMusicaAtual);
                    player.play().then(() => {
                        icon.className = "fas fa-stop";
                        btn.classList.add('active');
                        card.classList.add('playing');
                    });
                });
            } else {
                estaPausadoManualmente = true;
                player.pause();
                icon.className = "fas fa-play";
                btn.classList.remove('active');
                card.classList.remove('playing');
                txtStatus.innerText = "Transmissão em espera";
            }
        }

        function proximaFaixa() {
            let foiPausado = player.paused;
            carregarFaixa(indiceMusicaAtual + 1);
            if (!foiPausado) {
                player.play().catch(() => { setTimeout(() => { player.play(); }, 200); });
            }
        }

        function voltarFaixa() {
            let foiPausado = player.paused;
            carregarFaixa(indiceMusicaAtual - 1);
            if (!foiPausado) {
                player.play().catch(() => { setTimeout(() => { player.play(); }, 200); });
            }
        }

        // FUNÇÕES DOS BOTÕES DE AJUSTES AVANÇADOS NA TELA
        function toggleShuffle() {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
            const idAtualReal = gradeSincronizadaGlobal[indiceMusicaAtual].idInterno;
            montarOrdemExecucao();
            indiceMusicaAtual = gradeSincronizadaGlobal.findIndex(m => m.idInterno === idAtualReal);
            renderializarInterface();
            marcarFaixaAtivaNaLista();
        }

        function toggleLoop() {
            isLoop = !isLoop;
            loopBtn.classList.toggle('active', isLoop);
            player.loop = isLoop; // Injeta a regra nativa de repetição
        }

        player.onended = () => {
            if (isLoop) return;
            if (estaPausadoManualmente) return;
            proximaFaixa();
            setTimeout(() => { player.play().catch(e => console.log("Aguardando buffer")); }, 150);
        };

        player.onerror = () => {
            if (!estaPausadoManualmente) {
                proximaFaixa();
                setTimeout(() => { player.play(); }, 250);
            }
        };

        // CONTROLES DE HARDWARE AMPLIADOS: Sincroniza Shuffle e Loop no ecossistema mobile
        function updateLockScreen(title, artist, capaUrl) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title,
                    artist: artist,
                    album: 'EXNA MUSIC',
                    artwork: [
                        { src: capaUrl, sizes: '512x512', type: 'image/png' },
                        { src: 'logo-quadrada.png', sizes: '512x512', type: 'image/png' }
                    ]
                });
                navigator.mediaSession.setActionHandler('play', () => { toggleRadio(); });
                navigator.mediaSession.setActionHandler('pause', () => { toggleRadio(); });
                navigator.mediaSession.setActionHandler('previoustrack', () => { voltarFaixa(); });
                navigator.mediaSession.setActionHandler('nexttrack', () => { proximaFaixa(); });
            }
        }

        const pwaBtn = document.getElementById('pwa-install-btn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            pwaBtn.classList.add('visible');
        });

        pwaBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                pwaBtn.classList.remove('visible');
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        fetchDriveData();
    </script>
</body>
</html>
