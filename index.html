<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EXNA FM - A Rádio que toca todas!</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EXNA FM">
  <link rel="apple-touch-icon" href="logo-quadrada.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ========== ESTILOS (EXATAMENTE COMO VOCÊ PEDIU) ========== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: #0d041a;
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden; 
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      position: relative;
    }

    .bg-blur {
      position: absolute;
      top: -10%; left: -10%; right: -10%; bottom: -10%;
      background: url('logo-quadrada.png') no-repeat center center;
      background-size: cover;
      filter: blur(55px) brightness(0.24);
      z-index: -1;
      animation: movimientoFundo 20s ease-in-out infinite alternate;
    }

    @keyframes movimientoFundo {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.1) translate(1%, 2%); }
      100% { transform: scale(1.04) translate(-1%, -1%); }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(12px + env(safe-area-inset-top)) 20px 12px 20px;
      background: rgba(13, 4, 26, 0.75); 
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      mix-blend-mode: screen; 
    }

    .titulo-radio h1 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.2px;
      background: linear-gradient(135deg, #ffffff, #c5c5c5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .titulo-radio p {
      font-size: 9px;
      color: #ff2d55;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 1px;
    }

    .redes-sociais {
      display: flex;
      gap: 16px;
    }

    .redes-sociais a {
      color: #fff;
      font-size: 18px;
      text-decoration: none;
      opacity: 0.8;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 5;
    }

    /* Layout padrão para mobile (empilhado) */
    .player-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .capa-wrapper {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1 / 1;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #000;
      margin: 0 auto;
    }

    .capa-streaming {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s ease;
    }

    .tocando .capa-streaming {
      transform: scale(1.03);
    }

    .player-container {
      background: rgba(255, 255, 255, 0.03); 
      backdrop-filter: blur(40px) saturate(140%);
      -webkit-backdrop-filter: blur(40px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 20px 25px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    /* Layout para desktop/tablet paisagem (lado a lado) */
    @media (min-width: 768px) and (orientation: landscape) {
      .player-layout {
        flex-direction: row;
        max-width: 1100px;
        gap: 40px;
        align-items: center;
      }
      .capa-wrapper {
        max-width: 320px;
        flex-shrink: 0;
      }
      .player-container {
        max-width: 550px;
        padding: 30px 35px;
      }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 45, 85, 0.12);
      color: #ff2d55;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 45, 85, 0.2);
    }

    .status-badge .ponto-pisca {
      width: 5px;
      height: 5px;
      background-color: #ff2d55;
      border-radius: 50%;
      animation: piscar 1.6s infinite;
    }

    @keyframes piscar {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    .container-letreiro {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    #txtFrase {
      display: inline-block;
      font-size: 19px;
      font-weight: 700;
      padding-left: 100%;
      animation: barraTexto 14s linear infinite;
    }

    @keyframes barraTexto {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    .info-musica p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 18px;
      font-weight: 600;
    }

    .btn-play-live {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 26px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
      margin: 0 auto; 
    }

    /* ===== ESPECTRO CORRIGIDO (agora ocupa toda largura no PC) ===== */
    .espectro-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      width: 100%;
      height: 40px;
      margin-top: 25px; 
      margin-bottom: 10px;
      opacity: 0.45;
    }

    @media (max-width: 767px) {
      .espectro-container {
        max-width: 290px;
        margin-left: auto;
        margin-right: auto;
      }
    }

    @media (min-width: 768px) and (orientation: landscape) {
      .espectro-container {
        max-width: 100%;
      }
    }

    .barra-espectro {
      flex: 1;
      height: 3px;
      background: linear-gradient(to top, #00f2fe, #9b51e0, #ff2d55);
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(155, 81, 224, 0.6), 0 0 15px rgba(255, 45, 85, 0.4);
    }

    .animar .barra-espectro { animation: puloEspectro 0.5s ease infinite alternate; }
    .animar .barra-espectro:nth-child(4n+1) { animation-duration: 0.6s; }
    .animar .barra-espectro:nth-child(4n+2) { animation-duration: 0.4s; animation-delay: 0.1s; }
    .animar .barra-espectro:nth-child(4n+3) { animation-duration: 0.7s; animation-delay: 0.2s; }
    .animar .barra-espectro:nth-child(4n+4) { animation-duration: 0.5s; animation-delay: 0.15s; }

    .carregando-espectro .barra-espectro {
      animation: puloCarregando 1s ease infinite alternate;
    }
    @keyframes puloCarregando {
      0% { height: 3px; opacity: 0.2; }
      100% { height: 15px; opacity: 0.6; }
    }

    @keyframes puloEspectro {
      0% { height: 4px; }
      100% { height: 38px; }
    }

    footer {
      text-align: center;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom)) 14px; 
      background: rgba(13, 4, 26, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-weight: 500;
      width: 100%;
      z-index: 10;
    }
  </style>
</head>
<body>

<div class="bg-blur" id="fundoDinamico"></div>

<header>
  <div class="logo-area">
    <img src="logo-quadrada.png" alt="Logo EXNA FM" class="logo-img">
    <div class="titulo-radio">
      <h1>EXNA FM</h1>
      <p>A Rádio que toca todas!</p>
    </div>
  </div>
  <div class="redes-sociais">
    <a href="https://www.instagram.com/naldoaoficial" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://www.tiktok.com/@djnaldoaoficial" target="_blank"><i class="fab fa-tiktok"></i></a>

<main>
  <div class="player-layout">
    <div class="capa-wrapper">
      <img src="logo-quadrada.png" id="capaRadio" alt="Capa EXNA" class="capa-streaming">
    </div>
    <div class="player-container" id="playerCard">
      <div class="status-badge">
        <div class="ponto-pisca"></div>
        Ao Vivo
      </div>
      <div class="info-musica">
        <div class="container-letreiro">
          <span id="txtFrase">EXNA FM - SINTONIZANDO ÁUDIO...</span>
        </div>

          <i class="fas fa-play" id="iconePlay"></i>

      <div class="espectro-container" id="espectroLuz">
        <!-- 24 barras -->
        <div class="barra-espectro"></div><div class="barra-espectro"></div><div class="barra-espectro"></div><div class="barra-espectro"></div>
        <div class="barra-espectro"></div><div class="barra-espectro"></div><div class="barra-espectro"></div><div class="barra-espectro"></div>
        <div class="barra-espectro"></div><div class="barra-espectro"></div><div class="barra-espectro"></div><div class="barra-espectro"></div>
        <div class="barra-espectro"></div><div class="barra-espectro"></div><div class="barra-espectro"></div><div class="barra-espectro"></div>
        <div class="barra-espectro"></div><div class="barra-espectro"></div><div class="barra-espectro"></div><div class="barra-espectro"></div>
        <div class="barra-espectro"></div><div class="barra-espectro"></div><div class="barra-espectro"></div><div class="barra-espectro"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <p>EXNA FM &copy; 2026</p>
</footer>

<audio id="audioRadio" crossorigin="anonymous"></audio>

<script>
  // ========== LÓGICA COMPLETA (mantendo tudo original + vinhetas + sincronização "ao vivo" + play rápido) ==========
  const urlArchiveJson = "https://archive.org/metadata/exna-fm";
  const audio = document.getElementById('audioRadio');
  const btnPlayLive = document.getElementById('btnPlayLive');
  const iconePlay = document.getElementById('iconePlay');
  const playerCard = document.getElementById('playerCard');
  const txtFrase = document.getElementById('txtFrase');
  const capaRadio = document.getElementById('capaRadio');
  const fundoDinamico = document.getElementById('fundoDinamico');
  const espectroLuz = document.getElementById('espectroLuz');

  let musicas = [];
  let vinhetas = [];
  let indiceMusicaAtual = 0;
  let tocandoVinheta = false;
  let modoVinhetaAtivo = true;
  let proximoPreload = null;
  let jaSintonizouPrimeiraVez = false;
  let ultimoTimestampPlay = 0;        // usado para saber se a pausa foi longa
  const DURACAO_FAIXA_ESTIMADA = 180;

  // ========== FUNÇÕES DE IDENTIFICAÇÃO E FORMATAÇÃO ==========
  function isVinheta(nomeArquivo) {
    return nomeArquivo.toLowerCase().includes("vinheta");
  }

  function limparNomeMusica(nomeArquivo) {
    let nome = nomeArquivo.replace(/^\d+\s*/, '').replace(/\.mp3$/i, '').replace(/[-_]/g, ' ').trim();
    return nome.toUpperCase() + "  •  EXNA FM";
  }

  function limparNomeVinheta(nomeArquivo) {
    let nome = nomeArquivo.replace(/\.mp3$/i, '').replace(/[-_]/g, ' ');
    nome = nome.replace(/^\d*\s*vinheta\s*/i, '').replace(/vinheta\s*/i, '');
    if (nome.trim() === "") nome = "Vinheta";
    return `🔊 VINHETA: ${nome.toUpperCase()}`;
  }

  // ========== CAPA (iTunes) ==========
  async function atualizarCapaMusica(musica) {
    try {
      let termoBusca = musica.title || musica.id.replace(/\.mp3$/i, '').replace(/^\d+\s*/, '').replace(/[-_]/g, ' ');
      const resposta = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(termoBusca)}&entity=song&limit=1`);
      const resultado = await resposta.json();
      if (resultado.results && resultado.results.length > 0) {
        const capaHD = resultado.results[0].artworkUrl100.replace('100x100bb.jpg', '600x600bb.jpg');
        capaRadio.src = capaHD;
        fundoDinamico.style.backgroundImage = `url('${capaHD}')`;
      } else {
        capaRadio.src = "logo-quadrada.png";
        fundoDinamico.style.backgroundImage = "url('logo-quadrada.png')";
      }
    } catch(e) {
      capaRadio.src = "logo-quadrada.png";
      fundoDinamico.style.backgroundImage = "url('logo-quadrada.png')";
    }
  }

  // ========== ATUALIZA INTERFACE (NOME E CAPA) ==========
  async function atualizarInterface(item, isVinheta) {
    if (isVinheta) {
      txtFrase.innerText = limparNomeVinheta(item.id);
      capaRadio.src = "logo-quadrada.png";
      fundoDinamico.style.backgroundImage = "url('logo-quadrada.png')";
    } else {
      if (item.title) {
        let artista = item.artist ? item.artist : "Desconhecido";
        let titulo = item.title;
        txtFrase.innerText = `${titulo.toUpperCase()} - ${artista.toUpperCase()}  •  EXNA FM`;
      } else {
        txtFrase.innerText = limparNomeMusica(item.id);
      }
      await atualizarCapaMusica(item);
    }
    if ('mediaSession' in navigator) {
      let titulo = isVinheta ? limparNomeVinheta(item.id) : (item.title ? item.title : limparNomeMusica(item.id));
      navigator.mediaSession.metadata = new MediaMetadata({
        title: titulo,
        artist: isVinheta ? 'EXNA FM - Vinheta' : 'RÁDIO EXNA FM - AO VIVO',
        album: 'A RÁDIO QUE TOCA TODAS!',
        artwork: [{ src: capaRadio.src, sizes: '600x600', type: 'image/jpeg' }]
      });
      navigator.mediaSession.setActionHandler('play', comandarPlayer);
      navigator.mediaSession.setActionHandler('pause', comandarPlayer);
    }
  }

  // ========== EMBARALHAMENTO DIÁRIO (MESMO DO ORIGINAL) ==========
  function embaralharMusicas(lista) {
    let dataHoje = new Date();
    let semente = dataHoje.getDate() + dataHoje.getMonth() + dataHoje.getFullYear();
    function randomSemente() {
      let x = Math.sin(semente++) * 10000;
      return x - Math.floor(x);
    }
    for (let i = lista.length - 1; i > 0; i--) {
      const j = Math.floor(randomSemente() * (i + 1));
      [lista[i], lista[j]] = [lista[j], lista[i]];
    }
  }

  // ========== CARREGAR MÚSICAS E VINHETAS DO ARCHIVE ==========
  async function carregarAutoDJ() {
    try {
      const resposta = await fetch(urlArchiveJson);
      const dados = await resposta.json();
      const arquivos = dados.files || [];
      musicas = [];
      vinhetas = [];
      for (const arq of arquivos) {
        if (arq.name.endsWith('.mp3')) {
          const item = {
            id: arq.name,
            url: `https://archive.org/download/exna-fm/${arq.name}`,
            title: arq.title || null,
            artist: arq.artist || null
          };
          if (isVinheta(arq.name)) {
            vinhetas.push(item);
          } else {
            musicas.push(item);
          }
        }
      }
      if (musicas.length > 0) {
        musicas.sort((a,b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
        embaralharMusicas(musicas);
        modoVinhetaAtivo = (vinhetas.length > 0);
        calcularPontoInicial();       // sincroniza com o horário real
        iniciarPreloadProxima();
        setInterval(() => {
          // Se a rádio estiver pausada e nunca tocou, tenta sincronizar novamente
          if (audio.paused && !jaSintonizouPrimeiraVez && iconePlay.className === "fas fa-play") {
            calcularPontoInicial();
          }
        }, 1000);
      } else {
        txtFrase.innerText = "EXNA FM - NENHUMA MÚSICA ENCONTRADA";
      }
    } catch(erro) {
      console.error(erro);
      txtFrase.innerText = "EXNA FM - ERRO DE SINTONIA";
    }
  }

  // ========== SINCRO: CALCULA EM QUAL SEGUNDO DA MÚSICA DEVE ESTAR (BASEADO NO HORÁRIO) ==========
  function calcularPontoInicial() {
    if (jaSintonizouPrimeiraVez) return;
    if (musicas.length === 0) return;
    const agora = new Date();
    const segundosDia = (agora.getHours() * 3600) + (agora.getMinutes() * 60) + agora.getSeconds();
    const duracaoTotalGrade = musicas.length * DURACAO_FAIXA_ESTIMADA;
    const segundoAtualLoop = segundosDia % duracaoTotalGrade;
    indiceMusicaAtual = Math.floor(segundoAtualLoop / DURACAO_FAIXA_ESTIMADA);
    const offsetMusica = segundoAtualLoop % DURACAO_FAIXA_ESTIMADA;
    const musicaAtual = musicas[indiceMusicaAtual];
    audio.src = musicaAtual.url;
    audio.currentTime = offsetMusica;
    atualizarInterface(musicaAtual, false);
  }

  // ========== PRÉ-CARREGAMENTO (PARA TRANSIÇÃO INSTANTÂNEA) ==========
  function iniciarPreloadProxima() {
    if (!modoVinhetaAtivo || vinhetas.length === 0) {
      let proxIndice = (indiceMusicaAtual + 1) % musicas.length;
      let proximaMusica = musicas[proxIndice];
      if (proximaMusica) {
        proximoPreload = new Audio();
        proximoPreload.src = proximaMusica.url;
        proximoPreload.load();
      }
    } else {
      let vinhetaAleatoria = vinhetas[Math.floor(Math.random() * vinhetas.length)];
      proximoPreload = new Audio();
      proximoPreload.src = vinhetaAleatoria.url;
      proximoPreload.load();
    }
  }

  // ========== AVANÇA PARA PRÓXIMA FAIXA (MÚSICA → VINHETA → PRÓXIMA MÚSICA) ==========
  function tocarProximaFaixa() {
    if (tocandoVinheta) {
      // Terminou a vinheta: toca a próxima música
      tocandoVinheta = false;
      indiceMusicaAtual = (indiceMusicaAtual + 1) % musicas.length;
      const proximaMusica = musicas[indiceMusicaAtual];
      if (proximoPreload && proximoPreload.src === proximaMusica.url) {
        audio.src = proximoPreload.src;
        proximoPreload = null;
      } else {
        audio.src = proximaMusica.url;
      }
      atualizarInterface(proximaMusica, false);
      audio.play().catch(e => console.log(e));
      // Pré-carrega a próxima vinheta
      if (modoVinhetaAtivo && vinhetas.length) {
        let proxVinheta = vinhetas[Math.floor(Math.random() * vinhetas.length)];
        proximoPreload = new Audio();
        proximoPreload.src = proxVinheta.url;
        proximoPreload.load();
      } else {
        let proxIndice = (indiceMusicaAtual + 1) % musicas.length;
        let proxMus = musicas[proxIndice];
        proximoPreload = new Audio();
        proximoPreload.src = proxMus.url;
        proximoPreload.load();
      }
    } else {
      // Terminou a música: toca uma vinheta (se houver)
      if (modoVinhetaAtivo && vinhetas.length > 0) {
        tocandoVinheta = true;
        let vinhetaAleatoria = vinhetas[Math.floor(Math.random() * vinhetas.length)];
        if (proximoPreload && proximoPreload.src === vinhetaAleatoria.url) {
          audio.src = proximoPreload.src;
          proximoPreload = null;
        } else {
          audio.src = vinhetaAleatoria.url;
        }
        atualizarInterface(vinhetaAleatoria, true);
        audio.play().catch(e => console.log(e));
        // Pré-carrega a próxima música
        let proxIndice = (indiceMusicaAtual + 1) % musicas.length;
        let proxMus = musicas[proxIndice];
        proximoPreload = new Audio();
        proximoPreload.src = proxMus.url;
        proximoPreload.load();
      } else {
        // Sem vinhetas: vai direto para a próxima música
        indiceMusicaAtual = (indiceMusicaAtual + 1) % musicas.length;
        const proximaMusica = musicas[indiceMusicaAtual];
        if (proximoPreload && proximoPreload.src === proximaMusica.url) {
          audio.src = proximoPreload.src;
          proximoPreload = null;
        } else {
          audio.src = proximaMusica.url;
        }
        atualizarInterface(proximaMusica, false);
        audio.play().catch(e => console.log(e));
        if (modoVinhetaAtivo && vinhetas.length) {
          let proxVinheta = vinhetas[Math.floor(Math.random() * vinhetas.length)];
          proximoPreload = new Audio();
          proximoPreload.src = proxVinheta.url;
          proximoPreload.load();
        } else {
          let proxIndice = (indiceMusicaAtual + 1) % musicas.length;
          let proxMus = musicas[proxIndice];
          proximoPreload = new Audio();
          proximoPreload.src = proxMus.url;
          proximoPreload.load();
        }
      }
    }
    iconePlay.className = "fas fa-pause";
    playerCard.classList.add('tocando');
    espectroLuz.classList.remove('carregando-espectro');
    espectroLuz.classList.add('animar');
  }

  audio.addEventListener('ended', () => {
    tocarProximaFaixa();
  });

  // ========== PLAY/PAUSE COM SINC "AO VIVO" (SE PAUSOU MUITO TEMPO, VOLTA PARA O HORÁRIO REAL) ==========
  function comandarPlayer() {
    if (audio.paused) {
      // Mostra efeito de carregamento
      iconePlay.className = "fas fa-spinner fa-spin";
      espectroLuz.classList.add('carregando-espectro');

      const agora = Date.now();
      const tempoPausado = (ultimoTimestampPlay > 0) ? (agora - ultimoTimestampPlay) / 1000 : 0;

      // Se ficou pausado por mais de 5 segundos, recalcula a posição com base no horário (ao vivo)
      if (tempoPausado > 5 && jaSintonizouPrimeiraVez) {
        // Recalcula a posição real da programação
        const agoraRelogio = new Date();
        const segundosDia = (agoraRelogio.getHours() * 3600) + (agoraRelogio.getMinutes() * 60) + agoraRelogio.getSeconds();
        const duracaoTotalGrade = musicas.length * DURACAO_FAIXA_ESTIMADA;
        const segundoAtualLoop = segundosDia % duracaoTotalGrade;
        const novoIndice = Math.floor(segundoAtualLoop / DURACAO_FAIXA_ESTIMADA);
        const novoOffset = segundoAtualLoop % DURACAO_FAIXA_ESTIMADA;
        if (novoIndice !== indiceMusicaAtual || Math.abs(audio.currentTime - novoOffset) > 2) {
          indiceMusicaAtual = novoIndice;
          const novaMusica = musicas[indiceMusicaAtual];
          audio.src = novaMusica.url;
          audio.currentTime = novoOffset;
          atualizarInterface(novaMusica, false);
          tocandoVinheta = false; // força sair do modo vinheta
        }
      }

      // Toca o áudio (já com a posição correta)
      audio.play().then(() => {
        iconePlay.className = "fas fa-pause";
        playerCard.classList.add('tocando');
        espectroLuz.classList.remove('carregando-espectro');
        espectroLuz.classList.add('animar');
        if (!jaSintonizouPrimeiraVez) jaSintonizouPrimeiraVez = true;
        ultimoTimestampPlay = Date.now();
      }).catch(err => {
        console.log("Erro no play:", err);
        iconePlay.className = "fas fa-play";
        espectroLuz.classList.remove('carregando-espectro');
      });
    } else {
      // Pausa
      audio.pause();
      iconePlay.className = "fas fa-play";
      playerCard.classList.remove('tocando');
      espectroLuz.classList.remove('animar');
      espectroLuz.classList.remove('carregando-espectro');
      ultimoTimestampPlay = Date.now();
    }
  }

  // ========== FUNÇÃO INICIAL (PRIMEIRO PLAY) ==========
  function tocarMusicaInicial() {
    if (musicas.length === 0) return;
    const musica = musicas[indiceMusicaAtual];
    audio.src = musica.url;
    atualizarInterface(musica, false);
    audio.play().then(() => {
      iconePlay.className = "fas fa-pause";
      playerCard.classList.add('tocando');
      espectroLuz.classList.add('animar');
      tocandoVinheta = false;
      jaSintonizouPrimeiraVez = true;
      ultimoTimestampPlay = Date.now();
      // Pré-carrega a próxima faixa (vinheta ou música)
      if (modoVinhetaAtivo && vinhetas.length) {
        let vinhetaAleatoria = vinhetas[Math.floor(Math.random() * vinhetas.length)];
        proximoPreload = new Audio();
        proximoPreload.src = vinhetaAleatoria.url;
        proximoPreload.load();
      } else {
        let proxIndice = (indiceMusicaAtual + 1) % musicas.length;
        let proxMus = musicas[proxIndice];
        proximoPreload = new Audio();
        proximoPreload.src = proxMus.url;
        proximoPreload.load();
      }
    }).catch(e => console.log(e));
  }

  // ========== EVENTO DE PLAYING (REMOVE SPINNER) ==========
  audio.addEventListener('playing', () => {
    if(iconePlay.className === "fas fa-spinner fa-spin") {
      iconePlay.className = "fas fa-pause";
      playerCard.classList.add('tocando');
      espectroLuz.classList.remove('carregando-espectro');
      espectroLuz.classList.add('animar');
    }
  });

  // ========== GERENCIA VISIBILIDADE (TRAVA O ÁUDIO? NÃO, APENAS SINCRONIZA) ==========
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && audio.paused && iconePlay.className !== "fas fa-play") {
      // Se estava tocando mas o áudio pausou (por economia do sistema), tentamos retomar sincronizado
      if (musicas.length && !tocandoVinheta) {
        // Recalcula posição ao vivo
        const agora = new Date();
        const segundosDia = (agora.getHours() * 3600) + (agora.getMinutes() * 60) + agora.getSeconds();
        const duracaoTotalGrade = musicas.length * DURACAO_FAIXA_ESTIMADA;
        const segundoAtualLoop = segundosDia % duracaoTotalGrade;
        const novoIndice = Math.floor(segundoAtualLoop / DURACAO_FAIXA_ESTIMADA);
        const novoOffset = segundoAtualLoop % DURACAO_FAIXA_ESTIMADA;
        if (novoIndice !== indiceMusicaAtual || Math.abs(audio.currentTime - novoOffset) > 2) {
          indiceMusicaAtual = novoIndice;
          const novaMusica = musicas[indiceMusicaAtual];
          audio.src = novaMusica.url;
          audio.currentTime = novoOffset;
          atualizarInterface(novaMusica, false);
        }
        audio.play().catch(e => console.log(e));
      }
    }
  });

  btnPlayLive.addEventListener('click', comandarPlayer);
  carregarAutoDJ();
</script>
