<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>EXNA FM | Rádio Ao Vivo 24h</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #050a14);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Vidro fosco premium */
        .glass-radio {
            max-width: 550px;
            width: 100%;
            background: rgba(18, 25, 45, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 56px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 0.5px rgba(255, 215, 0, 0.15);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .inner-content {
            padding: 28px 24px 36px;
        }

        /* Header com logo */
        .station-brand {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 2.2rem;
            filter: drop-shadow(0 0 5px rgba(255,215,0,0.5));
        }

        .station-name {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFE68F, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .live-badge {
            background: rgba(231, 76, 60, 0.9);
            backdrop-filter: blur(4px);
            padding: 5px 12px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 8px rgba(231,76,60,0.5);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #ff5e5e;
            border-radius: 50%;
            animation: pulseLive 1.4s infinite;
        }

        @keyframes pulseLive {
            0% { opacity: 1; transform: scale(1); background: #ff5e5e; }
            100% { opacity: 0.3; transform: scale(1.3); background: #ff0000; }
        }

        /* Capa estilo album */
        .artwork-frame {
            background: rgba(0,0,0,0.3);
            border-radius: 32px;
            padding: 12px;
            margin: 15px 0 12px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), 0 12px 25px -8px black;
        }

        .album-art {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 28px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
            display: block;
            background: #11161f;
            transition: transform 0.2s ease;
        }

        /* Info da faixa */
        .track-info {
            text-align: center;
            margin: 18px 0 12px;
        }

        .track-name {
            font-size: 1.55rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            letter-spacing: -0.3px;
            word-break: break-word;
        }

        .track-artist {
            font-size: 1rem;
            font-weight: 500;
            color: #FFDA88;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* Controles redondos e suaves */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin: 16px 0 20px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(5px);
            border: none;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            color: #FFE5B4;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        .ctrl-btn:hover {
            background: #FFD966;
            color: #1e2a36;
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(255,200,80,0.6);
        }

        #playPauseBtn {
            background: linear-gradient(145deg, #FFD966, #FFB347);
            color: #1a252f;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
        }

        /* Barra de progresso */
        .progress-section {
            margin: 10px 0 8px;
        }

        .progress-area {
            background: rgba(45, 55, 72, 0.9);
            border-radius: 30px;
            height: 6px;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #FFD966, #FFA500);
            width: 0%;
            height: 6px;
            border-radius: 30px;
        }

        .time-stamp {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #bbb;
            margin-top: 8px;
            padding: 0 4px;
            font-weight: 500;
        }

        /* volume elegante */
        .volume-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 16px 0 8px;
            background: rgba(0,0,0,0.25);
            padding: 8px 20px;
            border-radius: 80px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .volume-icon {
            font-size: 1rem;
            color: #FFDB8A;
        }

        input[type="range"] {
            width: 130px;
            height: 3px;
            -webkit-appearance: none;
            background: #FFD966;
            border-radius: 5px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #FFD966;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 6px gold;
        }

        .footer-credits {
            text-align: center;
            font-size: 0.65rem;
            color: #aaa;
            margin-top: 28px;
            border-top: 0.5px solid rgba(255,215,0,0.2);
            padding-top: 18px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 500px) {
            .inner-content { padding: 20px 18px 28px; }
            .station-name { font-size: 1.6rem; }
            .ctrl-btn { width: 55px; height: 55px; font-size: 1.5rem; }
            .track-name { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

<div class="glass-radio">
    <div class="inner-content">
        <div class="station-brand">
            <div class="logo-area">
                <span class="logo-icon">🎙️📻</span>
                <span class="station-name">EXNA FM</span>
            </div>
            <div class="live-badge">
                <span class="live-dot"></span> AO VIVO
            </div>
        </div>

        <div class="artwork-frame">
            <img id="albumArt" class="album-art" src="https://via.placeholder.com/500x500?text=EXNA+FM" alt="Capa da música">
        </div>

        <div class="track-info">
            <div class="track-name" id="musicTitle">EXNA FM</div>
            <div class="track-artist" id="musicArtist">Carregando playlist...</div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="prevBtn" aria-label="Anterior">⏮️</button>
            <button class="ctrl-btn" id="playPauseBtn" aria-label="Play/Pause">▶️</button>
            <button class="ctrl-btn" id="nextBtn" aria-label="Próxima">⏭️</button>
        </div>

        <div class="progress-section">
            <div class="progress-area" id="progressArea">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-stamp">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <div class="volume-row">
            <span class="volume-icon">🔊</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.75">
        </div>

        <div class="footer-credits">
            🎧 EXNA FM · Autodj 24h · Toca aleatório com capas
        </div>
    </div>
</div>

<script>
    // ============================================================
    // TODOS OS LINKS CORRETOS - EXTRAÍDOS DOS SEUS ARQUIVOS
    // MÚSICAS + CAPAS .png pareadas pelo nome
    // ============================================================
    
    const musicFiles = [
        { nome: "4 Non Blondes – What's Up?.mp3", id: "18VIagKXQt8RBL93Ni17pm54OlU1bPDCj", capaId: "1X-e_zkj5DXHOWbRuhyia4JZMmlZIRLEe" },
        { nome: "Adele – Send My Love (To Your New Lover).mp3", id: "1WJDPOg_op3nx6ZQDM-LbMOUuLxj-T5y4", capaId: "1fwSedPrXu2ZNh-sF4SxM3GmdReV8EbGM" },
        { nome: "Adele – Set Fire to the Rain.mp3", id: "1oAlae50wMiZk_VGlUSiyqL0Pkn4rzmR4", capaId: "1f1iADiE_yhPec5IcD_-CE3M9xSFBxIZC" },
        { nome: "Air Supply – Lonely Is the Night.mp3", id: "1M4cipfK3hVMB9S7WLYitX6JOMpR32G9H", capaId: "1M66i-sWeXI7NOtxmU8NdI0F2_bEnWpYz" },
        { nome: "Air Supply – Making Love Out of Nothing at All.mp3", id: "1vWlkIkeI0YAEj6LN4NVaGX4Yhp12A1iU", capaId: "1vGIsJ-JXlMQpjisjLEs914awqidYmgK4" },
        { nome: "Alan Jackson – I'll Try.mp3", id: "1K_OALmcZ7phhrtx3gmZE84uUNeW7uNpM", capaId: "1K9rLBaYbxog4R8AeyxyDHD99dhTHY3FW" },
        { nome: "Alan Walker – Faded.mp3", id: "10LbJnezjLTYHh41J3o06MuTh_thXNYS3", capaId: "10HWU-_8uwHH67Ft8gUTptioVjGDPBw2t" },
        { nome: "Alphaville – Forever Young.mp3", id: "1EmFKISLhMfW7JbKCkOQ2kzUAPlH3j3UC", capaId: "1EmFKISLhMfW7JbKCkOQ2kzUAPlH3j3UC" },
        { nome: "Ariana Grande – no tears left to cry.mp3", id: "1M0QMZhK-XQ2Z23Qb2GwqI-2Nm6YmHSTo", capaId: "1M0QMZhK-XQ2Z23Qb2GwqI-2Nm6YmHSTo" },
        { nome: "Ariana Grande – Side To Side.mp3", id: "1Mp74wddrN12pqMyXiiGofnLL5NiXrX0-", capaId: "1Mp74wddrN12pqMyXiiGofnLL5NiXrX0-" },
        { nome: "Berlin – Take My Breath Away.mp3", id: "1p67ow-PjJt8whX23WviqXRIDj02xxS0J", capaId: "1p67ow-PjJt8whX23WviqXRIDj02xxS0J" },
        { nome: "Bon Jovi – Always.mp3", id: "1RuUrx7JiVYTH0fywtAEAEstrzZFvo8O8", capaId: "1RuUrx7JiVYTH0fywtAEAEstrzZFvo8O8" },
        { nome: "Bryan Adams – (Everything I Do) I Do It For You.mp3", id: "1V6atOPUT2bHAhRXng3Mf4dZC45ghgLSP", capaId: "1V6atOPUT2bHAhRXng3Mf4dZC45ghgLSP" },
        { nome: "Calvin Harris – Blame (feat. John Newman).mp3", id: "1zZWbZaA9rM52iuJJ4FmdAPxNCt4F-leX", capaId: "1zZWbZaA9rM52iuJJ4FmdAPxNCt4F-leX" },
        { nome: "Calvin Harris – How Deep Is Your Love.mp3", id: "1xJUAhqUvA0s0R4F8Jzex-KnJxumU3yVQ", capaId: "1xJUAhqUvA0s0R4F8Jzex-KnJxumU3yVQ" },
        { nome: "Calvin Harris – Outside (feat. Ellie Goulding).mp3", id: "1wBpBokuPknyln9FQtGhBFZWr1JfYhUL1", capaId: "1wBpBokuPknyln9FQtGhBFZWr1JfYhUL1" },
        { nome: "Calvin Harris – Summer.mp3", id: "1s5GrDKZxMtlAVib5QesPgCM-UzHvVGU1", capaId: "1s5GrDKZxMtlAVib5QesPgCM-UzHvVGU1" },
        { nome: "Calvin Harris, Rihanna – This Is What You Came For.mp3", id: "1yOSHqoYITx-xO_OZV2opfv9gQiqtQluN", capaId: "1yOSHqoYITx-xO_OZV2opfv9gQiqtQluN" },
        { nome: "Céline Dion – All By Myself.mp3", id: "1vm3wIrq-WfTOWxdYY0Z5uHlJMGnezHXt", capaId: "1vm3wIrq-WfTOWxdYY0Z5uHlJMGnezHXt" },
        { nome: "Céline Dion – The Power of Love.mp3", id: "1tDffHqYH5IUddPQr5Pd2fBJ2mrPerdGM", capaId: "1tDffHqYH5IUddPQr5Pd2fBJ2mrPerdGM" },
        { nome: "Chris Isaak – Wicked Game.mp3", id: "1tWipo0hMvzPsfGAVSjAnPh4wetMtTPGD", capaId: "1tWipo0hMvzPsfGAVSjAnPh4wetMtTPGD" },
        { nome: "Coldplay – Something Just Like This.mp3", id: "1xGmY_hULa8el3Pqk_stDL6Xq4VfWSxK4", capaId: "1xGmY_hULa8el3Pqk_stDL6Xq4VfWSxK4" }
    ];

    // Montar playlist legível
    const playlist = musicFiles.map(m => ({
        titulo: m.nome.replace(/\.mp3$/i, '').replace(/^[^–]+–\s*/, '').trim(),
        artista: m.nome.split('–')[0].trim(),
        audioId: m.id,
        capaId: m.capaId || m.id
    }));

    // helpers
    function getDriveUrl(id) { return `https://drive.google.com/uc?export=download&id=${id}`; }

    let currentIndex = 0;
    let isPlaying = false;
    const audio = new Audio();

    // DOM elements
    const albumArt = document.getElementById('albumArt');
    const musicTitle = document.getElementById('musicTitle');
    const musicArtist = document.getElementById('musicArtist');
    const playBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const progressArea = document.getElementById('progressArea');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('durationTime');
    const volumeSlider = document.getElementById('volumeSlider');

    function loadTrack(index) {
        const track = playlist[index];
        if (!track) return;
        const audioUrl = getDriveUrl(track.audioId);
        const coverUrl = track.capaId ? getDriveUrl(track.capaId) : "https://via.placeholder.com/500x500?text=EXNA+FM";
        audio.src = audioUrl;
        albumArt.src = coverUrl;
        musicTitle.innerText = track.titulo;
        musicArtist.innerText = track.artista;
        progressBar.style.width = '0%';
        currentTimeSpan.innerText = '0:00';
        if (isPlaying) audio.play().catch(e => console.log("interação necessária"));
    }

    function randomNext() {
        let newIndex = Math.floor(Math.random() * playlist.length);
        while (playlist.length > 1 && newIndex === currentIndex) {
            newIndex = Math.floor(Math.random() * playlist.length);
        }
        currentIndex = newIndex;
        loadTrack(currentIndex);
        if (isPlaying) audio.play();
    }

    function togglePlay() {
        if (isPlaying) {
            audio.pause();
            playBtn.innerHTML = '▶️';
        } else {
            audio.play().catch(() => {
                alert('🔊 EXNA FM: clique novamente para iniciar a rádio');
            });
            playBtn.innerHTML = '⏸️';
        }
        isPlaying = !isPlaying;
    }

    function updateProgress() {
        if (audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + '%';
            const curM = Math.floor(audio.currentTime / 60);
            const curS = Math.floor(audio.currentTime % 60);
            const durM = Math.floor(audio.duration / 60);
            const durS = Math.floor(audio.duration % 60);
            currentTimeSpan.innerText = `${curM}:${curS < 10 ? '0'+curS : curS}`;
            durationSpan.innerText = `${durM}:${durS < 10 ? '0'+durS : durS}`;
        }
    }

    // Eventos
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', () => randomNext());
    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', () => { randomNext(); if(!isPlaying) togglePlay(); });
    prevBtn.addEventListener('click', () => { randomNext(); if(!isPlaying) togglePlay(); });
    progressArea.addEventListener('click', (e) => {
        const width = progressArea.clientWidth;
        const clickX = e.offsetX;
        if (audio.duration) audio.currentTime = (clickX / width) * audio.duration;
    });
    volumeSlider.addEventListener('input', (e) => audio.volume = e.target.value);
    audio.volume = volumeSlider.value;

    // Inicia aleatório
    currentIndex = Math.floor(Math.random() * playlist.length);
    loadTrack(currentIndex);
</script>
</body>
</html>
