<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADIO EXNA FM</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo-quadrada.png">

    <style>
        :root {
            --primary-purple: #8a2be2;
            --neon-aqua: #66fcf1;
            --neon-pink: #ff0055;
            --dark-bg: #050608;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--dark-bg);
            background-image:
                radial-gradient(circle at 15% 15%, rgba(138, 43, 226, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.15) 0%, transparent 45%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-player {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            width: 100%;
            max-width: 380px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.02);
            position: relative;
        }

        .radio-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
        }

        .radio-top-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--neon-aqua));
        }

        .radio-brand-text h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            margin: 0;
            letter-spacing: 1px;
            text-align: left;
        }

        .radio-brand-text h2 span {
            color: var(--neon-aqua);
        }

        .radio-brand-text p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            text-align: left;
        }

        .live-indicator {
            background: var(--neon-pink);
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px var(--neon-pink);
            animation: pulse 2s infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        .cover-area {
            width: 220px;
            height: 220px;
            margin: 0 auto 25px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }

        .playing .cover-area {
            border-color: var(--neon-aqua);
            box-shadow: 0 0 30px rgba(102,252,241,0.25);
            transform: scale(1.02);
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #111;
        }

        .info-area h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            margin: 0;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-area p {
            font-size: 1.1rem;
            color: var(--neon-aqua);
            margin: 6px 0 25px;
            font-weight: 600;
        }

        .play-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(45deg, var(--primary-purple), var(--neon-pink));
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            box-shadow: 0 0 25px rgba(138,43,226,0.4);
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255,0,85,0.5);
        }

        .play-btn.active {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px #fff;
        }

        .pwa-float-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--neon-aqua);
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
            z-index: 999;
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
        }

        .pwa-float-btn.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        footer {
            padding: 25px;
            text-align: center;
            background: rgba(0,0,0,0.4);
            border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .social-links {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 22px;
        }

        .social-links a {
            color: var(--neon-aqua);
            font-size: 1.4rem;
            transition: 0.3s;
        }

        .copyright {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<main>
    <div class="glass-player" id="main-player">

        <div class="radio-header">
            <img src="logo-quadrada.png" class="radio-top-logo">

            <div class="radio-brand-text">
                <h2>EXNA <span>FM</span></h2>
                <p>A Rádio que toca todas!</p>
            </div>
        </div>

        <div class="live-indicator">
            <i class="fas fa-broadcast-tower"></i>
            TRANSMISSÃO EM TEMPO REAL
        </div>

        <div class="cover-area">
            <img src="logo-quadrada.png" id="track-cover" class="cover-img">
        </div>

        <div class="info-area">
            <h1 id="track-title">SINTONIZANDO...</h1>
            <p id="artist-name">DJ NaldoA</p>
        </div>

        <button class="play-btn" id="master-play" onclick="toggleRadio()" disabled>
            <i class="fas fa-spinner fa-spin" id="btn-icon"></i>
        </button>

        <p id="status-text" style="margin-top:20px;font-size:0.8rem;color:#45a29e;font-weight:bold;letter-spacing:1px;"></p>

    </div>
</main>

<footer>
    <div class="social-links">
        <a href="https://instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://youtube.com/" target="_blank"><i class="fab fa-youtube"></i></a>
        <a href="https://tiktok.com/" target="_blank"><i class="fab fa-tiktok"></i></a>
    </div>

    <div class="copyright">
        EXNA FM © 2026 | NaldoA | Todos os Direitos Reservados
    </div>
</footer>

<audio id="audio-core" crossorigin="anonymous" preload="auto"></audio>

<script>

const STREAM_URL = "COLOQUE_SEU_STREAM_AQUI";

const player = document.getElementById('audio-core');
const btn = document.getElementById('master-play');
const icon = document.getElementById('btn-icon');
const card = document.getElementById('main-player');

const txtTitle = document.getElementById('track-title');
const txtCover = document.getElementById('track-cover');
const txtStatus = document.getElementById('status-text');
const artistName = document.getElementById('artist-name');

player.src = STREAM_URL;

btn.disabled = false;

icon.className = "fas fa-play";

txtTitle.innerText = "EXNA FM";
artistName.innerText = "A Rádio que toca todas!";
txtStatus.innerText = "Pronto para tocar";

function updateLockScreen() {

    if ('mediaSession' in navigator) {

        navigator.mediaSession.metadata = new MediaMetadata({
            title: txtTitle.innerText,
            artist: artistName.innerText,
            album: 'RADIO EXNA FM',

            artwork: [
                {
                    src: txtCover.src,
                    sizes: '512x512',
                    type: 'image/png'
                }
            ]
        });

        navigator.mediaSession.playbackState =
            player.paused ? "paused" : "playing";

        navigator.mediaSession.setActionHandler('play', async () => {

            try {

                await player.play();

                navigator.mediaSession.playbackState = "playing";

                icon.className = "fas fa-stop";

                btn.classList.add('active');

                card.classList.add('playing');

                txtStatus.innerText =
                    "Transmissão Digital em Tempo Real";

            } catch(e) {}

        });

        navigator.mediaSession.setActionHandler('pause', () => {

            player.pause();

            navigator.mediaSession.playbackState = "paused";

            icon.className = "fas fa-play";

            btn.classList.remove('active');

            card.classList.remove('playing');

            txtStatus.innerText = "Transmissão em espera";

        });

        navigator.mediaSession.setActionHandler('stop', () => {

            player.pause();

            navigator.mediaSession.playbackState = "paused";

            icon.className = "fas fa-play";

            btn.classList.remove('active');

            card.classList.remove('playing');

            txtStatus.innerText = "Transmissão parada";

        });

    }
}

function toggleRadio() {

    if (player.paused) {

        icon.className = "fas fa-spinner fa-spin";

        player.play().then(() => {

            icon.className = "fas fa-stop";

            btn.classList.add('active');

            card.classList.add('playing');

            txtStatus.innerText =
                "Transmissão Digital em Tempo Real";

            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = "playing";
            }

            updateLockScreen();

        }).catch(() => {

            icon.className = "fas fa-play";

            txtStatus.innerText =
                "Erro ao iniciar transmissão";

        });

    } else {

        player.pause();

        icon.className = "fas fa-play";

        btn.classList.remove('active');

        card.classList.remove('playing');

        txtStatus.innerText = "Transmissão em espera";

        if ('mediaSession' in navigator) {
            navigator.mediaSession.playbackState = "paused";
        }
    }
}

player.addEventListener('play', () => {
    updateLockScreen();
});

player.addEventListener('pause', () => {

    if ('mediaSession' in navigator') {
        navigator.mediaSession.playbackState = "paused";
    }
});

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
}

</script>

</body>
</html>
