<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADIO EXNA FM - STREAM AO VIVO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo-quadrada.png">
            
    <style>
        :root {
            --primary-purple: #8a2be2;
            --neon-aqua: #66fcf1;
            --neon-pink: #ff0055;
            --dark-bg: #050608;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(138, 43, 226, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.15) 0%, transparent 45%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-player {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            width: 100%;
            max-width: 380px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.02);
            position: relative;
        }

        .radio-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .radio-top-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--neon-aqua));
        }

        .radio-brand-text h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            margin: 0;
            letter-spacing: 1px;
            text-align: left;
        }

        .radio-brand-text h2 span { color: var(--neon-aqua); }

        .radio-brand-text p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            text-align: left;
        }

        .live-indicator {
            background: var(--neon-pink);
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px var(--neon-pink);
            animation: pulse 2s infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

        .cover-area {
            width: 220px;
            height: 220px;
            margin: 0 auto 25px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            position: relative;
        }

        .playing .cover-area {
            border-color: var(--neon-aqua);
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.25);
            transform: scale(1.02);
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #111;
        }

        .loading-cover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--neon-aqua);
            font-size: 2rem;
            z-index: 2;
            display: none;
        }

        .info-area h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            margin: 0;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-area p {
            font-size: 1.1rem;
            color: var(--neon-aqua);
            margin: 6px 0 25px;
            font-weight: 600;
        }

        .play-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(45deg, var(--primary-purple), var(--neon-pink));
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.5);
        }

        .play-btn.active {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px #fff;
        }

        .timer-info {
            margin-top: 15px;
            font-size: 0.7rem;
            color: var(--neon-aqua);
            font-family: monospace;
        }

        .pwa-float-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--neon-aqua);
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
        }

        .pwa-float-btn.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .pwa-float-btn:hover {
            color: white;
            background: linear-gradient(45deg, var(--primary-purple), var(--neon-pink));
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            transform: scale(1.1) translateY(-3px);
            border-color: transparent;
        }

        footer {
            padding: 25px;
            text-align: center;
            background: rgba(0,0,0,0.4);
            border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .social-links {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 22px;
        }

        .social-links a {
            color: var(--neon-aqua);
            font-size: 1.6rem;
            transition: 0.3s;
            text-decoration: none;
        }

        .social-links a:hover {
            color: var(--neon-pink);
            transform: translateY(-3px);
        }

        .copyright {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .live-badge {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ff0055;
            border-radius: 50%;
            animation: blink 1s infinite;
            margin-left: 8px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 480px) {
            .glass-player { padding: 30px 20px; margin: 10px; }
            .cover-area { width: 190px; height: 190px; }
            .pwa-float-btn { bottom: 20px; right: 20px; width: 50px; height: 50px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <main>
        <div class="glass-player" id="main-player">
            
            <div class="radio-header">
                <img src="logo-quadrada.png" class="radio-top-logo" alt="EXNA Logo">
                <div class="radio-brand-text">
                    <h2>EXNA <span>FM</span></h2>
                    <p>A Rádio que toca todas!</p>
                </div>
            </div>

            <div class="live-indicator">
                <i class="fas fa-broadcast-tower"></i> STREAM GLOBAL SINCRONIZADO <span class="live-badge"></span>
            </div>

            <div class="cover-area" id="cover-area">
                <img src="logo-quadrada.png" id="track-cover" class="cover-img" alt="Capa da Música">
                <div class="loading-cover" id="loading-cover">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>
            </div>

            <div class="info-area">
                <h1 id="track-title">SINTONIZANDO...</h1>
                <p id="artist-name">RADIO EXNA FM</p>
            </div>

            <button class="play-btn" id="master-play" onclick="toggleRadio()">
                <i class="fas fa-play" id="btn-icon"></i>
            </button>
            
            <div class="timer-info" id="timer-info"></div>
            <p id="status-text" style="margin-top:10px; font-size: 0.8rem; color: #45a29e; font-weight: bold; letter-spacing: 1px;"></p>
        </div>
    </main>

    <button id="pwa-install-btn" class="pwa-float-btn" title="Baixar App da Rádio">
        <i class="fas fa-download"></i>
    </button>

    <footer>
        <div class="social-links">
            <a href="https://www.instagram.com/naldoaoficial" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://youtube.com/@djnaldoaoficial" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://www.tiktok.com/@djnaldoaoficial" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
        <div class="copyright">
            EXNA FM © 2026 | Todos os Direitos Reservados
        </div>
    </footer>

    <audio id="audio-core" crossorigin="anonymous" preload="auto"></audio>

    <script>
        const PASTA_ID = '1vcukZmaqRgdkg6hEe-zgMjY7H9VwwY9J'; 
        const API_KEY = 'AIzaSyBVpSXuoQT0jjh6nqzKo5U1IYlaP_qolSs'; 

        const player = document.getElementById('audio-core');
        const btn = document.getElementById('master-play');
        const icon = document.getElementById('btn-icon');
        const card = document.getElementById('main-player');
        const txtTitle = document.getElementById('track-title');
        const txtCover = document.getElementById('track-cover');
        const txtStatus = document.getElementById('status-text');
        const loadingCover = document.getElementById('loading-cover');
        const timerInfo = document.getElementById('timer-info');

        let gradeOriginal = [];
        let gradeStream = [];
        let duracoesReais = [];
        let deferredPrompt;
        let isPlaying = false;
        let syncInterval = null;

        txtTitle.innerText = "SINTONIA ONLINE";
        txtStatus.innerText = "Conectando ao stream global...";

        function mostrarLoading(mostrar) {
            loadingCover.style.display = mostrar ? 'flex' : 'none';
        }

        function formatarTempo(segundos) {
            if (!segundos || isNaN(segundos)) return "0:00";
            const min = Math.floor(segundos / 60);
            const seg = Math.floor(segundos % 60);
            return `${min}:${seg.toString().padStart(2, '0')}`;
        }

        // Busca a duração real da música
        function obterDuracaoReal(url) {
            return new Promise((resolve) => {
                const audioTemp = new Audio();
                audioTemp.preload = 'metadata';
                audioTemp.onloadedmetadata = () => {
                    resolve(audioTemp.duration);
                    audioTemp.src = '';
                };
                audioTemp.onerror = () => resolve(180);
                audioTemp.src = url;
            });
        }

        async function buscarCapaNoITunes(musicaNome, artistaNome) {
            const query = encodeURIComponent(`${artistaNome} ${musicaNome}`);
            const url = `https://itunes.apple.com/search?term=${query}&limit=1&entity=song`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.results && data.results.length > 0) {
                    return data.results[0].artworkUrl100?.replace('100x100', '600x600');
                }
                return null;
            } catch (error) {
                return null;
            }
        }

        async function fetchDriveData() {
            const url = `https://www.googleapis.com/drive/v3/files?q='${PASTA_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(data.files && data.files.length > 0) {
                    let musicas = data.files.filter(f => f.name.toLowerCase().endsWith('.mp3'));
                    let imagens = data.files.filter(f => f.mimeType.includes('image'));

                    if (musicas.length === 0) {
                        txtTitle.innerText = "EXNA FM";
                        txtStatus.innerText = "Nenhuma música disponível.";
                        return;
                    }

                    // Carrega todas as músicas com suas durações reais
                    for (const m of musicas) {
                        const nomeSemExtensao = m.name.replace(/\.[^/.]+$/, "");
                        let artista = "EXNA FM";
                        let titulo = nomeSemExtensao;
                        
                        if(nomeSemExtensao.includes(" - ")) {
                            let partes = nomeSemExtensao.split(" - ");
                            artista = partes[0].trim();
                            titulo = partes[1].trim();
                        }

                        const capa = imagens.find(img => img.name.toLowerCase().startsWith(nomeSemExtensao.toLowerCase()));
                        const urlMusica = `https://www.googleapis.com/drive/v3/files/${m.id}?alt=media&key=${API_KEY}`;
                        const duracao = await obterDuracaoReal(urlMusica);
                        
                        gradeOriginal.push({
                            id: m.id,
                            name: titulo,
                            artist: artista,
                            capaUrl: capa ? `https://www.googleapis.com/drive/v3/files/${capa.id}?alt=media&key=${API_KEY}` : null,
                            duracao: duracao
                        });
                        
                        console.log(`📏 ${titulo} - ${Math.floor(duracao/60)}min ${Math.floor(duracao%60)}s`);
                    }
                    
                    gerarGradeStreamGlobal();
                    iniciarStream();
                    
                    // Toca automaticamente
                    setTimeout(() => {
                        if (!isPlaying) {
                            player.play().catch(() => {
                                icon.className = "fas fa-play";
                                txtStatus.innerText = "Clique no Play para ouvir";
                            });
                        }
                    }, 1000);

                } else {
                    txtStatus.innerText = "Pasta vazia.";
                }
            } catch (e) {
                txtStatus.innerText = "Falha ao conectar.";
                console.error(e);
            }
        }

        function gerarGradeStreamGlobal() {
            let pool = [...gradeOriginal];
            let resultado = [];
            let ultimoArtista = "";

            let dataAtual = new Date();
            let semente = dataAtual.getFullYear() * 10000 + (dataAtual.getMonth() + 1) * 100 + dataAtual.getDate();

            function randomSemente() {
                let x = Math.sin(semente++) * 10000;
                return x - Math.floor(x);
            }

            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(randomSemente() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            while(pool.length > 0) {
                let indexValido = pool.findIndex(m => m.artist.toLowerCase() !== ultimoArtista.toLowerCase());
                if(indexValido === -1) indexValido = 0;
                let selecionada = pool.splice(indexValido, 1)[0];
                resultado.push(selecionada);
                ultimoArtista = selecionada.artist;
            }

            gradeStream = resultado;
            let total = gradeStream.reduce((acc, m) => acc + m.duracao, 0);
            console.log('📻 Stream Global -', gradeStream.length, 'músicas,', Math.floor(total/60), 'minutos');
        }

        // Posição baseada nas durações REAIS
        function obterPosicaoStream() {
            let timestamp = Math.floor(Date.now() / 1000);
            let totalDuracao = gradeStream.reduce((acc, m) => acc + m.duracao, 0);
            let posicaoGlobal = timestamp % totalDuracao;
            let acumulado = 0;
            
            for (let i = 0; i < gradeStream.length; i++) {
                let duracao = gradeStream[i].duracao;
                if (posicaoGlobal >= acumulado && posicaoGlobal < acumulado + duracao) {
                    return {
                        index: i,
                        seek: posicaoGlobal - acumulado,
                        track: gradeStream[i]
                    };
                }
                acumulado += duracao;
            }
            return { index: 0, seek: 0, track: gradeStream[0] };
        }

        async function carregarMusicaStream(faixa, seekTime) {
            const url = `https://www.googleapis.com/drive/v3/files/${faixa.id}?alt=media&key=${API_KEY}`;
            
            if (player.src !== url) {
                player.src = url;
            }
            player.currentTime = seekTime;
            
            txtTitle.innerText = faixa.name.toUpperCase();
            document.getElementById('artist-name').innerHTML = faixa.artist;
            
            if (faixa.capaUrl) {
                txtCover.src = faixa.capaUrl;
            } else {
                txtCover.src = 'logo-quadrada.png';
                buscarCapaNoITunes(faixa.name, faixa.artist).then(capa => {
                    if (capa) {
                        faixa.capaUrl = capa;
                        txtCover.src = capa;
                    }
                });
            }
            
            // Tela bloqueada
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: faixa.name,
                    artist: faixa.artist,
                    album: 'EXNA FM - STREAM GLOBAL',
                    artwork: [{ src: faixa.capaUrl || 'logo-quadrada.png', sizes: '512x512' }]
                });
            }
            
            txtStatus.innerText = `🔴 AO VIVO: ${faixa.name}`;
        }

        async function iniciarStream() {
            if (!gradeStream.length) return;
            const pos = obterPosicaoStream();
            await carregarMusicaStream(pos.track, pos.seek);
            atualizarTimer();
            
            if (isPlaying) {
                player.play().catch(() => {});
            }
        }

        function atualizarTimer() {
            if (player.duration && !isNaN(player.duration)) {
                const atual = formatarTempo(player.currentTime);
                const total = formatarTempo(player.duration);
                timerInfo.innerHTML = `🎙️ LIVE | ${atual}/${total}`;
            } else {
                timerInfo.innerHTML = `🎙️ LIVE | Carregando...`;
            }
        }

        // CRUCIAL: Quando a música termina, vai para a próxima do stream
        function configurarEventos() {
            player.onended = () => {
                console.log('🎵 Música terminou, próxima do stream...');
                const pos = obterPosicaoStream();
                carregarMusicaStream(pos.track, pos.seek);
                if (isPlaying) {
                    player.play().catch(() => {});
                }
            };
            
            player.ontimeupdate = () => {
                atualizarTimer();
                // Verifica se está perto do fim e se o stream mudou
                if (player.duration && (player.duration - player.currentTime) < 1) {
                    const pos = obterPosicaoStream();
                    if (Math.abs(player.currentTime - pos.seek) > 2) {
                        player.currentTime = pos.seek;
                    }
                }
            };
            
            player.onerror = () => {
                console.log('Erro, recuperando stream...');
                const pos = obterPosicaoStream();
                carregarMusicaStream(pos.track, pos.seek);
                if (isPlaying) {
                    player.play().catch(() => {});
                }
            };
        }

        function toggleRadio() {
            if (player.paused) {
                player.play();
                isPlaying = true;
                icon.className = "fas fa-stop";
                btn.classList.add('active');
                card.classList.add('playing');
                txtStatus.innerText = "🔴 STREAM GLOBAL - AO VIVO";
            } else {
                player.pause();
                isPlaying = false;
                icon.className = "fas fa-play";
                btn.classList.remove('active');
                card.classList.remove('playing');
                txtStatus.innerText = "Pausado - Clique Play";
            }
        }

        const pwaBtn = document.getElementById('pwa-install-btn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            pwaBtn.classList.add('visible');
        });

        pwaBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                pwaBtn.classList.remove('visible');
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Service Worker error:', err));
        }

        fetchDriveData();
        configurarEventos();
    </script>
</body>
</html>
