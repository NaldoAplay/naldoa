<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EXNA FM - A Rádio que toca todas!</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EXNA FM">
  <link rel="apple-touch-icon" href="logo-quadrada.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top left, #140526, #3b092a, #03000a);
      background-size: 400% 400%;
      animation: fundoFluido 20s ease infinite;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      overflow: hidden;
    }

    @keyframes fundoFluido {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bg-blur {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('logo-quadrada.png') no-repeat center center;
      background-size: cover;
      filter: blur(60px) brightness(0.25);
      z-index: -1;
      transform: scale(1.15);
    }

    /* --- TOPO CORRIGIDO (SEM BORDA BRANCA) --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 25px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      background: transparent; /* Remove qualquer fundo residual */
    }

    .titulo-radio h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff, #b5b5b5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .titulo-radio p {
      font-size: 11px;
      color: #ff2d55;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .redes-sociais {
      display: flex;
      gap: 22px;
    }

    .redes-sociais a {
      color: #fff;
      font-size: 22px;
      text-decoration: none;
      opacity: 0.75;
      transition: transform 0.2s, color 0.2s;
    }

    .redes-sociais a:hover {
      transform: scale(1.2);
      opacity: 1;
      color: #ff2d55;
    }

    /* --- PLAYER CARD PREMIUM --- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .player-container {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 36px;
      padding: 40px 35px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    }

    .capa-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 30px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #000;
    }

    .capa-streaming {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .tocando .capa-streaming {
      transform: scale(1.04);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 45, 85, 0.15);
      color: #ff2d55;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 45, 85, 0.25);
    }

    .status-badge .ponto-pisca {
      width: 6px;
      height: 6px;
      background-color: #ff2d55;
      border-radius: 50%;
      animation: piscar 1.6s infinite;
    }

    @keyframes piscar {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    /* --- LETREIRO DE FRASES (MARQUEE) --- */
    .container-letreiro {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      margin-bottom: 8px;
    }

    #txtFrase {
      display: inline-block;
      font-size: 22px;
      font-weight: 700;
      padding-left: 100%;
      animation: barraTexto 12s linear infinite;
    }

    @keyframes barraTexto {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    .info-musica p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 35px;
      font-weight: 600;
    }

    .btn-play-live {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 32px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(255, 255, 255, 0.25);
      transition: transform 0.2s;
    }

    .btn-play-live:active {
      transform: scale(0.92);
    }

    footer {
      text-align: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="bg-blur"></div>

  <header>
    <div class="logo-area">
      <img src="logo-quadrada.png" alt="Logo EXNA FM" class="logo-img">
      <div class="titulo-radio">
        <h1>EXNA FM</h1>
        <p>AutoDJ 24h</p>
      </div>
    </div>
    
    <div class="redes-sociais">
      <a href="https://www.instagram.com/naldoaoficial" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://www.tiktok.com/@djnaldoaoficial" target="_blank"><i class="fab fa-tiktok"></i></a>
      <a href="https://youtube.com/@djnaldoaoficial" target="_blank"><i class="fab fa-youtube"></i></a>
    </div>
  </header>

  <main>
    <div class="player-container" id="playerCard">
      <div class="capa-wrapper">
        <img src="logo-quadrada.png" id="capaRadio" alt="Capa EXNA" class="capa-streaming">
      </div>
      
      <div class="status-badge">
        <div class="ponto-pisca"></div>
        Ao Vivo
      </div>

      <div class="info-musica">
        <div class="container-letreiro">
          <span id="txtFrase">EXNA FM - A RÁDIO QUE TOCA TODAS!</span>
        </div>
        <p>Sintonizado no Melhor Ritmo</p>
      </div>
      
      <div class="controles">
        <button class="btn-play-live" id="btnPlayLive">
          <i class="fas fa-play" id="iconePlay"></i>
        </button>
      </div>
    </div>
  </main>

  <footer>
    <p>EXNA FM COPY 2026</p>
  </footer>

  <audio id="audioRadio" crossorigin="anonymous"></audio>

  <script>
    const urlArchiveJson = "https://archive.org/metadata/exna-fm";
    const audio = document.getElementById('audioRadio');
    const btnPlayLive = document.getElementById('btnPlayLive');
    const iconePlay = document.getElementById('iconePlay');
    const playerCard = document.getElementById('playerCard');
    const txtFrase = document.getElementById('txtFrase');
    const capaRadio = document.getElementById('capaRadio');

    let playlistMp3 = [];
    
    // Lista de frases institucionais que vão ficar passando na tela
    const slogansRadio = [
      "EXNA FM - A RÁDIO QUE TOCA TODAS!",
      "CONEXÃO TOTAL • SÓ AS MELHORES CONSTANTEMENTE",
      "ECOSSISTEMAS EXNA • SOM, TECNOLOGIA E RITMO",
      "SUA TRILHA SONORA DIÁRIA 24 HORAS NO AR"
    ];
    let indexFrase = 0;

    // Termos de busca no iTunes para alternar capas profissionais de música eletrônica/house/pop
    const termosCapas = ["electronic-music", "house-music", "progressive-house", "trance", "dance-hits", "techno-remix"];

    async function carregarAutoDJ() {
      try {
        const resposta = await fetch(urlArchiveJson);
        const dados = await resposta.json();
        const arquivosServidor = dados.files;

        arquivosServidor.forEach(arq => {
          if (arq.name.endsWith('.mp3')) {
            playlistMp3.push({
              id: arq.name,
              url: `https://archive.org/download/exna-fm/${arq.name}`
            });
          }
        });

        if (playlistMp3.length > 0) {
          escolherProximaMusicaAleatoria();
          // Altera as frases da tela a cada 12 segundos (tempo da animação)
          setInterval(alternarSloganTexto, 12000);
        }
      } catch (erro) {
        console.error(erro);
        txtFrase.innerText = "EXNA FM - CONEXÃO INTERROMPIDA";
      }
    }

    // Altera as frases do letreiro em loop continuo
    function alternarSloganTexto() {
      indexFrase = (indexFrase + 1) % slogansRadio.length;
      txtFrase.innerText = slogansRadio[indexFrase];
    }

    // Busca uma capa aleatória de alta qualidade na API do iTunes Store
    async function buscarCapaDoiTunes() {
      try {
        const termoAleatorio = termosCapas[Math.floor(Math.random() * termosCapas.length)];
        const resposta = await fetch(`https://itunes.apple.com/search?term=${termoAleatorio}&entity=album&limit=20`);
        const resultado = await resposta.json();
        
        if (resultado.results && resultado.results.length > 0) {
          const albumSorteado = resultado.results[Math.floor(Math.random() * resultado.results.length)];
          // Pega a arte do álbum e substitui o tamanho padrão para 600x600 pixels (alta definição)
          const capaHD = albumSorteado.artworkUrl100.replace('100x100bb.jpg', '600x600bb.jpg');
          capaRadio.src = capaHD;
        }
      } catch (e) {
        // Se a API falhar, mantém a logo padrão quadrada da rádio
        capaRadio.src = "logo-quadrada.png";
      }
    }

    function escolherProximaMusicaAleatoria() {
      const indiceSorteado = Math.floor(Math.random() * playlistMp3.length);
      const musicaTocandoAgora = playlistMp3[indiceSorteado];
      
      audio.src = musicaTocandoAgora.url;
      buscarCapaDoiTunes();
      atualizarMetadadosSistema();
    }

    function comandarPlayer() {
      if (audio.paused) {
        audio.play().then(() => {
          iconePlay.className = "fas fa-pause";
          playerCard.classList.add('tocando');
          atualizarMetadadosSistema();
        }).catch(err => console.log(err));
      } else {
        audio.pause();
        iconePlay.className = "fas fa-play";
        playerCard.classList.remove('tocando');
      }
    }

    function atualizarMetadadosSistema() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "EXNA FM - A Rádio que toca todas!", // Fica fixo com destaque na tela de bloqueio
          artist: 'AO VIVO', 
          album: 'Ecossistemas EXNA',
          artwork: [
            { src: capaRadio.src, sizes: '600x600', type: 'image/jpeg' } // Injeta a capa do iTunes na tela de bloqueio do iOS!
          ]
        });

        navigator.mediaSession.setActionHandler('play', comandarPlayer);
        navigator.mediaSession.setActionHandler('pause', comandarPlayer);
      }
    }

    audio.addEventListener('ended', () => {
      escolherProximaMusicaAleatoria();
      audio.play().then(() => {
        playerCard.classList.add('tocando');
        iconePlay.className = "fas fa-pause";
      }).catch(e => console.log(e));
    });

    btnPlayLive.addEventListener('click', comandarPlayer);
    carregarAutoDJ();
  </script>
</body>
</html>
