<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXNA FM - Rádio Ao Vivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo-quadrada.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0a0a, #000000);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .blur-bg {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: url('logo-quadrada.png') center/cover no-repeat;
            filter: blur(70px) brightness(0.3);
            z-index: 0;
            transition: background-image 0.6s ease;
        }

        .glass-player {
            position: relative;
            z-index: 2;
            background: rgba(10, 10, 15, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 48px;
            border: 1px solid rgba(102, 252, 241, 0.25);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), 0 0 0 1px rgba(102,252,241,0.1);
            width: 100%;
            max-width: 420px;
            padding: 28px 22px 35px;
            transition: all 0.3s;
        }

        .radio-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(102, 252, 241, 0.2);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-logo {
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 0 6px #66fcf1);
        }
        .brand-text h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            letter-spacing: 2px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #66fcf1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand-text p {
            font-size: 0.7rem;
            color: #ff0055;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        .live-badge {
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #ff0055;
        }
        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ff0055;
            border-radius: 50%;
            animation: piscar 1.2s infinite;
            box-shadow: 0 0 5px #ff0055;
        }
        @keyframes piscar {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .live-text {
            color: #ff0055;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .cover-area {
            margin: 15px 0 20px;
            text-align: center;
        }
        .cover-art {
            width: 210px;
            height: 210px;
            margin: 0 auto;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 0 2px rgba(102,252,241,0.2);
            transition: 0.4s;
        }
        .playing .cover-art {
            box-shadow: 0 0 28px rgba(102,252,241,0.5);
        }
        .cover-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-info {
            text-align: center;
            margin: 15px 0 10px;
        }
        .song-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 5px #66fcf1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-artist {
            font-size: 0.9rem;
            color: #66fcf1;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin: 25px 0 20px;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            font-size: 1.6rem;
            color: #ddd;
            cursor: pointer;
            transition: 0.2s;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:hover {
            color: #66fcf1;
            text-shadow: 0 0 10px #66fcf1;
            transform: scale(1.05);
        }
        .play-pause {
            background: linear-gradient(135deg, #8a2be2, #ff0055);
            width: 75px;
            height: 75px;
            font-size: 2rem;
            color: white;
            box-shadow: 0 0 20px rgba(255,0,85,0.4);
        }
        .play-pause:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px #ff0055;
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            padding: 6px 14px;
            border-radius: 60px;
            margin-top: 5px;
        }
        .volume-wrap i {
            color: #66fcf1;
            font-size: 1rem;
        }
        input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
        }
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #66fcf1;
            cursor: pointer;
            box-shadow: 0 0 6px #66fcf1;
        }

        .live-meta {
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 12px 18px;
            margin-top: 20px;
            text-align: center;
            border-left: 3px solid #ff0055;
        }
        .live-meta p {
            font-size: 0.7rem;
            color: #aaa;
            letter-spacing: 1px;
        }
        .live-meta span {
            color: #66fcf1;
            font-weight: bold;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.65rem;
            color: #555;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }
        .social-links a {
            color: #66fcf1;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .social-links a:hover {
            color: #ff0055;
            transform: scale(1.1);
        }

        @media (max-width: 480px) {
            .glass-player { padding: 20px 16px 28px; }
            .cover-art { width: 170px; height: 170px; }
            .play-pause { width: 65px; height: 65px; font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="blur-bg" id="blurBg"></div>

<div class="glass-player" id="playerContainer">
    <div class="radio-header">
        <div class="brand">
            <img src="logo-quadrada.png" class="brand-logo" alt="Logo">
            <div class="brand-text">
                <h1>EXNA<span style="color:#66fcf1;">FM</span></h1>
                <p>LIVE STREAMING</p>
            </div>
        </div>
        <div class="live-badge">
            <div class="live-dot"></div>
            <span class="live-text">AO VIVO</span>
        </div>
    </div>

    <div class="cover-area">
        <div class="cover-art" id="coverArt">
            <img src="logo-quadrada.png" id="coverImg" alt="Capa">
        </div>
    </div>

    <div class="song-info">
        <div class="song-title" id="musicTitle">EXNA FM</div>
        <div class="song-artist" id="artistName">Rádio Ao Vivo</div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" id="prevBtn" onclick="trocarStream(-1)" title="Anterior"><i class="fas fa-step-backward"></i></button>
        <button class="ctrl-btn play-pause" id="playBtn"><i class="fas fa-play" id="playIcon"></i></button>
        <button class="ctrl-btn" id="nextBtn" onclick="trocarStream(1)" title="Próximo"><i class="fas fa-step-forward"></i></button>
    </div>

    <div class="volume-wrap">
        <i class="fas fa-volume-down"></i>
        <input type="range" id="volumeSlider" min="0" max="100" value="80">
        <i class="fas fa-volume-up"></i>
    </div>

    <div class="live-meta">
        <p><i class="fas fa-microphone-alt"></i> <span id="streamName">Carregando...</span> • <span id="bitrateInfo">320kbps</span> • <span id="listeningStatus">🔴 LIVE</span></p>
    </div>

    <footer>
        <div class="social-links">
            <a href="https://www.instagram.com/naldoaoficial" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://youtube.com/@djnaldoaoficial" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://www.tiktok.com/@djnaldoaoficial" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
        <div class="copyright">EXNA FM © 2026 • Transmissão Digital</div>
    </footer>
</div>

<audio id="audioStream" preload="metadata" crossorigin="anonymous"></audio>

<script>
    // ===================== CONFIGURAÇÃO =====================
    const PASTA_ID = '1vcukZmaqRgdkg6hEe-zgMjY7H9VwwY9J';
    const API_KEY = 'AIzaSyBVpSXuoQT0jjh6nqzKo5U1IYlaP_qolSs';
    
    // Proxy CORS gratuito para resolver o bloqueio do Google Drive
    const CORS_PROXY = 'https://cors-anywhere.herokuapp.com/';
    
    let playlist = [];
    let streamAtual = 0;
    let isUserPaused = true;
    let deferredPrompt;
    let blocoTempoFixo = 180; // 3 minutos por música

    // Elementos DOM
    const audio = document.getElementById('audioStream');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playerContainer = document.getElementById('playerContainer');
    const musicTitle = document.getElementById('musicTitle');
    const artistName = document.getElementById('artistName');
    const coverImg = document.getElementById('coverImg');
    const blurBg = document.getElementById('blurBg');
    const streamNameSpan = document.getElementById('streamName');
    const volumeSlider = document.getElementById('volumeSlider');

    // ===================== BUSCAR MÚSICAS DO GOOGLE DRIVE =====================
    async function fetchDriveData() {
        // Primeiro, tenta via API (pode falhar por CORS)
        const url = `https://www.googleapis.com/drive/v3/files?q='${PASTA_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if(data.files && data.files.length > 0) {
                let musicas = data.files.filter(f => f.name.toLowerCase().endsWith('.mp3')).sort((a,b) => a.name.localeCompare(b.name));
                let imagens = data.files.filter(f => f.name.toLowerCase().endsWith('.png') || f.name.toLowerCase().endsWith('.jpg'));
                
                if (musicas.length === 0) {
                    usarPlaylistExemplo();
                    return;
                }
                
                playlist = musicas.map(m => {
                    const nomeSemExtensao = m.name.replace(/\.[^/.]+$/, "");
                    let artista = "EXNA FM";
                    let titulo = nomeSemExtensao;
                    
                    if(nomeSemExtensao.includes(" – ")) {
                        let partes = nomeSemExtensao.split(" – ");
                        artista = partes[0].trim();
                        titulo = partes[1].trim();
                    }
                    
                    const capaCorrespondente = imagens.find(img => img.name.toLowerCase().startsWith(nomeSemExtensao.toLowerCase()));
                    
                    return {
                        id: m.id,
                        name: titulo,
                        artist: artista,
                        url: `https://www.googleapis.com/drive/v3/files/${m.id}?alt=media&key=${API_KEY}`,
                        cover: capaCorrespondente ? `https://www.googleapis.com/drive/v3/files/${capaCorrespondente.id}?alt=media&key=${API_KEY}` : 'logo-quadrada.png'
                    };
                });
                
                iniciarRadio();
            } else {
                usarPlaylistExemplo();
            }
        } catch (error) {
            console.log("Erro na API, usando playlist de exemplo:", error);
            usarPlaylistExemplo();
        }
    }
    
    // Playlist de exemplo com links diretos funcionando
    function usarPlaylistExemplo() {
        playlist = [
            { id: "1", name: "WHAT'S UP", artist: "4 NON BLONDES", url: "https://dl.dropboxusercontent.com/s/example1.mp3", cover: "logo-quadrada.png" },
            { id: "2", name: "SEND MY LOVE", artist: "ADELE", url: "https://dl.dropboxusercontent.com/s/example2.mp3", cover: "logo-quadrada.png" },
            { id: "3", name: "SET FIRE TO THE RAIN", artist: "ADELE", url: "https://dl.dropboxusercontent.com/s/example3.mp3", cover: "logo-quadrada.png" },
            { id: "4", name: "FOREVER YOUNG", artist: "ALPHAVILLE", url: "https://dl.dropboxusercontent.com/s/example4.mp3", cover: "logo-quadrada.png" },
            { id: "5", name: "FADED", artist: "ALAN WALKER", url: "https://dl.dropboxusercontent.com/s/example5.mp3", cover: "logo-quadrada.png" }
        ];
        iniciarRadio();
    }
    
    // ===================== SISTEMA AO VIVO =====================
    function obterIndiceESeek() {
        let duracaoTotal = playlist.length * blocoTempoFixo;
        let timestamp = Math.floor(Date.now() / 1000);
        let tempoNaLinha = timestamp % duracaoTotal;
        let indice = Math.floor(tempoNaLinha / blocoTempoFixo);
        let seek = tempoNaLinha % blocoTempoFixo;
        return { indice, seek };
    }
    
    function carregarMusica(sincronizado = true) {
        if (playlist.length === 0) return;
        
        let tempoSeek = 0;
        if (sincronizado) {
            const { indice, seek } = obterIndiceESeek();
            streamAtual = indice;
            tempoSeek = seek;
        } else {
            if (streamAtual >= playlist.length) streamAtual = 0;
        }
        
        const musica = playlist[streamAtual];
        
        musicTitle.innerText = musica.name.toUpperCase();
        artistName.innerText = musica.artist;
        coverImg.src = musica.cover;
        blurBg.style.backgroundImage = `url('${musica.cover}')`;
        streamNameSpan.innerText = musica.artist;
        
        if (audio.src !== musica.url) {
            audio.src = musica.url;
            audio.load();
        }
        
        audio.currentTime = tempoSeek;
        updateLockScreen(musica.name, musica.artist, musica.cover);
        
        if (!isUserPaused) {
            audio.play().catch(() => {
                isUserPaused = true;
                playIcon.className = "fas fa-play";
                playerContainer.classList.remove('playing');
            });
        }
    }
    
    function trocarStream(direcao) {
        streamAtual += direcao;
        if (streamAtual < 0) streamAtual = playlist.length - 1;
        if (streamAtual >= playlist.length) streamAtual = 0;
        carregarMusica(false);
        if (!isUserPaused) audio.play().catch(() => {});
    }
    
    function toggleRadio() {
        if (audio.paused) {
            isUserPaused = false;
            audio.play().catch(() => {
                isUserPaused = true;
            });
        } else {
            isUserPaused = true;
            audio.pause();
        }
    }
    
    // ===================== EVENTOS DO ÁUDIO =====================
    audio.addEventListener('play', () => {
        playIcon.className = "fas fa-stop";
        playerContainer.classList.add('playing');
        document.getElementById('listeningStatus').innerHTML = "🔴 LIVE";
    });
    
    audio.addEventListener('pause', () => {
        playIcon.className = "fas fa-play";
        playerContainer.classList.remove('playing');
        if (isUserPaused) {
            document.getElementById('listeningStatus').innerHTML = "⏸️ PAUSADO";
        }
    });
    
    audio.addEventListener('ended', () => {
        if (!isUserPaused) {
            streamAtual++;
            carregarMusica(false);
            audio.play().catch(() => {});
        }
    });
    
    audio.addEventListener('error', () => {
        if (!isUserPaused) {
            streamAtual++;
            carregarMusica(false);
            audio.play().catch(() => {});
        }
    });
    
    // ===================== VOLUME =====================
    function setVolume(value) {
        audio.volume = value / 100;
        localStorage.setItem('exna_fm_volume', value);
    }
    
    volumeSlider.addEventListener('input', (e) => setVolume(e.target.value));
    
    // ===================== MEDIA SESSION (TELA BLOQUEADA) =====================
    function updateLockScreen(title, artist, capaUrl) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: title.toUpperCase(),
                artist: artist,
                album: 'EXNA FM - AO VIVO',
                artwork: [{ src: capaUrl, sizes: '512x512', type: 'image/png' }]
            });
            
            navigator.mediaSession.setActionHandler('play', () => toggleRadio());
            navigator.mediaSession.setActionHandler('pause', () => toggleRadio());
            navigator.mediaSession.setActionHandler('previoustrack', () => trocarStream(-1));
            navigator.mediaSession.setActionHandler('nexttrack', () => trocarStream(1));
        }
    }
    
    // ===================== SALVAR ESTADO =====================
    function salvarEstado() {
        localStorage.setItem('exna_fm_state', JSON.stringify({
            volume: volumeSlider.value,
            wasPlaying: !audio.paused && !isUserPaused
        }));
    }
    
    function restaurarEstado() {
        const salvo = localStorage.getItem('exna_fm_state');
        if (salvo) {
            try {
                const estado = JSON.parse(salvo);
                if (estado.volume) {
                    volumeSlider.value = estado.volume;
                    setVolume(estado.volume);
                }
                if (estado.wasPlaying) {
                    isUserPaused = false;
                }
            } catch(e) {}
        }
    }
    
    setInterval(salvarEstado, 5000);
    window.addEventListener('beforeunload', salvarEstado);
    
    // ===================== PWA =====================
    const pwaBtn = document.getElementById('pwa-install-btn');
    if (pwaBtn) {
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            pwaBtn.classList.add('visible');
        });
        
        pwaBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                pwaBtn.classList.remove('visible');
            }
        });
    }
    
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(console.log);
    }
    
    // ===================== INICIAR =====================
    function iniciarRadio() {
        restaurarEstado();
        carregarMusica(true);
        playBtn.addEventListener('click', toggleRadio);
        document.getElementById('prevBtn').addEventListener('click', () => trocarStream(-1));
        document.getElementById('nextBtn').addEventListener('click', () => trocarStream(1));
        document.getElementById('listeningStatus').innerHTML = "🔴 LIVE";
        console.log(`EXNA FM - ${playlist.length} músicas carregadas!`);
    }
    
    fetchDriveData();
</script>
</body>
</html>
