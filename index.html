<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0a0f1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NaldoA Play">
    
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    
    <title>NaldoA Play - Sua Rádio Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100vh;
            background: #0a0f1e;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #0a0f1e, #03060c);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(255,215,0,0.12), transparent),
                radial-gradient(3px 3px at 80% 70%, rgba(138,43,226,0.12), transparent);
            background-repeat: no-repeat;
            background-size: 200px 200px, 300px 300px;
            pointer-events: none;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translate(0, 0); opacity: 0.5; }
            50% { transform: translate(30px, 20px); opacity: 0.8; }
            100% { transform: translate(0, 0); opacity: 0.5; }
        }

        .glass-radio {
            width: 100%;
            min-height: 100vh;
            background: rgba(10, 20, 30, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: none;
            border-radius: 0;
            box-shadow: none;
            overflow-y: auto;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-radio::-webkit-scrollbar {
            width: 0;
            background: transparent;
        }

        .inner {
            max-width: 550px;
            width: 100%;
            padding: 35px 24px 35px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 0 auto;
        }

        /* Header com botão TV */
        .station-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-img {
            width: 58px;
            height: 58px;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 5px 15px rgba(255,215,0,0.3);
        }

        .station-title h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFE68F, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .station-title p {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
        }

        /* Botão da TV - versão simplificada */
        .tv-btn {
            background: rgba(255,215,0,0.15);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #FFD966;
            text-decoration: none;
            border: 0.5px solid rgba(255,215,0,0.3);
            transition: all 0.2s;
        }

        .tv-btn:active {
            transform: scale(0.96);
            background: rgba(255,215,0,0.3);
        }

        .slideshow-section {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin: 5px auto;
        }

        .blur-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: blur(35px);
            opacity: 0.5;
            border-radius: 32px;
            z-index: 0;
            background-size: cover;
            background-position: center;
        }

        .image-frame {
            position: relative;
            z-index: 2;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }

        .playing .image-frame {
            animation: frameGlow 2s ease-in-out infinite;
        }

        @keyframes frameGlow {
            0% { box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,215,0,0.2); }
            50% { box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(255,215,0,0.6); }
            100% { box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,215,0,0.2); }
        }

        .slideshow-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .playing .slideshow-img {
            animation: imagePulse 3s ease-in-out infinite;
        }

        @keyframes imagePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .image-caption {
            text-align: center;
            margin-top: 10px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
        }

        .track-info {
            text-align: center;
            margin: 5px 0;
        }

        .track-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }

        .track-artist {
            font-size: 0.9rem;
            color: #FFD966;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .ctrl-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: #FFE5B4;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        #playPauseBtn {
            width: 78px;
            height: 78px;
            background: linear-gradient(145deg, rgba(255,215,0,0.9), rgba(255,140,0,0.9));
            color: #1a1f2e;
            font-size: 1.8rem;
            border: none;
            box-shadow: 0 0 18px rgba(255,215,0,0.5);
        }

        #playPauseBtn.playing {
            background: white;
            color: #ff3366;
        }

        .progress-section {
            margin: 8px 0;
        }

        .progress-area {
            background: rgba(45, 55, 72, 0.7);
            border-radius: 30px;
            height: 5px;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #FFD700, #FFA500);
            width: 0%;
            height: 5px;
        }

        .time-stamp {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #aaa;
            margin-top: 7px;
        }

        .volume-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0,0,0,0.25);
            padding: 6px 18px;
            border-radius: 40px;
            width: fit-content;
            margin: 8px auto;
        }

        .volume-row i {
            color: #FFD966;
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 110px;
            height: 3px;
            -webkit-appearance: none;
            background: #FFD966;
            border-radius: 5px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #FFD966;
            border-radius: 50%;
            cursor: pointer;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 12px;
            padding-top: 14px;
            border-top: 0.5px solid rgba(255,215,0,0.15);
        }

        .social-links a {
            color: rgba(255,255,255,0.5);
            font-size: 1.4rem;
            transition: all 0.3s;
        }

        .social-links a:active {
            color: #FFD966;
            transform: scale(1.1);
        }

        .status-text {
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            margin-top: 5px;
        }

        footer {
            text-align: center;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.2);
            margin-top: 5px;
        }

        @media (display-mode: standalone) {
            body { padding: 0; }
            .glass-radio { min-height: 100vh; border-radius: 0; }
        }

        @media (max-width: 450px) {
            .inner { padding: 30px 18px 30px; gap: 16px; }
            .logo-img { width: 50px; height: 50px; }
            .station-title h1 { font-size: 1.3rem; }
            .slideshow-section { max-width: 250px; }
            .track-title { font-size: 1rem; }
            .track-artist { font-size: 0.8rem; }
            #playPauseBtn { width: 68px; height: 68px; font-size: 1.6rem; }
            .ctrl-btn { width: 48px; height: 48px; font-size: 1.1rem; }
            .social-links a { font-size: 1.2rem; gap: 25px; }
            .tv-btn { padding: 6px 12px; font-size: 0.7rem; }
        }

        @media (min-width: 768px) {
            .inner { max-width: 600px; padding: 40px 30px 40px; gap: 25px; }
            .logo-img { width: 70px; height: 70px; }
            .station-title h1 { font-size: 1.8rem; }
            .slideshow-section { max-width: 340px; }
            .track-title { font-size: 1.3rem; }
            #playPauseBtn { width: 90px; height: 90px; font-size: 2rem; }
            .ctrl-btn { width: 62px; height: 62px; font-size: 1.5rem; }
            .social-links a { font-size: 1.6rem; gap: 35px; }
        }
    </style>
</head>
<body>

<div class="glass-radio" id="radioContainer">
    <div class="inner">
        <div class="station-header">
            <div class="logo-area">
                <img src="logo.png" class="logo-img" alt="NaldoA Play" onerror="this.src='https://via.placeholder.com/58?text=NP'">
                <div class="station-title">
                    <h1>NALDOA PLAY</h1>
                    <p>A SUA RÁDIO WEB!</p>
                </div>
            </div>
            <a href="tv.html" class="tv-btn"><i class="fas fa-tv"></i> TV AO VIVO</a>
        </div>

        <div class="slideshow-section">
            <div class="blur-backdrop" id="blurBackdrop"></div>
            <div class="image-frame" id="imageFrame">
                <img id="slideshowImg" class="slideshow-img" src="img/IMG_4484.jpg" alt="Imagem">
            </div>
            <div class="image-caption" id="imageCaption">Momento NaldoA Play</div>
        </div>

        <div class="track-info">
            <div class="track-title" id="trackTitle">SINTONIZANDO...</div>
            <div class="track-artist" id="trackArtist">NALDOA PLAY</div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" id="prevBtn"><i class="fas fa-backward-step"></i></button>
            <button class="ctrl-btn" id="playPauseBtn"><i class="fas fa-play" id="playIcon"></i></button>
            <button class="ctrl-btn" id="nextBtn"><i class="fas fa-forward-step"></i></button>
        </div>

        <div class="progress-section">
            <div class="progress-area" id="progressArea">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-stamp">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <div class="volume-row">
            <i class="fas fa-volume-up"></i>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
        </div>

        <div class="social-links">
            <a href="https://instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://youtube.com/" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://tiktok.com/" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>

        <div class="status-text" id="statusMsg">🔊 Pronto para tocar</div>
        <footer>NaldoA Play © 2026 | 24h no ar</footer>
    </div>
</div>

<script>
    const STREAM_URL = "https://stream.zeno.fm/xx785t45mf9uv";
    
    const imagens = [];
    for (let i = 4484; i <= 4596; i++) {
        imagens.push(`img/IMG_${i}.jpg`);
    }
    
    let currentImageIndex = 0;
    let slideshowInterval = null;
    let currentMusicIndex = 0;
    let musicIntervalId = null;
    let progressInterval = null;
    let reconnectAttempts = 0;
    
    const audio = new Audio();
    audio.src = STREAM_URL;
    audio.crossOrigin = "anonymous";
    audio.preload = "auto";
    
    let isPlaying = false;
    
    const playBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const slideshowImg = document.getElementById('slideshowImg');
    const blurBackdrop = document.getElementById('blurBackdrop');
    const imageCaption = document.getElementById('imageCaption');
    const progressBar = document.getElementById('progressBar');
    const progressArea = document.getElementById('progressArea');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('durationTime');
    const volumeSlider = document.getElementById('volumeSlider');
    const statusMsg = document.getElementById('statusMsg');
    const radioContainer = document.getElementById('radioContainer');
    
    const playlistDemo = [
        { title: "BATIDÃO EXPLOSIVO", artist: "DJ NALDOA" },
        { title: "ELETRO HITS 2025", artist: "NALDOA PLAY" },
        { title: "SÓ AS TOP", artist: "RÁDIO NALDOA" },
        { title: "PISTA QUENTE", artist: "DJ NALDOA" },
        { title: "FUNK MANDELADO", artist: "NALDOA SELECT" },
        { title: "PAGODE DO NALDOA", artist: "SAMBA AO VIVO" },
        { title: "SERTANEJO TOP", artist: "NALDOA PLAY" },
        { title: "ROCK IN RIO", artist: "NALDOA" }
    ];
    
    function updateImage(index) {
        const imgPath = imagens[index];
        slideshowImg.src = imgPath;
        blurBackdrop.style.backgroundImage = `url(${imgPath})`;
        blurBackdrop.style.backgroundSize = 'cover';
        blurBackdrop.style.backgroundPosition = 'center';
        const match = imgPath.match(/IMG_(\d+)\.jpg/);
        imageCaption.textContent = match ? `Momento #${match[1]}` : `Momento NaldoA Play`;
    }
    
    function nextImage() {
        currentImageIndex = (currentImageIndex + 1) % imagens.length;
        updateImage(currentImageIndex);
    }
    
    function startSlideshow() {
        if (slideshowInterval) clearInterval(slideshowInterval);
        slideshowInterval = setInterval(() => nextImage(), 8000);
    }
    
    function stopSlideshow() {
        if (slideshowInterval) clearInterval(slideshowInterval);
    }
    
    function rotateTrackInfo() {
        const track = playlistDemo[currentMusicIndex % playlistDemo.length];
        trackTitle.textContent = track.title;
        trackArtist.textContent = track.artist;
        currentMusicIndex++;
        
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: track.title,
                artist: track.artist,
                album: 'NaldoA Play - Ao Vivo',
                artwork: [{ src: "logo.png", sizes: "512x512", type: "image/png" }]
            });
        }
    }
    
    function startMusicRotation() {
        if (musicIntervalId) clearInterval(musicIntervalId);
        musicIntervalId = setInterval(() => { if (isPlaying) rotateTrackInfo(); }, 30000);
    }
    
    function stopMusicRotation() {
        if (musicIntervalId) clearInterval(musicIntervalId);
    }
    
    function startProgressAnimation() {
        if (progressInterval) clearInterval(progressInterval);
        let fakeProgress = 0;
        progressInterval = setInterval(() => {
            if (isPlaying) {
                fakeProgress = (fakeProgress + 0.5) % 100;
                progressBar.style.width = fakeProgress + '%';
                const fakeSeconds = Math.floor((fakeProgress / 100) * 180);
                const mins = Math.floor(fakeSeconds / 60);
                const secs = fakeSeconds % 60;
                currentTimeSpan.textContent = `${mins}:${secs < 10 ? '0'+secs : secs}`;
                durationSpan.textContent = "3:00";
            }
        }, 500);
    }
    
    function stopProgressAnimation() {
        if (progressInterval) clearInterval(progressInterval);
        progressBar.style.width = '0%';
        currentTimeSpan.textContent = "0:00";
    }
    
    function togglePlay() {
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
            playIcon.className = "fas fa-play";
            playBtn.classList.remove('playing');
            radioContainer.classList.remove('playing');
            statusMsg.textContent = "⏸️ Pausado";
            stopSlideshow();
            stopMusicRotation();
            stopProgressAnimation();
        } else {
            audio.play().then(() => {
                isPlaying = true;
                playIcon.className = "fas fa-stop";
                playBtn.classList.add('playing');
                radioContainer.classList.add('playing');
                statusMsg.textContent = "🎧 AO VIVO - NALDOA PLAY 🎧";
                startSlideshow();
                startMusicRotation();
                startProgressAnimation();
                rotateTrackInfo();
                reconnectAttempts = 0;
            }).catch((err) => {
                console.log(err);
                statusMsg.textContent = "🔊 Clique novamente para ouvir";
            });
        }
    }
    
    function nextTrackSimulate() {
        if (!isPlaying) return;
        rotateTrackInfo();
        statusMsg.textContent = "🎵 Próxima faixa";
        setTimeout(() => { if (isPlaying) statusMsg.textContent = "🎧 AO VIVO - NALDOA PLAY 🎧"; }, 2000);
    }
    
    function handleError() {
        if (isPlaying) {
            reconnectAttempts++;
            statusMsg.textContent = `⚠️ Reconectando... (tentativa ${reconnectAttempts})`;
            setTimeout(() => {
                if (isPlaying) audio.play().catch(() => {});
            }, 3000);
        }
    }
    
    volumeSlider.addEventListener('input', (e) => audio.volume = e.target.value);
    audio.volume = 0.8;
    audio.addEventListener('playing', () => {
        statusMsg.textContent = "🎧 AO VIVO - NALDOA PLAY 🎧";
        reconnectAttempts = 0;
    });
    audio.addEventListener('error', handleError);
    audio.addEventListener('stalled', handleError);
    
    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrackSimulate);
    prevBtn.addEventListener('click', nextTrackSimulate);
    
    updateImage(0);
    audio.load();
    statusMsg.textContent = "🔊 Clique no play para ouvir";
    
    if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', () => togglePlay());
        navigator.mediaSession.setActionHandler('pause', () => togglePlay());
        navigator.mediaSession.setActionHandler('nexttrack', () => nextTrackSimulate());
        navigator.mediaSession.metadata = new MediaMetadata({
            title: "NaldoA Play",
            artist: "Ao Vivo",
            album: "Sua Rádio Web",
            artwork: [{ src: "logo.png", sizes: "512x512", type: "image/png" }]
        });
    }
</script>
</body>
</html>
