<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXNA MUSIC - Google Drive Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo-quadrada.png">
            
    <style>
        :root {
            --primary-purple: #8a2be2;
            --neon-aqua: #66fcf1;
            --neon-pink: #ff0055;
            --dark-bg: #050608;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        .blur-background {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: url('logo-quadrada.png');
            background-position: center;
            background-size: cover;
            filter: blur(60px) brightness(0.3);
            z-index: -1;
            transition: background-image 0.8s ease-in-out;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .glass-player {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            width: 100%;
            max-width: 380px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            position: relative;
        }

        .radio-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
        }

        .header-brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .radio-top-logo {
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 0 8px var(--neon-aqua));
        }

        .radio-brand-text h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin: 0;
            text-align: left;
        }
        .radio-brand-text h2 span { color: var(--neon-aqua); }
        .radio-brand-text p {
            margin: 0;
            font-size: 0.7rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: left;
        }

        .hamburger-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.3s;
            padding: 5px 10px;
        }
        .hamburger-btn:hover {
            color: var(--neon-aqua);
            filter: drop-shadow(0 0 5px var(--neon-aqua));
        }

        .sync-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--neon-aqua);
            color: var(--neon-aqua);
            padding: 10px 18px;
            border-radius: 50px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .sync-btn:hover {
            background: var(--neon-aqua);
            color: #000;
            box-shadow: 0 0 15px var(--neon-aqua);
        }

        .cover-area {
            width: 190px;
            height: 190px;
            margin: 0 auto 20px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }

        .playing .cover-area {
            border-color: var(--neon-aqua);
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.2);
        }

        .cover-img { width: 100%; height: 100%; object-fit: cover; background-color: #111; }

        .info-area h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-area p {
            font-size: 1rem;
            color: var(--neon-aqua);
            margin: 4px 0 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 20px;
        }

        .progress-bar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--neon-aqua);
            box-shadow: 0 0 8px var(--neon-aqua);
        }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-btn:hover, .nav-btn.active { color: var(--neon-aqua); filter: drop-shadow(0 0 5px var(--neon-aqua)); }

        .play-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(45deg, var(--primary-purple), var(--neon-pink));
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
        }
        .play-btn.active { background: #fff; color: #000; box-shadow: 0 0 25px #fff; }

        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--neon-pink);
        }

        /* MENU LATERAL */
        .playlist-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 320px;
            height: 100vh;
            background: rgba(5, 6, 8, 0.94);
            backdrop-filter: blur(25px);
            border-left: 1px solid var(--glass-border);
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            z-index: 9999;
            transition: cubic-bezier(0.16, 1, 0.3, 1) 0.4s;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .playlist-sidebar.open { right: 0; }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .sidebar-header h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin: 0;
            color: var(--neon-aqua);
            letter-spacing: 1px;
        }

        .close-sidebar-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .close-sidebar-btn:hover { color: var(--neon-pink); }

        .playlist-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.01);
        }
        .playlist-item:hover { background: rgba(255, 255, 255, 0.04); }
        
        .playlist-item.current-track {
            background: rgba(102, 252, 241, 0.1);
            border: 1px solid rgba(102, 252, 241, 0.3);
            color: var(--neon-aqua);
        }

        .list-thumb {
            width: 35px;
            height: 35px;
            border-radius: 6px;
            object-fit: cover;
            background-color: #111;
        }

        .track-meta-box {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-meta-box span { display: block; font-size: 0.7rem; color: #666; margin-top: 1px; }

        footer {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.5);
            border-top: 1px solid var(--glass-border);
            position: relative;
            z-index: 1;
        }
        .social-links { margin-bottom: 10px; display: flex; justify-content: center; gap: 20px; }
        .social-links a { color: var(--neon-aqua); font-size: 1.3rem; transition: 0.3s; text-decoration: none; }
        .social-links a:hover { color: var(--neon-pink); }
        .copyright { font-size: 0.7rem; color: #555; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="blur-background" id="bg-glow"></div>

    <div class="playlist-sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-list-ul"></i> EXNA PLAYLIST</h3>
            <button class="close-sidebar-btn" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <div class="playlist-scroll-area" id="playlist-box">
            <div style="text-align: center; color: #444; padding: 20px;">Carregando músicas...</div>
        </div>
    </div>

    <main>
        <div class="glass-player" id="main-player">
            
            <div class="radio-header">
                <div class="header-brand-box">
                    <img src="logo-quadrada.png" class="radio-top-logo" alt="EXNA Logo">
                    <div class="radio-brand-text">
                        <h2>EXNA <span>MUSIC</span></h2>
                        <p>Google Drive Player</p>
                    </div>
                </div>
                <button class="hamburger-btn" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <button class="sync-btn" onclick="carregarDoGoogleDrive()">
                <i class="fab fa-google-drive"></i> CARREGAR DO GOOGLE DRIVE
            </button>

            <div class="cover-area">
                <img src="logo-quadrada.png" id="track-cover" class="cover-img" alt="Capa">
            </div>

            <div class="info-area">
                <h1 id="track-title">EXNA MUSIC</h1>
                <p id="artist-name">Clique em Carregar</p>
            </div>

            <div class="progress-container">
                <span id="time-current">0:00</span>
                <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
                <span id="time-duration">0:00</span>
            </div>

            <div class="controls-row">
                <button class="nav-btn" id="shuffle-btn" onclick="toggleShuffle()"><i class="fas fa-random"></i></button>
                <button class="nav-btn" onclick="voltarFaixa()"><i class="fas fa-step-backward"></i></button>
                <button class="play-btn" id="master-play" onclick="togglePlayer()" disabled>
                    <i class="fas fa-play" id="btn-icon"></i>
                </button>
                <button class="nav-btn" onclick="proximaFaixa()"><i class="fas fa-step-forward"></i></button>
                <button class="nav-btn" id="loop-btn" onclick="toggleLoop()"><i class="fas fa-redo"></i></button>
            </div>

            <div class="volume-container">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volume" class="volume-slider" value="80" min="0" max="100" oninput="ajustarVolume(this.value)">
                <i class="fas fa-volume-up"></i>
            </div>
            
            <p id="status-text" style="margin-top:20px; font-size: 0.75rem; color: #45a29e;">Aguardando...</p>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://www.instagram.com/naldoaoficial" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://youtube.com/@djnaldoaoficial" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://www.tiktok.com/@djnaldoaoficial" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
        <div class="copyright">EXNA MUSIC © 2026</div>
    </footer>

    <audio id="audio-core" crossorigin="anonymous" preload="auto"></audio>

    <script>
        const PASTA_ID = '1vcukZmaqRgdkg6hEe-zgMjY7H9VwwY9J'; 
        const API_KEY = 'AIzaSyBVpSXuoQT0jjh6nqzKo5U1IYlaP_qolSs'; 

        const player = document.getElementById('audio-core');
        const btn = document.getElementById('master-play');
        const icon = document.getElementById('btn-icon');
        const card = document.getElementById('main-player');
        const txtTitle = document.getElementById('track-title');
        const txtArtist = document.getElementById('artist-name');
        const txtCover = document.getElementById('track-cover');
        const bgGlow = document.getElementById('bg-glow');
        const txtStatus = document.getElementById('status-text');
        const playlistBox = document.getElementById('playlist-box');
        const sidebar = document.getElementById('sidebar');
        
        const progressBar = document.getElementById('progress');
        const timeCurrent = document.getElementById('time-current');
        const timeDuration = document.getElementById('time-duration');
        
        const shuffleBtn = document.getElementById('shuffle-btn');
        const loopBtn = document.getElementById('loop-btn');

        let playlist = [];
        let ordemExecucao = [];
        let indiceAtual = 0;
        let isShuffle = false;
        let isLoop = false;
        let cacheCapas = new Map();

        function toggleSidebar() { sidebar.classList.toggle('open'); }

        async function buscarCapaNoITunes(musicaNome, artistaNome) {
            const chave = `${artistaNome}|${musicaNome}`.toLowerCase();
            if (cacheCapas.has(chave)) return cacheCapas.get(chave);
            
            const query = encodeURIComponent(`${artistaNome} ${musicaNome}`);
            const url = `https://itunes.apple.com/search?term=${query}&limit=1&entity=song`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.results && data.results.length > 0) {
                    const capa = data.results[0].artworkUrl100?.replace('100x100', '600x600');
                    if (capa) {
                        cacheCapas.set(chave, capa);
                        return capa;
                    }
                }
                return null;
            } catch (error) {
                return null;
            }
        }

        async function carregarDoGoogleDrive() {
            txtStatus.innerText = "Carregando músicas do Google Drive...";
            const url = `https://www.googleapis.com/drive/v3/files?q='${PASTA_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(data.files && data.files.length > 0) {
                    let musicas = data.files.filter(f => f.name.toLowerCase().endsWith('.mp3'));
                    let imagens = data.files.filter(f => f.mimeType.includes('image'));

                    if (musicas.length === 0) {
                        txtStatus.innerText = "Nenhuma música encontrada na pasta!";
                        return;
                    }

                    playlist = [];
                    
                    for (const m of musicas) {
                        const nomeSemExtensao = m.name.replace(/\.[^/.]+$/, "");
                        let artista = "EXNA MUSIC";
                        let titulo = nomeSemExtensao;
                        
                        if(nomeSemExtensao.includes(" - ")) {
                            let partes = nomeSemExtensao.split(" - ");
                            artista = partes[0].trim();
                            titulo = partes[1].trim();
                        }

                        const capaLocal = imagens.find(img => img.name.toLowerCase().startsWith(nomeSemExtensao.toLowerCase()));
                        let capaUrl = capaLocal ? `https://www.googleapis.com/drive/v3/files/${capaLocal.id}?alt=media&key=${API_KEY}` : null;
                        
                        // Busca capa no iTunes se não tiver local
                        if (!capaUrl) {
                            capaUrl = await buscarCapaNoITunes(titulo, artista);
                        }
                        
                        playlist.push({
                            id: m.id,
                            name: titulo,
                            artist: artista,
                            capaUrl: capaUrl || 'logo-quadrada.png',
                            url: `https://www.googleapis.com/drive/v3/files/${m.id}?alt=media&key=${API_KEY}`
                        });
                    }
                    
                    // Embaralhar playlist
                    for (let i = playlist.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
                    }
                    
                    ordemExecucao = playlist.map((_, i) => i);
                    indiceAtual = 0;
                    
                    btn.disabled = false;
                    txtStatus.innerText = `${playlist.length} músicas carregadas!`;
                    
                    carregarFaixa(0);
                    renderizarPlaylist();
                    
                    // Toca automaticamente
                    player.play().catch(() => {});
                    
                } else {
                    txtStatus.innerText = "Pasta vazia!";
                }
            } catch (e) {
                txtStatus.innerText = "Erro ao conectar com Google Drive!";
                console.error(e);
            }
        }

        function renderizarPlaylist() {
            playlistBox.innerHTML = "";
            if(playlist.length === 0) {
                playlistBox.innerHTML = '<div style="text-align: center; color: #444; padding: 20px;">Nenhuma música carregada.</div>';
                return;
            }

            ordemExecucao.forEach((idReal, idx) => {
                const faixa = playlist[idReal];
                const item = document.createElement('div');
                item.className = `playlist-item ${idx === indiceAtual ? 'current-track' : ''}`;
                item.onclick = () => pularParaMusica(idx);
                item.innerHTML = `
                    <img src="${faixa.capaUrl}" class="list-thumb" onerror="this.src='logo-quadrada.png'">
                    <div class="track-meta-box">
                        ${faixa.name.toUpperCase()}
                        <span>${faixa.artist}</span>
                    </div>
                `;
                playlistBox.appendChild(item);
            });
        }

        function pularParaMusica(index) {
            carregarFaixa(index);
            player.play().catch(() => {});
        }

        function carregarFaixa(index) {
            if (playlist.length === 0) return;
            if (index >= playlist.length) index = 0;
            if (index < 0) index = playlist.length - 1;
            indiceAtual = index;
            
            const faixa = playlist[ordemExecucao[indiceAtual]];
            
            player.src = faixa.url;
            player.load();
            
            txtTitle.innerText = faixa.name.toUpperCase();
            txtArtist.innerText = faixa.artist;
            txtCover.src = faixa.capaUrl;
            bgGlow.style.backgroundImage = `url('${faixa.capaUrl}')`;
            
            updateLockScreen(faixa.name, faixa.artist, faixa.capaUrl);
            renderizarPlaylist();
        }

        function togglePlayer() {
            if (player.paused) {
                player.play();
            } else {
                player.pause();
            }
        }

        function proximaFaixa() {
            if (playlist.length === 0) return;
            carregarFaixa(indiceAtual + 1);
            player.play().catch(() => {});
        }

        function voltarFaixa() {
            if (playlist.length === 0) return;
            carregarFaixa(indiceAtual - 1);
            player.play().catch(() => {});
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
            if (isShuffle) {
                // Embaralhar
                for (let i = ordemExecucao.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [ordemExecucao[i], ordemExecucao[j]] = [ordemExecucao[j], ordemExecucao[i]];
                }
                renderizarPlaylist();
            } else {
                // Voltar para ordem original
                ordemExecucao = playlist.map((_, i) => i);
                renderizarPlaylist();
            }
        }

        function toggleLoop() {
            isLoop = !isLoop;
            loopBtn.classList.toggle('active', isLoop);
            player.loop = isLoop;
        }

        function ajustarVolume(valor) { player.volume = valor / 100; }

        // Eventos do player
        player.addEventListener('play', () => {
            icon.className = "fas fa-stop";
            btn.classList.add('active');
            card.classList.add('playing');
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
        });

        player.addEventListener('pause', () => {
            icon.className = "fas fa-play";
            btn.classList.remove('active');
            card.classList.remove('playing');
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
        });

        player.addEventListener('ended', () => {
            if (!isLoop) proximaFaixa();
        });

        player.addEventListener('timeupdate', () => {
            if (isNaN(player.duration)) return;
            const pct = (player.currentTime / player.duration) * 100;
            progressBar.value = pct;
            timeCurrent.innerText = formatarTempo(player.currentTime);
            timeDuration.innerText = formatarTempo(player.duration);
        });

        progressBar.addEventListener('input', () => {
            if (isNaN(player.duration)) return;
            player.currentTime = (progressBar.value / 100) * player.duration;
        });

        function formatarTempo(segs) {
            let min = Math.floor(segs / 60);
            let sec = Math.floor(segs % 60);
            return min + ":" + (sec < 10 ? "0" + sec : sec);
        }

        function updateLockScreen(title, artist, capaUrl) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title,
                    artist: artist,
                    album: 'EXNA MUSIC',
                    artwork: [{ src: capaUrl, sizes: '512x512', type: 'image/png' }]
                });
                navigator.mediaSession.setActionHandler('play', () => player.play());
                navigator.mediaSession.setActionHandler('pause', () => player.pause());
                navigator.mediaSession.setActionHandler('previoustrack', () => voltarFaixa());
                navigator.mediaSession.setActionHandler('nexttrack', () => proximaFaixa());
            }
        }

        // PWA
        let deferredPrompt;
        const pwaBtn = document.getElementById('pwa-install-btn');
        if (pwaBtn) {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                pwaBtn.classList.add('visible');
            });
            pwaBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt = null;
                    pwaBtn.classList.remove('visible');
                }
            });
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Service Worker error:', err));
        }
    </script>
</body>
</html>
