<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADIO EXNA FM - AO VIVO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo-quadrada.png">
            
    <style>
        :root {
            --primary-purple: #8a2be2;
            --neon-aqua: #66fcf1;
            --neon-pink: #ff0055;
            --dark-bg: #050608;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(138, 43, 226, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.15) 0%, transparent 45%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-player {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            width: 100%;
            max-width: 380px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.02);
            position: relative;
        }

        .radio-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .radio-top-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--neon-aqua));
        }

        .radio-brand-text h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            margin: 0;
            letter-spacing: 1px;
            text-align: left;
        }

        .radio-brand-text h2 span { color: var(--neon-aqua); }

        .radio-brand-text p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            text-align: left;
        }

        .live-indicator {
            background: var(--neon-pink);
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px var(--neon-pink);
            animation: pulse 2s infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

        .cover-area {
            width: 220px;
            height: 220px;
            margin: 0 auto 25px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            position: relative;
        }

        .playing .cover-area {
            border-color: var(--neon-aqua);
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.25);
            transform: scale(1.02);
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #111;
        }

        .loading-cover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--neon-aqua);
            font-size: 2rem;
            z-index: 2;
        }

        .info-area h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            margin: 0;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-area p {
            font-size: 1.1rem;
            color: var(--neon-aqua);
            margin: 6px 0 25px;
            font-weight: 600;
        }

        .play-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(45deg, var(--primary-purple), var(--neon-pink));
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.5);
        }

        .play-btn.active {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px #fff;
        }

        .play-btn.loading {
            opacity: 0.7;
            cursor: wait;
        }

        .pwa-float-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--neon-aqua);
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
        }

        .pwa-float-btn.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .pwa-float-btn:hover {
            color: white;
            background: linear-gradient(45deg, var(--primary-purple), var(--neon-pink));
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            transform: scale(1.1) translateY(-3px);
            border-color: transparent;
        }

        footer {
            padding: 25px;
            text-align: center;
            background: rgba(0,0,0,0.4);
            border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .social-links {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 22px;
        }

        .social-links a {
            color: var(--neon-aqua);
            font-size: 1.6rem;
            transition: 0.3s;
            text-decoration: none;
        }

        .social-links a:hover {
            color: var(--neon-pink);
            transform: translateY(-3px);
        }

        .copyright {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .live-badge {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ff0055;
            border-radius: 50%;
            animation: blink 1s infinite;
            margin-left: 8px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 480px) {
            .glass-player { padding: 30px 20px; margin: 10px; }
            .cover-area { width: 190px; height: 190px; }
            .pwa-float-btn { bottom: 20px; right: 20px; width: 50px; height: 50px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <main>
        <div class="glass-player" id="main-player">
            
            <div class="radio-header">
                <img src="logo-quadrada.png" class="radio-top-logo" alt="EXNA Logo">
                <div class="radio-brand-text">
                    <h2>EXNA <span>FM</span></h2>
                    <p>A Rádio que toca todas!</p>
                </div>
            </div>

            <div class="live-indicator">
                <i class="fas fa-broadcast-tower"></i> TRANSMISSÃO EM TEMPO REAL <span class="live-badge"></span>
            </div>

            <div class="cover-area" id="cover-area">
                <img src="logo-quadrada.png" id="track-cover" class="cover-img" alt="Capa da Música">
                <div class="loading-cover" id="loading-cover" style="display: none;">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>
            </div>

            <div class="info-area">
                <h1 id="track-title">SINTONIZANDO...</h1>
                <p id="artist-name">DJ NaldoA</p>
            </div>

            <button class="play-btn" id="master-play" onclick="toggleRadio()">
                <i class="fas fa-spinner fa-spin" id="btn-icon"></i>
            </button>
            
            <p id="status-text" style="margin-top:20px; font-size: 0.8rem; color: #45a29e; font-weight: bold; letter-spacing: 1px;"></p>
        </div>
    </main>

    <button id="pwa-install-btn" class="pwa-float-btn" title="Baixar App da Rádio">
        <i class="fas fa-download"></i>
    </button>

    <footer>
        <div class="social-links">
            <a href="https://www.instagram.com/naldoaoficial" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://youtube.com/@djnaldoaoficial" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://www.tiktok.com/@djnaldoaoficial" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
        <div class="copyright">
            EXNA FM © 2026 | DJ NaldoA | Todos os Direitos Reservados
        </div>
    </footer>

    <audio id="audio-core" crossorigin="anonymous" preload="auto"></audio>

    <script>
        const PASTA_ID = '1vcukZmaqRgdkg6hEe-zgMjY7H9VwwY9J'; 
        const API_KEY = 'AIzaSyBVpSXuoQT0jjh6nqzKo5U1IYlaP_qolSs'; 

        const player = document.getElementById('audio-core');
        const btn = document.getElementById('master-play');
        const icon = document.getElementById('btn-icon');
        const card = document.getElementById('main-player');
        const txtTitle = document.getElementById('track-title');
        const txtCover = document.getElementById('track-cover');
        const txtStatus = document.getElementById('status-text');
        const loadingCover = document.getElementById('loading-cover');

        let gradeOriginal = [];
        let playlistAtual = [];
        let indiceMusicaAtual = 0;
        let deferredPrompt;
        let isPlaying = false;
        let cacheCapas = new Map();
        let carregandoMusica = false;

        txtTitle.innerText = "SINTONIA ONLINE";
        txtStatus.innerText = "Conectando à torre...";

        function mostrarLoading(mostrar) {
            if (mostrar) {
                loadingCover.style.display = 'flex';
                btn.classList.add('loading');
            } else {
                loadingCover.style.display = 'none';
                btn.classList.remove('loading');
            }
        }

        async function buscarCapaNoITunes(musicaNome, artistaNome) {
            const chaveCache = `${artistaNome}|${musicaNome}`.toLowerCase();
            
            if (cacheCapas.has(chaveCache)) {
                return cacheCapas.get(chaveCache);
            }
            
            const query = encodeURIComponent(`${artistaNome} ${musicaNome}`);
            const url = `https://itunes.apple.com/search?term=${query}&limit=3&entity=song`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    // Procura a música mais relevante
                    let melhorMatch = data.results.find(r => 
                        r.trackName.toLowerCase().includes(musicaNome.toLowerCase()) ||
                        musicaNome.toLowerCase().includes(r.trackName.toLowerCase())
                    ) || data.results[0];
                    
                    const artworkUrl = melhorMatch.artworkUrl100;
                    const highResArtwork = artworkUrl.replace('100x100', '600x600');
                    cacheCapas.set(chaveCache, highResArtwork);
                    return highResArtwork;
                }
                return null;
            } catch (error) {
                console.log('Erro ao buscar capa no iTunes:', error);
                return null;
            }
        }

        async function fetchDriveData() {
            const url = `https://www.googleapis.com/drive/v3/files?q='${PASTA_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(data.files && data.files.length > 0) {
                    let musicas = data.files.filter(f => f.name.toLowerCase().endsWith('.mp3') || f.mimeType.includes('audio'));
                    let imagens = data.files.filter(f => f.mimeType.includes('image') || f.name.toLowerCase().endsWith('.jpg') || f.name.toLowerCase().endsWith('.png'));

                    if (musicas.length === 0) {
                        txtTitle.innerText = "EXNA FM";
                        txtStatus.innerText = "Nenhuma música disponível.";
                        return;
                    }

                    gradeOriginal = musicas.map(m => {
                        const nomeSemExtensao = m.name.replace(/\.[^/.]+$/, "");
                        
                        let artistaDetectado = "EXNA FM";
                        let tituloDetectado = nomeSemExtensao;
                        if(nomeSemExtensao.includes(" - ")) {
                            let partes = nomeSemExtensao.split(" - ");
                            artistaDetectado = partes[0].trim();
                            tituloDetectado = partes[1].trim();
                        }

                        const capaCorrespondente = imagens.find(img => img.name.toLowerCase().startsWith(nomeSemExtensao.toLowerCase()));
                        
                        return {
                            id: m.id,
                            name: tituloDetectado,
                            artist: artistaDetectado,
                            capaUrl: capaCorrespondente ? `https://www.googleapis.com/drive/v3/files/${capaCorrespondente.id}?alt=media&key=${API_KEY}` : null,
                            fileName: m.name
                        };
                    });
                    
                    console.log('Músicas carregadas:', gradeOriginal.length);
                    
                    gerarPlaylistAleatoria();
                    
                    // Inicia a primeira música
                    await tocarMusica(0);
                    
                    // Configurar eventos do player
                    configurarPlayerEvents();

                } else {
                    txtStatus.innerText = "Pasta vazia.";
                }
            } catch (e) {
                txtStatus.innerText = "Falha ao conectar com o servidor.";
                console.error(e);
            }
        }

        function gerarPlaylistAleatoria() {
            if (gradeOriginal.length === 0) return;
            
            let pool = [...gradeOriginal];
            let novaPlaylist = [];
            let ultimoArtista = "";
            
            // Embaralha
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            
            // Não repete artista consecutivo
            while(pool.length > 0) {
                let indexValido = pool.findIndex(m => m.artist.toLowerCase() !== ultimoArtista.toLowerCase());
                if(indexValido === -1) indexValido = 0;
                
                let selecionada = pool.splice(indexValido, 1)[0];
                novaPlaylist.push(selecionada);
                ultimoArtista = selecionada.artist;
            }
            
            playlistAtual = novaPlaylist;
            indiceMusicaAtual = 0;
            
            console.log('Playlist gerada com', playlistAtual.length, 'músicas');
        }

        async function atualizarCapaMusica(faixa) {
            mostrarLoading(true);
            
            try {
                if (faixa.capaUrl) {
                    txtCover.src = faixa.capaUrl;
                    mostrarLoading(false);
                    return faixa.capaUrl;
                }
                
                // Busca capa no iTunes
                txtStatus.innerText = "Buscando capa da música...";
                const capaITunes = await buscarCapaNoITunes(faixa.name, faixa.artist);
                
                if (capaITunes) {
                    faixa.capaUrl = capaITunes;
                    txtCover.src = capaITunes;
                    txtStatus.innerText = `🎵 Tocando: ${faixa.name}`;
                } else {
                    txtCover.src = 'logo-quadrada.png';
                    txtStatus.innerText = `🎵 Tocando: ${faixa.name}`;
                }
            } catch (error) {
                txtCover.src = 'logo-quadrada.png';
                txtStatus.innerText = `🎵 Tocando: ${faixa.name}`;
            } finally {
                mostrarLoading(false);
            }
            
            return faixa.capaUrl || 'logo-quadrada.png';
        }

        async function tocarMusica(index) {
            if (carregandoMusica) return;
            carregandoMusica = true;
            
            if (!playlistAtual.length || index >= playlistAtual.length) {
                gerarPlaylistAleatoria();
                index = 0;
                indiceMusicaAtual = 0;
            }
            
            const faixa = playlistAtual[index];
            indiceMusicaAtual = index;
            
            let urlMusica = `https://www.googleapis.com/drive/v3/files/${faixa.id}?alt=media&key=${API_KEY}`;
            
            mostrarLoading(true);
            icon.className = "fas fa-spinner fa-spin";
            
            player.src = urlMusica;
            player.currentTime = 0;
            
            txtTitle.innerText = faixa.name.toUpperCase();
            document.getElementById('artist-name').innerHTML = `${faixa.artist} <span style="font-size: 0.7rem; color: #ff0055;">🔴 AO VIVO</span>`;
            
            await atualizarCapaMusica(faixa);
            updateLockScreen(faixa.name, `${faixa.artist} - AO VIVO`, faixa.capaUrl || 'logo-quadrada.png');
            
            if (isPlaying) {
                try {
                    await player.play();
                    icon.className = "fas fa-stop";
                    btn.classList.add('active');
                    card.classList.add('playing');
                    txtStatus.innerText = `🔴 AO VIVO: ${faixa.name} - ${faixa.artist}`;
                } catch (err) {
                    console.log('Erro ao tocar:', err);
                    icon.className = "fas fa-play";
                    btn.classList.remove('active');
                    card.classList.remove('playing');
                    txtStatus.innerText = "Clique no Play para ouvir";
                    isPlaying = false;
                }
            }
            
            carregandoMusica = false;
        }

        async function proximaMusica() {
            if (carregandoMusica) return;
            
            let proximoIndex = indiceMusicaAtual + 1;
            if (proximoIndex >= playlistAtual.length) {
                gerarPlaylistAleatoria();
                proximoIndex = 0;
            }
            
            await tocarMusica(proximoIndex);
        }

        function configurarPlayerEvents() {
            player.onended = async () => {
                console.log('🎵 Música terminou, iniciando próxima...');
                await proximaMusica();
            };

            player.onerror = async (e) => {
                console.error('Erro no player:', e);
                txtStatus.innerText = "Erro na música, pulando para próxima...";
                await new Promise(resolve => setTimeout(resolve, 1000));
                await proximaMusica();
            };
        }

        function toggleRadio() {
            if (player.paused) {
                player.play().then(() => {
                    isPlaying = true;
                    icon.className = "fas fa-stop";
                    btn.classList.add('active');
                    card.classList.add('playing');
                    txtStatus.innerText = "🔴 AO VIVO - Sintonizado";
                }).catch((err) => {
                    console.log('Erro ao dar play:', err);
                    isPlaying = false;
                    icon.className = "fas fa-play";
                    btn.classList.remove('active');
                    card.classList.remove('playing');
                    txtStatus.innerText = "Clique no Play para ouvir ao vivo";
                });
            } else {
                player.pause();
                isPlaying = false;
                icon.className = "fas fa-play";
                btn.classList.remove('active');
                card.classList.remove('playing');
                txtStatus.innerText = "⏸️ Rádio pausada";
            }
        }

        function updateLockScreen(title, artist, capaUrl) {
            if ('mediaSession' in navigator) {
                const artwork = [];
                
                if (capaUrl && capaUrl !== 'logo-quadrada.png') {
                    artwork.push({ src: capaUrl, sizes: '512x512', type: 'image/jpeg' });
                }
                artwork.push({ src: 'logo-quadrada.png', sizes: '512x512', type: 'image/png' });
                
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title,
                    artist: artist,
                    album: 'RADIO EXNA FM - AO VIVO',
                    artwork: artwork
                });
                
                navigator.mediaSession.setActionHandler('play', () => { 
                    if (player.paused) toggleRadio();
                });
                navigator.mediaSession.setActionHandler('pause', () => { 
                    if (!player.paused) toggleRadio();
                });
            }
        }

        const pwaBtn = document.getElementById('pwa-install-btn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            pwaBtn.classList.add('visible');
        });

        pwaBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                pwaBtn.classList.remove('visible');
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Service Worker error:', err));
        }

        // Iniciar
        fetchDriveData();
    </script>
</body>
</html>
