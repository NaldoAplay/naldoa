<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXNA FM - A Rádio que toca todas!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #050608;
            color: #ffffff;
            overflow: hidden;
        }
        /* Container Principal estilo App Responsivo */
        .app-container {
            max-width: 480px;
            height: 100vh;
            margin: 0 auto;
            position: relative;
            background-color: #0d0e12;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 60px rgba(0,0,0,0.9);
        }
        /* Efeito de Vidro Fosco / Blur no Fundo */
        .blur-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 11, 14, 0.82);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            z-index: 1;
        }
        /* Conteúdo do Player */
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 30px 24px;
            text-align: center;
        }
        
        /* LOGO DA RÁDIO NO TOPO (Estilizado em CSS Neon) */
        header {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .radio-logo {
            background: linear-gradient(135deg, #00e5ff, #0086ff);
            padding: 10px 25px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 4px;
        }
        .radio-title {
            font-size: 32px;
            font-weight: 950;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            font-style: italic;
        }
        .radio-slogan {
            font-size: 11px;
            color: #00e5ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 6px;
            font-weight: 700;
        }
        .live-badge {
            background: #ff1744;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            display: inline-block;
            margin-top: 12px;
            letter-spacing: 1.5px;
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.6);
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        
        .player-display {
            margin: auto 0;
        }
        /* Contentor da Capa da Música */
        .artwork-container {
            width: 270px;
            height: 270px;
            margin: 0 auto 25px auto;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.65);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.15);
            background: #17181e;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .artwork {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .track-info {
            padding: 0 15px;
        }
        .track-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .track-artist {
            font-size: 16px;
            color: #b3b3b3;
            margin-bottom: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .time-status {
            font-size: 13px;
            color: #00e5ff;
            font-family: 'Courier New', monospace;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            border: 1px solid rgba(0, 229, 255, 0.25);
        }
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        /* Botão Play */
        .play-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(255,255,255,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }
        .play-btn:hover {
            transform: scale(1.05);
            background: #00e5ff;
        }
        .play-btn:active {
            transform: scale(0.95);
        }
        .play-btn svg {
            width: 32px;
            height: 32px;
            fill: #0d0e12;
        }
        
        /* NOVO RODAPÉ SOLICITADO */
        .footer-brand {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
            font-weight: 600;
            margin-top: 10px;
        }
        .error-msg {
            color: #ff5252;
            font-size: 12px;
            margin-top: 12px;
            display: none;
            background: rgba(255,82,82,0.15);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(213, 82, 82, 0.3);
        }
    </style>
</head>
<body>

    <div class="app-container" id="appBg">
        <div class="blur-overlay"></div>
        
        <div class="content">
            <header>
                <div class="radio-logo">
                    <div class="radio-title">EXNA FM</div>
                </div>
                <div class="radio-slogan">A Rádio que toca todas!</div>
                <div class="live-badge">AO VIVO</div>
            </header>

            <div class="player-display">
                <div class="artwork-container">
                    <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23333'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm0-4h-2V7h2v7z'/></svg>" class="artwork" id="trackArt" alt="Capa">
                </div>

                <div class="track-info">
                    <div class="track-title" id="trackTitle">Sincronizando Auto DJ...</div>
                    <div class="track-artist" id="trackArtist">Conectando ao Drive</div>
                    <div class="time-status" id="timeStatus">00:00:00</div>
                    <div class="error-msg" id="errorConsole"></div>
                </div>
            </div>

            <div class="controls">
                <button class="play-btn" id="playButton" onclick="togglePlay()">
                    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <div class="footer-brand">&copy; 2026 EXNA FM | Todos os direitos reservados</div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyBVpSXuoQT0jjh6nqzKo5U1IYlaP_qolSs";
        const FOLDER_ID = "1vcukZmaqRgdkg6hEe-zgMjY7H9VwwY9J";
        
        const trackTitleEl = document.getElementById('trackTitle');
        const trackArtistEl = document.getElementById('trackArtist');
        const timeStatusEl = document.getElementById('timeStatus');
        const trackArtEl = document.getElementById('trackArt');
        const appBgEl = document.getElementById('appBg');
        const playIcon = document.getElementById('playIcon');
        const errorConsole = document.getElementById('errorConsole');

        let audioFiles = [];
        let imageFiles = [];
        let timeline = [];
        let totalTimelineDuration = 0;
        
        let currentAudio = null;
        let isPlaying = false;
        let liveTimer = null;

        const SVG_PLAY = '<path d="M8 5v14l11-7z"/>';
        const SVG_PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

        async function loadDriveLibrary() {
            try {
                // Força busca limpa sem cache para listar todos os arquivos atualizados
                const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&maxResults=1000&key=${API_KEY}&t=${Date.now()}`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error("Erro de comunicação com o Google Drive.");
                
                const data = await response.json();
                if (!data.files || data.files.length === 0) throw new Error("Nenhum arquivo encontrado na pasta especificada.");

                audioFiles = [];
                imageFiles = [];

                data.files.forEach(file => {
                    const mime = file.mimeType ? file.mimeType.toLowerCase() : '';
                    const name = file.name ? file.name.toLowerCase() : '';
                    
                    if (mime.includes('audio') || name.endsWith('.mp3') || name.endsWith('.m4a') || name.endsWith('.wav') || name.endsWith('.aac')) {
                        audioFiles.push(file);
                    } else if (mime.includes('image') || name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.png') || name.endsWith('.webp')) {
                        imageFiles.push(file);
                    }
                });

                if (audioFiles.length === 0) throw new Error("Não foram encontrados arquivos de áudio válidos na pasta.");
                
                // Mapeia e limpa o título das músicas
                audioFiles = audioFiles.map(file => {
                    const cleanName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                    const parts = cleanName.split(' - ');
                    return {
                        id: file.id,
                        name: file.name,
                        title: parts[1] ? parts[1].trim() : cleanName.trim(),
                        artist: parts[0] ? parts[0].trim() : "EXNA FM",
                        duration: 180 // Duração base de contingência
                    };
                });

                buildContinuousTimeline();
                startLiveEngine();

            } catch (err) {
                showError(err.message);
            }
        }

        function buildContinuousTimeline() {
            let pool = [...audioFiles];
            let orderedList = [];
            let lastArtist = "";
            let lastTitle = "";

            // Embaralhamento randômico inicial
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            // Aplicação rigorosa das regras anti-repetição consecutiva de banda e nome
            while (pool.length > 0) {
                let validIndex = -1;

                for (let i = 0; i < pool.length; i++) {
                    if (pool[i].artist.toLowerCase() !== lastArtist.toLowerCase() && 
                        pool[i].title.toLowerCase() !== lastTitle.toLowerCase()) {
                        validIndex = i;
                        break;
                    }
                }

                if (validIndex === -1) validIndex = 0;

                let track = pool.splice(validIndex, 1)[0];
                orderedList.push(track);
                
                lastArtist = track.artist;
                lastTitle = track.title;
            }

            timeline = [];
            let accumulatedTime = 0;
            
            orderedList.forEach(track => {
                timeline.push({
                    ...track,
                    startTime: accumulatedTime,
                    endTime: accumulatedTime + track.duration
                });
                accumulatedTime += track.duration;
            });

            totalTimelineDuration = accumulatedTime;
        }

        function startLiveEngine() {
            syncPlayerStatus();
            if (liveTimer) clearInterval(liveTimer);
            liveTimer = setInterval(syncPlayerStatus, 1000);
        }

        function syncPlayerStatus() {
            if (totalTimelineDuration === 0) return;

            const currentUnixSeconds = Math.floor(Date.now() / 1000);
            const positionInLoop = currentUnixSeconds % totalTimelineDuration;

            const currentTrack = timeline.find(t => positionInLoop >= t.startTime && positionInLoop < t.endTime);

            if (currentTrack) {
                const trackOffset = positionInLoop - currentTrack.startTime;
                
                const now = new Date();
                timeStatusEl.innerText = now.toTimeString().split(' ')[0] + " - AO VIVO";

                if (trackTitleEl.innerText !== currentTrack.title) {
                    trackTitleEl.innerText = currentTrack.title;
                    trackArtistEl.innerText = currentTrack.artist;
                    applyArtwork(currentTrack.title, currentTrack.artist);
                    
                    if (isPlaying) {
                        streamAudioTrack(currentTrack.id, trackOffset);
                    }
                }
            }
        }

        function applyArtwork(title, artist) {
            const matchedImg = imageFiles.find(img => {
                const name = img.name.toLowerCase();
                return name.includes(title.toLowerCase()) || name.includes(artist.toLowerCase());
            });

            let imgUrl = "";
            if (matchedImg) {
                imgUrl = `https://www.googleapis.com/drive/v3/files/${matchedImg.id}?alt=media&key=${API_KEY}`;
            } else {
                imgUrl = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 24 24'><rect width='100%25' height='100%25' fill='%2317181e'/><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z' fill='%2300e5ff' opacity='0.35' transform='scale(0.8) translate(3,3)'/></svg>`;
            }

            trackArtEl.src = imgUrl;
            appBgEl.style.backgroundImage = `url('${imgUrl}')`;
        }

        function streamAudioTrack(fileId, startSeconds) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            const streamUrl = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
            currentAudio = new Audio(streamUrl);
            currentAudio.currentTime = startSeconds;
            
            if (isPlaying) {
                currentAudio.play().catch(err => {
                    console.log("Aguardando ação inicial de play do usuário.");
                    isPlaying = false;
                    playIcon.innerHTML = SVG_PLAY;
                });
            }
        }

        function togglePlay() {
            if (!isPlaying) {
                isPlaying = true;
                playIcon.innerHTML = SVG_PAUSE;
                
                const currentUnixSeconds = Math.floor(Date.now() / 1000);
                const positionInLoop = currentUnixSeconds % totalTimelineDuration;
                const currentTrack = timeline.find(t => positionInLoop >= t.startTime && positionInLoop < t.endTime);
                
                if (currentTrack) {
                    streamAudioTrack(currentTrack.id, positionInLoop - currentTrack.startTime);
                    if (currentAudio) currentAudio.play().catch(() => {});
                }
            } else {
                isPlaying = false;
                playIcon.innerHTML = SVG_PLAY;
                if (currentAudio) {
                    currentAudio.pause();
                }
            }
        }

        function showError(msg) {
            errorConsole.innerText = msg;
            errorConsole.style.display = 'block';
            trackTitleEl.innerText = "Erro ao Carregar";
            trackArtistEl.innerText = "Verifique os arquivos do Drive";
        }

        window.onload = loadDriveLibrary;
    </script>
</body>
</html>
