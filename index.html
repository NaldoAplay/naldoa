<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EXNA FM • Rádio Ao Vivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0a1a, #010005);
            min-height: 100vh;
            font-family: 'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f0f0ff;
        }

        .neon-player {
            max-width: 480px;
            width: 100%;
            background: rgba(12, 12, 24, 0.65);
            backdrop-filter: blur(24px);
            border-radius: 56px;
            border: 1px solid rgba(102, 252, 241, 0.25);
            box-shadow: 0 30px 45px -20px rgba(0,0,0,0.8), 0 0 0 1px rgba(102, 252, 241, 0.1) inset, 0 0 18px rgba(102, 252, 241, 0.2);
            padding: 28px 22px 38px;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .playing-active .neon-player {
            border-color: #66fcf1;
            box-shadow: 0 0 28px rgba(102, 252, 241, 0.4), 0 0 0 1px #66fcf1 inset;
        }

        .radio-brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-img {
            width: 48px;
            height: 48px;
            background: #1a1a2e;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 0 12px #66fcf180;
        }
        .brand-text h2 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff, #66fcf1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand-text p {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #ff66c0;
            text-transform: uppercase;
            font-weight: 600;
        }
        .live-badge {
            background: #ff0055cc;
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 80px;
            font-size: 0.7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #ff66aa;
            animation: livePulse 1.5s infinite;
        }
        @keyframes livePulse {
            0% { box-shadow: 0 0 0 0 #ff0055aa; opacity: 0.9; }
            70% { box-shadow: 0 0 0 10px #ff005500; opacity: 1; }
            100% { box-shadow: 0 0 0 0 #ff005500; opacity: 0.9; }
        }

        .cover-art-container {
            position: relative;
            margin: 20px 0 25px;
            display: flex;
            justify-content: center;
        }
        .cover-glow {
            width: 250px;
            height: 250px;
            border-radius: 38px;
            background: linear-gradient(145deg, #2c2c44, #13131f);
            padding: 6px;
            box-shadow: 0 20px 35px -8px black;
            transition: transform 0.3s ease;
        }
        .cover-glow img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 32px;
            display: block;
            background: #0b0b14;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
            transition: all 0.5s;
        }
        .playing-active .cover-glow {
            transform: scale(1.02);
            box-shadow: 0 0 0 3px #66fcf1, 0 25px 40px -12px black;
        }

        .track-info {
            text-align: center;
            margin: 12px 0 28px;
        }
        .track-title {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            background: linear-gradient(to right, #ffffff, #bbf0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 10px;
        }
        .track-artist {
            font-size: 1.1rem;
            font-weight: 500;
            color: #66fcf1;
            margin-top: 8px;
            text-shadow: 0 0 6px #66fcf180;
            letter-spacing: -0.2px;
        }

        .play-wrapper {
            display: flex;
            justify-content: center;
            margin: 12px 0 15px;
        }
        .play-circle {
            background: radial-gradient(circle at 30% 20%, #a945ff, #6a1b9a);
            width: 90px;
            height: 90px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 8px 25px #bc5aff70;
        }
        .play-circle i {
            font-size: 2.4rem;
            color: white;
            filter: drop-shadow(0 2px 4px black);
        }
        .play-circle:active {
            transform: scale(0.94);
        }
        .playing-active .play-circle {
            background: radial-gradient(circle at 30% 20%, #66fcf1, #0f6b80);
            box-shadow: 0 0 28px #66fcf1;
        }

        .status-message {
            font-size: 0.75rem;
            text-align: center;
            font-weight: 500;
            background: rgba(0,0,0,0.5);
            display: inline-block;
            width: auto;
            margin: 12px auto 0;
            padding: 4px 14px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            color: #bbe1ff;
        }

        .social-footer {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            gap: 35px;
        }
        .social-footer a {
            color: #a0c0ff;
            font-size: 1.6rem;
            transition: all 0.2s;
        }
        .social-footer a:hover {
            color: #66fcf1;
            transform: translateY(-4px);
        }
        .copyright {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 30px;
            color: #6b6b8b;
        }

        .install-btn {
            position: fixed;
            bottom: 22px;
            right: 22px;
            background: rgba(20, 20, 40, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            border: 1px solid #66fcf1;
            padding: 12px 16px;
            color: #66fcf1;
            font-size: 1.25rem;
            gap: 8px;
            display: none;
            align-items: center;
            font-weight: 600;
            cursor: pointer;
            transform: scale(0);
            transition: 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
            box-shadow: 0 4px 12px black;
            z-index: 1000;
        }
        .install-btn.visible {
            display: flex;
            transform: scale(1);
        }
        .install-btn i {
            font-size: 1.2rem;
        }

        @media (max-width: 520px) {
            .neon-player { padding: 20px 16px 30px; }
            .cover-glow { width: 210px; height: 210px; }
            .track-title { font-size: 1.3rem; white-space: normal; word-break: break-word; }
        }
    </style>
</head>
<body>

<div class="player-container" id="playerContainer">
    <div class="neon-player">
        <div class="radio-brand">
            <div class="logo-area">
                <img src="logo-quadrada.png" alt="logo" class="logo-img" id="staticLogo" onerror="this.src='https://placehold.co/400x400/1a1a2e/66fcf1?text=EXNA'">
                <div class="brand-text">
                    <h2>EXNA FM</h2>
                    <p>⚡ AO VIVO ⚡</p>
                </div>
            </div>
            <div class="live-badge">
                <i class="fas fa-circle" style="font-size: 0.6rem;"></i> LIVE
            </div>
        </div>

        <div class="cover-art-container">
            <div class="cover-glow">
                <img id="dynamicCover" src="logo-quadrada.png" alt="capa da música">
            </div>
        </div>

        <div class="track-info">
            <div class="track-title" id="trackTitle">Sintonizando...</div>
            <div class="track-artist" id="trackArtist">EXNA FM</div>
        </div>

        <div class="play-wrapper">
            <button class="play-circle" id="masterPlayBtn" disabled>
                <i id="playIcon" class="fas fa-spinner fa-pulse"></i>
            </button>
        </div>
        <div style="text-align: center;">
            <span class="status-message" id="liveStatusText">📡 conectando à torre digital</span>
        </div>

        <div class="social-footer">
            <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://youtube.com" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://tiktok.com" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
        <div class="copyright">
            EXNA FM © 2026 | Transmissão em tempo real
        </div>
    </div>
</div>

<button id="installPwaBtn" class="install-btn">
    <i class="fas fa-download"></i> <span>APP</span>
</button>

<audio id="streamAudio" preload="auto" crossorigin="anonymous"></audio>

<script>
    // CONFIGURAÇÃO DO GOOGLE DRIVE
    const FOLDER_ID = '1vcukZmaqRgdkg6hEe-zgMjY7H9VwwY9J';
    const API_KEY = 'AIzaSyBVpSXuoQT0jjh6nqzKo5U1IYlaP_qolSs';
    
    // Elementos DOM
    const audioEl = document.getElementById('streamAudio');
    const playBtn = document.getElementById('masterPlayBtn');
    const playIconSpan = document.getElementById('playIcon');
    const trackTitleSpan = document.getElementById('trackTitle');
    const trackArtistSpan = document.getElementById('trackArtist');
    const coverImg = document.getElementById('dynamicCover');
    const statusSpan = document.getElementById('liveStatusText');
    const containerDiv = document.getElementById('playerContainer');
    
    // Estado global
    let musicLibrary = [];
    let globalPlaylist = [];
    let currentSongIndex = 0;
    let isUserPaused = true;
    let segmentDurationSec = 180;
    let isPlayingFlag = false;
    let deferredPrompt = null;
    
    // Buscar arquivos do Google Drive
    async function fetchDriveFiles() {
        const queryUrl = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
        
        try {
            statusSpan.innerText = "📀 Carregando músicas do Drive...";
            const response = await fetch(queryUrl);
            const data = await response.json();
            
            if (!data.files || data.files.length === 0) {
                statusSpan.innerText = "❌ Nenhum arquivo encontrado na pasta";
                console.error("Pasta vazia ou ID inválido");
                return false;
            }
            
            console.log("Arquivos encontrados:", data.files.map(f => f.name));
            
            // Separar áudios (MP3) e imagens (PNG)
            const audioFiles = data.files.filter(f => {
                const name = f.name.toLowerCase();
                return name.endsWith('.mp3');
            });
            
            const imageFiles = data.files.filter(f => {
                const name = f.name.toLowerCase();
                return name.endsWith('.png');
            });
            
            if (audioFiles.length === 0) {
                statusSpan.innerText = "❌ Nenhum arquivo MP3 encontrado na pasta";
                console.error("Sem arquivos de áudio");
                return false;
            }
            
            console.log(`Encontrados: ${audioFiles.length} áudios, ${imageFiles.length} imagens PNG`);
            
            // Montar biblioteca de músicas
            musicLibrary = audioFiles.map(audio => {
                // Remove extensão .mp3
                const fullName = audio.name.replace(/\.mp3$/i, "");
                let artist = "EXNA FM";
                let title = fullName;
                
                // Tentar extrair artista e título do nome do arquivo (formato: Artista - Musica)
                if (fullName.includes(" - ")) {
                    const parts = fullName.split(" - ");
                    artist = parts[0].trim();
                    title = parts.slice(1).join(" - ").trim();
                }
                
                // Buscar imagem PNG correspondente (mesmo nome base)
                let matchedCover = imageFiles.find(img => {
                    const imgName = img.name.replace(/\.png$/i, "").toLowerCase();
                    const songName = fullName.toLowerCase();
                    return imgName === songName;
                });
                
                let coverUrl = 'logo-quadrada.png';
                if (matchedCover) {
                    coverUrl = `https://www.googleapis.com/drive/v3/files/${matchedCover.id}?alt=media&key=${API_KEY}`;
                    console.log(`Capa encontrada para ${fullName}: ${matchedCover.name}`);
                } else {
                    console.log(`Nenhuma capa PNG encontrada para: ${fullName}`);
                }
                
                return {
                    id: audio.id,
                    title: title || fullName,
                    artist: artist,
                    coverUrl: coverUrl,
                    url: `https://www.googleapis.com/drive/v3/files/${audio.id}?alt=media&key=${API_KEY}`
                };
            });
            
            if (musicLibrary.length === 0) return false;
            
            // Gerar playlist global embaralhada
            buildGlobalPlaylist();
            return true;
            
        } catch (error) {
            console.error("Erro ao acessar Google Drive:", error);
            statusSpan.innerText = "❌ Erro ao conectar com Google Drive";
            return false;
        }
    }
    
    // Gerar playlist global com semente diária (mesma para todos)
    function buildGlobalPlaylist() {
        if (!musicLibrary.length) return;
        
        // Semente baseada na data atual (todos os ouvintes sincronizam)
        const today = new Date();
        const seed = today.getFullYear() * 366 + (today.getMonth() + 1) * 31 + today.getDate();
        
        let shuffled = [...musicLibrary];
        // Embaralhamento determinístico
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.sin(seed + i) * 10000) % (i + 1);
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        
        // Evitar artistas repetidos consecutivamente
        let finalPlaylist = [];
        let tempPool = [...shuffled];
        let lastArtist = "";
        
        while(tempPool.length > 0) {
            let index = tempPool.findIndex(song => song.artist !== lastArtist);
            if(index === -1) index = 0;
            let selected = tempPool.splice(index, 1)[0];
            finalPlaylist.push(selected);
            lastArtist = selected.artist;
        }
        
        globalPlaylist = finalPlaylist;
        console.log("Playlist gerada:", globalPlaylist.map(s => `${s.artist} - ${s.title}`));
    }
    
    // Obter posição atual na grade mundial (baseado no relógio)
    function getCurrentWorldSlot() {
        if (!globalPlaylist.length) return null;
        
        const totalDurationSec = globalPlaylist.length * segmentDurationSec;
        const nowUnixSec = Math.floor(Date.now() / 1000);
        const cyclePosition = nowUnixSec % totalDurationSec;
        const currentSongIdx = Math.floor(cyclePosition / segmentDurationSec);
        const seekOffset = cyclePosition % segmentDurationSec;
        
        return {
            index: currentSongIdx % globalPlaylist.length,
            seekTime: seekOffset
        };
    }
    
    // Atualizar interface com informações da música
    function updateUI(song) {
        if (!song) return;
        
        trackTitleSpan.innerText = song.title.toUpperCase();
        trackArtistSpan.innerText = song.artist;
        
        if (song.coverUrl && song.coverUrl !== coverImg.src) {
            coverImg.src = song.coverUrl;
            coverImg.onerror = () => { 
                console.log("Erro ao carregar capa, usando padrão");
                coverImg.src = 'logo-quadrada.png'; 
            };
        }
        
        // Atualizar Media Session (tela bloqueada)
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.title,
                artist: song.artist,
                album: 'EXNA FM • AO VIVO',
                artwork: [
                    { src: song.coverUrl !== 'logo-quadrada.png' ? song.coverUrl : 'logo-quadrada.png', sizes: '512x512', type: 'image/png' }
                ]
            });
        }
    }
    
    // Carregar música pelo índice
    async function loadSongByIndex(index, seekSeconds = 0, forcePlay = false) {
        if (!globalPlaylist.length) return false;
        
        const safeIndex = index % globalPlaylist.length;
        const song = globalPlaylist[safeIndex];
        if (!song) return false;
        
        // Atualizar UI primeiro (efeito ao vivo instantâneo)
        updateUI(song);
        
        // Carregar áudio se necessário
        if (audioEl.src !== song.url) {
            audioEl.src = song.url;
            audioEl.load();
        }
        
        if (seekSeconds > 0 && seekSeconds < segmentDurationSec) {
            audioEl.currentTime = seekSeconds;
        }
        
        currentSongIndex = safeIndex;
        
        if (!isUserPaused || forcePlay) {
            try {
                await audioEl.play();
                isPlayingFlag = true;
                updatePlayButtonUI(true);
                containerDiv.classList.add('playing-active');
                statusSpan.innerText = "🎙️ TRANSMISSÃO AO VIVO";
            } catch (err) {
                console.log("Autoplay bloqueado:", err);
                isPlayingFlag = false;
                updatePlayButtonUI(false);
                statusSpan.innerText = "🔘 Clique no play para ouvir";
            }
        }
        
        return true;
    }
    
    // Sincronizar com tempo real
    async function syncToLiveWorld() {
        if (!globalPlaylist.length) return;
        
        const slot = getCurrentWorldSlot();
        if (!slot) return;
        
        const needSync = (slot.index !== currentSongIndex || Math.abs(audioEl.currentTime - slot.seekTime) > 3);
        
        if (needSync && !isUserPaused) {
            await loadSongByIndex(slot.index, slot.seekTime);
        } else if (needSync && isUserPaused) {
            // Apenas atualizar informações visuais (prévia)
            const song = globalPlaylist[slot.index];
            if (song) updateUI(song);
        }
    }
    
    // Atualizar botão play/pause
    function updatePlayButtonUI(isPlaying) {
        if (isPlaying) {
            playIconSpan.className = "fas fa-stop";
            playBtn.classList.add('playing-active');
        } else {
            playIconSpan.className = "fas fa-play";
            playBtn.classList.remove('playing-active');
        }
    }
    
    // Alternar reprodução
    async function toggleLiveRadio() {
        if (!globalPlaylist.length) {
            statusSpan.innerText = "⏳ Carregando playlist...";
            return;
        }
        
        if (audioEl.paused) {
            isUserPaused = false;
            const slot = getCurrentWorldSlot();
            if (slot) {
                await loadSongByIndex(slot.index, slot.seekTime, true);
            } else {
                await loadSongByIndex(0, 0, true);
            }
            try {
                await audioEl.play();
                isPlayingFlag = true;
                updatePlayButtonUI(true);
                containerDiv.classList.add('playing-active');
                statusSpan.innerText = "📡 AO VIVO • EM TEMPO REAL";
            } catch(e) {
                statusSpan.innerText = "⚠️ Toque novamente";
            }
        } else {
            audioEl.pause();
            isUserPaused = true;
            isPlayingFlag = false;
            updatePlayButtonUI(false);
            containerDiv.classList.remove('playing-active');
            statusSpan.innerText = "⏸️ Pausado • Toque play para voltar";
        }
    }
    
    // Próxima música automática
    audioEl.addEventListener('ended', async () => {
        if (!isUserPaused && globalPlaylist.length) {
            const slot = getCurrentWorldSlot();
            if (slot) {
                await loadSongByIndex(slot.index, slot.seekTime, true);
                if (!isUserPaused && audioEl.paused) {
                    try { await audioEl.play(); } catch(e) {}
                }
            }
        }
    });
    
    // Tratar erros
    audioEl.addEventListener('error', () => {
        console.log("Erro no áudio, sincronizando com a grade...");
        if (!isUserPaused && globalPlaylist.length) {
            const slot = getCurrentWorldSlot();
            if (slot) loadSongByIndex(slot.index, slot.seekTime, true);
        }
    });
    
    // Sincronização periódica (a cada 3 segundos)
    setInterval(() => {
        syncToLiveWorld();
    }, 3000);
    
    // Inicializar
    async function initRadio() {
        playBtn.disabled = true;
        const success = await fetchDriveFiles();
        
        if (success && globalPlaylist.length) {
            playBtn.disabled = false;
            statusSpan.innerText = "📻 SINAL ESTÁVEL • PRONTO";
            
            const slot = getCurrentWorldSlot();
            if (slot && globalPlaylist[slot.index]) {
                updateUI(globalPlaylist[slot.index]);
            }
            
            isUserPaused = true;
            updatePlayButtonUI(false);
            containerDiv.classList.remove('playing-active');
            statusSpan.innerText = "🎧 Toque no botão para ouvir ao vivo";
        } else {
            statusSpan.innerText = "⚠️ Verifique a pasta do Drive (MP3 + PNG)";
            playBtn.disabled = true;
        }
    }
    
    // Eventos
    playBtn.addEventListener('click', toggleLiveRadio);
    
    // PWA Install
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installBtnEl = document.getElementById('installPwaBtn');
        installBtnEl.classList.add('visible');
    });
    
    document.getElementById('installPwaBtn').addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt = null;
            document.getElementById('installPwaBtn').classList.remove('visible');
        }
    });
    
    // Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(e => console.log("SW error:", e));
    }
    
    // Iniciar
    initRadio();
</script>
</body>
</html>
