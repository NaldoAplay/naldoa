<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EXNA FM - A Rádio que toca todas!</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EXNA FM">
  <link rel="apple-touch-icon" href="logo-quadrada.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Reset Geral estilo iOS Premium */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top left, #1a0933, #4a1236, #05010d);
      background-size: 400% 400%;
      animation: fundoFluido 20s ease infinite;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      overflow: hidden;
    }

    @keyframes fundoFluido {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Blur de Fundo baseado na Logo */
    .bg-blur {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('logo-quadrada.png') no-repeat center center;
      background-size: cover;
      filter: blur(50px) brightness(0.3);
      z-index: -1;
      transform: scale(1.15);
    }

    /* --- TOPO: Header Glassmorphism --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 25px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Título da rádio ultra estilizado */
    .titulo-radio h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff, #a1a1a1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
    }

    .titulo-radio p {
      font-size: 11px;
      color: #ff2d55; /* Rosa Neon estilo Apple Music */
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .redes-sociais {
      display: flex;
      gap: 22px;
    }

    .redes-sociais a {
      color: #fff;
      font-size: 22px;
      text-decoration: none;
      transition: transform 0.2s, color 0.2s;
      opacity: 0.75;
    }

    .redes-sociais a:hover {
      transform: scale(1.2);
      opacity: 1;
      color: #ff2d55;
    }

    /* --- CENTRO: Card do Player --- */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .player-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 32px;
      padding: 40px 35px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
    }

    .capa-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 25px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .capa-streaming {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .tocando .capa-streaming {
      transform: scale(1.05);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 45, 85, 0.15);
      color: #ff2d55;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 45, 85, 0.25);
    }

    .status-badge .ponto-pisca {
      width: 6px;
      height: 6px;
      background-color: #ff2d55;
      border-radius: 50%;
      animation: piscar 1.6s infinite;
    }

    @keyframes piscar {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    .info-musica h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .info-musica p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 30px;
      font-weight: 500;
    }

    /* Botão Play Center */
    .controles {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-play-live {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 30px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(255, 255, 255, 0.2);
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-play-live:active {
      transform: scale(0.92);
      background-color: #ececec;
    }

    /* --- RODAPÉ CUSTOMIZADO --- */
    footer {
      text-align: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.5);
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      letter-spacing: 0.5px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="bg-blur"></div>

  <header>
    <div class="logo-area">
      <img src="logo-quadrada.png" alt="Logo EXNA FM" class="logo-img">
      <div class="titulo-radio">
        <h1>EXNA FM</h1>
        <p>AutoDJ 24h</p>
      </div>
    </div>
    
    <div class="redes-sociais">
      <a href="https://www.instagram.com/naldoaoficial?igsh=d3FkMDM5a2xtaWE%3D&utm_source=qr" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://www.tiktok.com/@djnaldoaoficial?_r=1&_t=ZS-96WdJJwxzQj" target="_blank"><i class="fab fa-tiktok"></i></a>
      <a href="https://youtube.com/@djnaldoaoficial?si=7b6vo375UE93VXq7" target="_blank"><i class="fab fa-youtube"></i></a>
    </div>
  </header>

  <main>
    <div class="player-container" id="playerCard">
      <div class="capa-wrapper">
        <img src="logo-quadrada.png" alt="Capa EXNA" class="capa-streaming">
      </div>
      
      <div class="status-badge">
        <div class="ponto-pisca"></div>
        Ao Vivo
      </div>

      <div class="info-musica">
        <h2 id="txtTitulo">Sintonizando...</h2>
        <p>EXNA FM - A Rádio que toca todas!</p>
      </div>
      
      <div class="controles">
        <button class="btn-play-live" id="btnPlayLive">
          <i class="fas fa-play" id="iconePlay"></i>
        </button>
      </div>
    </div>
  </main>

  <footer>
    <p>EXNA FM COPY 2026</p>
  </footer>

  <audio id="audioRadio" crossorigin="anonymous"></audio>

  <script>
    const urlArchiveJson = "https://archive.org/metadata/exna-fm";
    const audio = document.getElementById('audioRadio');
    const btnPlayLive = document.getElementById('btnPlayLive');
    const iconePlay = document.getElementById('iconePlay');
    const playerCard = document.getElementById('playerCard');
    const txtTitulo = document.getElementById('txtTitulo');

    let playlistMp3 = [];
    let musicaTocandoAgora = null;

    // 1. Coleta e mapeia os 119 arquivos direto do Internet Archive
    async function carregarAutoDJ() {
      try {
        const resposta = await fetch(urlArchiveJson);
        const dados = await resposta.json();
        const arquivosServidor = dados.files;

        arquivosServidor.forEach(arq => {
          if (arq.name.endsWith('.mp3')) {
            playlistMp3.push({
              id: arq.name,
              url: `https://archive.org/download/exna-fm/${arq.name}`
            });
          }
        });

        if (playlistMp3.length > 0) {
          // Seleciona uma faixa inicial aleatória para começar o fluxo 24h
          escolherProximaMusicaAleatoria();
        } else {
          txtTitulo.innerText = "Playlist vazia.";
        }

      } catch (erro) {
        console.error("Erro no streaming do acervo:", erro);
        txtTitulo.innerText = "Erro ao conectar sinal.";
      }
    }

    // 2. Sistema de Sorteio de Faixas (AutoDJ)
    function escolherProximaMusicaAleatoria() {
      const indiceSorteado = Math.floor(Math.random() * playlistMp3.length);
      musicaTocandoAgora = playlistMp3[indiceSorteado];
      
      audio.src = musicaTocandoAgora.url;
      
      // Limpa o texto limpando o prefixo do arquivo
      const numeroSequencia = musicaTocandoAgora.id.replace('music', '').replace('.mp3', '');
      txtTitulo.innerText = `Música Sequência #${numeroSequencia}`;
      
      atualizarMetadadosSistema(numeroSequencia);
    }

    // 3. Controle Operacional (Play/Pause)
    function comandarPlayer() {
      if (audio.paused) {
        audio.play().then(() => {
          iconePlay.className = "fas fa-pause";
          playerCard.classList.add('tocando');
          if (musicaTocandoAgora) {
            const numeroSequencia = musicaTocandoAgora.id.replace('music', '').replace('.mp3', '');
            atualizarMetadadosSistema(numeroSequencia);
          }
        }).catch(err => console.log("Aguardando ativação do áudio pelo usuário:", err));
      } else {
        audio.pause();
        iconePlay.className = "fas fa-play";
        playerCard.classList.remove('tocando');
      }
    }

    // 4. Integração Definitiva com a Tela de Bloqueio (Garante não parar em background)
    function atualizarMetadadosSistema(numeroFaixa) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: `Música Sequência #${numeroFaixa}`,
          artist: 'AO VIVO', 
          album: 'EXNA FM - A Rádio que toca todas!', // Injetado com sucesso no subtítulo do iOS!
          artwork: [
            { src: 'logo-quadrada.png', sizes: '512x512', type: 'image/png' }
          ]
        });

        // Habilita as ações do sistema operacional para responder ao toque físico fora do app
        navigator.mediaSession.setActionHandler('play', comandarPlayer);
        navigator.mediaSession.setActionHandler('pause', comandarPlayer);
      }
    }

    // 5. MOTOR DO LOOP CONTINUO (AutoDJ): Quando o áudio termina, ele puxa outra na hora
    audio.addEventListener('ended', () => {
      escolherProximaMusicaAleatoria();
      audio.play().then(() => {
        playerCard.classList.add('tocando');
        iconePlay.className = "fas fa-pause";
      }).catch(e => console.log("Erro de transição em background:", e));
    });

    btnPlayLive.addEventListener('click', comandarPlayer);

    // Inicializa a rádio
    carregarAutoDJ();
  </script>
</body>
</html>
