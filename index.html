<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXNA FM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-purple: #8a2be2;
            --neon-aqua: #66fcf1;
            --neon-pink: #ff0055;
            --dark-bg: #050608;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(138, 43, 226, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 85, 0.15) 0%, transparent 45%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-player {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            width: 100%;
            max-width: 380px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.02);
            position: relative;
        }

        .radio-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .radio-top-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--neon-aqua));
        }

        .radio-brand-text h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            margin: 0;
            letter-spacing: 1px;
            text-align: left;
        }

        .radio-brand-text h2 span { color: var(--neon-aqua); }

        .radio-brand-text p {
            margin: 0;
            font-size: 0.75rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            text-align: left;
        }

        .live-indicator {
            background: var(--neon-pink);
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px var(--neon-pink);
            animation: pulse 2s infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

        .cover-area {
            width: 220px;
            height: 220px;
            margin: 0 auto 25px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }

        .playing .cover-area {
            border-color: var(--neon-aqua);
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.25);
            transform: scale(1.02);
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #111;
        }

        .info-area h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            margin: 0;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-area p {
            font-size: 1.1rem;
            color: var(--neon-aqua);
            margin: 6px 0 30px;
            font-weight: 600;
        }

        .play-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(45deg, var(--primary-purple), var(--neon-pink));
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.4);
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.5);
        }

        .play-btn.active {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px #fff;
        }

        footer {
            padding: 25px;
            text-align: center;
            background: rgba(0,0,0,0.4);
            border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .social-links {
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 22px;
        }

        .social-links a {
            color: var(--neon-aqua);
            font-size: 1.4rem;
            transition: 0.3s;
        }

        .social-links a:hover {
            color: var(--neon-pink);
            transform: translateY(-3px);
        }

        .copyright {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .glass-player { padding: 30px 20px; margin: 10px; }
            .cover-area { width: 190px; height: 190px; }
        }
    </style>
</head>
<body>

    <main>
        <div class="glass-player" id="main-player">
            
            <div class="radio-header">
                <img src="logo-quadrada.png" class="radio-top-logo" alt="EXNA Logo">
                <div class="radio-brand-text">
                    <h2>EXNA <span>FM</span></h2>
                    <p>Ecossistemas EXNA</p>
                </div>
            </div>

            <div class="live-indicator">
                <i class="fas fa-microchip"></i> AUTODJ - LIVE
            </div>

            <div class="cover-area">
                <img src="logo-quadrada.png" id="track-cover" class="cover-img" alt="Capa da Música">
            </div>

            <div class="info-area">
                <h1 id="track-title">SINCRONIZANDO...</h1>
                <p id="artist-name">DJ NaldoA</p>
            </div>

            <button class="play-btn" id="master-play" onclick="toggleRadio()" disabled>
                <i class="fas fa-spinner fa-spin" id="btn-icon"></i>
            </button>
            
            <p id="status-text" style="margin-top:20px; font-size: 0.8rem; color: #45a29e; font-weight: bold; letter-spacing: 1px;"></p>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://youtube.com/" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://wa.me/" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
        <div class="copyright">
            EXNA FM © 2026 | NaldoA | Todos os Direitos Reservados
        </div>
    </footer>

    <audio id="audio-core" crossorigin="anonymous"></audio>

    <script>
        const PASTA_ID = '1vcukZmaqRgdkg6hEe-zgMjY7H9VwwY9J'; 
        const API_KEY = 'AIzaSyBVpSXuoQT0jjh6nqzKo5U1IYlaP_qolSs'; 

        const player = document.getElementById('audio-core');
        const btn = document.getElementById('master-play');
        const icon = document.getElementById('btn-icon');
        const card = document.getElementById('main-player');
        const txtTitle = document.getElementById('track-title');
        const txtCover = document.getElementById('track-cover');
        const txtStatus = document.getElementById('status-text');

        let musicas = [];
        let imagens = [];
        let playlistMista = [];

        async function fetchDriveData() {
            const url = `https://www.googleapis.com/drive/v3/files?q='${PASTA_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(data.files && data.files.length > 0) {
                    musicas = data.files.filter(f => f.mimeType.includes('audio')).sort((a,b) => a.name.localeCompare(b.name));
                    imagens = data.files.filter(f => f.mimeType.includes('image'));

                    playlistMista = musicas.map(m => {
                        const nomeSemExtensao = m.name.replace(/\.[^/.]+$/, "");
                        const capaCorrespondente = imagens.find(img => img.name.startsWith(nomeSemExtensao));
                        
                        return {
                            id: m.id,
                            name: nomeSemExtensao,
                            dur: 240, 
                            capaUrl: capaCorrespondente ? `https://drive.google.com/uc?id=${capaCorrespondente.id}&export=view` : 'logo-quadrada.png'
                        };
                    });
                    
                    txtTitle.innerText = "EXNA FM CONNECTED";
                    btn.disabled = false;
                    icon.className = "fas fa-play";
                    txtStatus.innerText = "AUTO-DJ ALEATÓRIO ATIVO";
                } else {
                    txtTitle.innerText = "PASTA VAZIA";
                }
            } catch (e) {
                txtTitle.innerText = "ERRO DE CONEXÃO";
                txtStatus.innerText = "Verifique os limites da sua API.";
            }
        }

        function obterPlaylistEmbaralhadaEstavel(duracaoTotal) {
            let tempoAtual = Math.floor(Date.now() / 1000);
            let tempoBase = 1767222000;
            let cicloAtual = Math.floor((tempoAtual - tempoBase) / duracaoTotal);
            
            let listaEmbaralhada = [...playlistMista];
            let semente = cicloAtual || 1;
            
            function randomEstavel() {
                let x = Math.sin(semente++) * 10000;
                return x - Math.floor(x);
            }

            for (let i = listaEmbaralhada.length - 1; i > 0; i--) {
                const j = Math.floor(randomEstavel() * (i + 1));
                [listaEmbaralhada[i], listaEmbaralhada[j]] = [listaEmbaralhada[j], listaEmbaralhada[i]];
            }
            return listaEmbaralhada;
        }

        // Correção aplicada na linha matemática temporal
        function getLiveState() {
            let duracaoTotalCadeia = playlistMista.reduce((a, b) => a + b.dur, 0);
            let listaDaGrade = obterPlaylistEmbaralhadaEstavel(duracaoTotalCadeia);

            let tempoBase = 1767222000;
            let now = Math.floor(Date.now() / 1000);
            let elapsed = (now - tempoBase) % duracaoTotalCadeia;
            if (elapsed < 0) elapsed += duracaoTotalCadeia;

            let current = 0;
            for (let m of listaDaGrade) {
                if (elapsed < current + m.dur) {
                    return { music: m, seek: elapsed - current };
                }
                current += m.dur;
            }
        }

        function toggleRadio() {
            if (player.paused) {
                const state = getLiveState();
                
                // CORREÇÃO: URL oficial de streaming via API com alt=media
                player.src = `https://www.googleapis.com/drive/v3/files/${state.music.id}?alt=media&key=${API_KEY}`;
                player.currentTime = state.seek;
                
                player.play().then(() => {
                    icon.className = "fas fa-stop";
                    btn.classList.add('active');
                    card.classList.add('playing');
                    
                    txtTitle.innerText = state.music.name;
                    txtCover.src = state.music.capaUrl;
                    txtStatus.innerText = "Ouvindo ao vivo com o mundo";
                    
                    updateLockScreen(state.music.name, state.music.capaUrl);
                }).catch((error) => {
                    console.error("Erro no play:", error);
                    txtStatus.innerText = "Clique novamente para iniciar.";
                });
            } else {
                player.pause();
                player.src = "";
                icon.className = "fas fa-play";
                btn.classList.remove('active');
                card.classList.remove('playing');
                txtTitle.innerText = "EXNA FM";
                txtCover.src = "logo-quadrada.png";
                txtStatus.innerText = "Sintonia Pausada.";
            }
        }

        setInterval(() => {
            if (!player.paused && playlistMista.length > 0) {
                const check = getLiveState();
                if (!player.src.includes(check.music.id)) {
                    player.pause();
                    // CORREÇÃO: Transição automática ajustada para alt=media
                    player.src = `https://www.googleapis.com/drive/v3/files/${check.music.id}?alt=media&key=${API_KEY}`;
                    player.currentTime = check.seek;
                    player.play().then(() => {
                        txtTitle.innerText = check.music.name;
                        txtCover.src = check.music.capaUrl;
                        updateLockScreen(check.music.name, check.music.capaUrl);
                    }).catch(e => console.log("Erro na transição automática:", e));
                }
            }
        }, 4000);

        function updateLockScreen(title, capaUrl) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title,
                    artist: 'DJ NaldoA',
                    album: 'EXNA FM - AutoDJ',
                    artwork: [
                        { src: capaUrl, sizes: '512x512', type: 'image/png' },
                        { src: 'logo-quadrada.png', sizes: '512x512', type: 'image/png' }
                    ]
                });
                
                navigator.mediaSession.setActionHandler('play', () => { toggleRadio(); });
                navigator.mediaSession.setActionHandler('pause', () => { toggleRadio(); });
            }
        }

        fetchDriveData();
    </script>
</body>
</html>
