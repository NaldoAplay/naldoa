<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#8a2be2">
    <title>NaldoA Play - A sua rádio web!</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 40%, #0a0f1e, #03060c);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Partículas de fundo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(255,215,0,0.15), transparent),
                radial-gradient(3px 3px at 80% 70%, rgba(138,43,226,0.15), transparent),
                radial-gradient(1px 1px at 40% 90%, rgba(255,0,85,0.1), transparent);
            background-repeat: no-repeat;
            background-size: 200px 200px, 300px 300px, 150px 150px;
            pointer-events: none;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translate(0, 0); opacity: 0.5; }
            50% { transform: translate(30px, 20px); opacity: 0.8; }
            100% { transform: translate(0, 0); opacity: 0.5; }
        }

        /* Vidro fosco principal */
        .glass-radio {
            max-width: 550px;
            width: 100%;
            background: rgba(10, 20, 30, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
            overflow: hidden;
            position: relative;
            z-index: 1;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .glass-radio:hover {
            border-color: rgba(255, 215, 0, 0.25);
            box-shadow: 0 35px 55px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,215,0,0.1);
        }

        .inner {
            padding: 32px 28px 38px;
        }

        /* Header com logo e nome */
        .station-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(255,215,0,0.3);
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0% { box-shadow: 0 0 0 0 rgba(255,215,0,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(255,215,0,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,215,0,0); }
        }

        .station-title h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFE68F, #FFA500, #FFD700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .station-title p {
            font-size: 0.6rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .live-badge {
            background: rgba(231, 76, 60, 0.85);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #ff5e5e;
            border-radius: 50%;
            animation: livePulse 1.2s infinite;
            box-shadow: 0 0 5px #ff0000;
        }

        @keyframes livePulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0.2; }
        }

        /* Container do slideshow com efeito de blur atrás */
        .slideshow-section {
            margin: 15px 0 20px;
            position: relative;
        }

        .blur-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: blur(30px);
            opacity: 0.5;
            border-radius: 40px;
            z-index: 0;
            transition: all 0.5s ease;
            background-size: cover;
            background-position: center;
        }

        .image-frame {
            position: relative;
            z-index: 2;
            width: 260px;
            height: 260px;
            margin: 0 auto;
            border-radius: 35px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.1);
        }

        .playing .image-frame {
            animation: frameGlow 2s ease-in-out infinite;
        }

        @keyframes frameGlow {
            0% { box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,215,0,0.2); }
            50% { box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(255,215,0,0.6); }
            100% { box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,215,0,0.2); }
        }

        .slideshow-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .playing .slideshow-img {
            animation: imagePulse 3s ease-in-out infinite;
        }

        @keyframes imagePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Legenda da imagem */
        .image-caption {
            text-align: center;
            margin-top: 12px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1px;
        }

        /* Informações da música */
        .track-info {
            text-align: center;
            margin: 15px 0 15px;
        }

        .track-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .track-artist {
            font-size: 0.85rem;
            color: #FFD966;
            margin-top: 5px;
            font-weight: 600;
        }

        /* Controles */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 20px 0;
        }

        .ctrl-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: #FFE5B4;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.25s;
            backdrop-filter: blur(4px);
        }

        .ctrl-btn:hover {
            background: rgba(255,215,0,0.2);
            border-color: rgba(255,215,0,0.5);
            transform: scale(1.05);
        }

        #playPauseBtn {
            width: 75px;
            height: 75px;
            background: linear-gradient(145deg, rgba(255,215,0,0.9), rgba(255,140,0,0.9));
            color: #1a1f2e;
            font-size: 1.7rem;
            border: none;
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }

        #playPauseBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(255,215,0,0.8);
        }

        #playPauseBtn.playing {
            background: white;
            color: #ff3366;
        }

        /* Barra de progresso */
        .progress-section {
            margin: 15px 0 10px;
        }

        .progress-area {
            background: rgba(45, 55, 72, 0.7);
            border-radius: 30px;
            height: 5px;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #FFD700, #FFA500);
            width: 0%;
            height: 5px;
            border-radius: 30px;
        }

        .time-stamp {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #aaa;
            margin-top: 8px;
        }

        /* Volume */
        .volume-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0,0,0,0.25);
            padding: 6px 18px;
            border-radius: 40px;
            width: fit-content;
            margin: 15px auto 0;
        }

        .volume-row i {
            color: #FFD966;
        }

        input[type="range"] {
            width: 110px;
            height: 3px;
            -webkit-appearance: none;
            background: #FFD966;
            border-radius: 5px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #FFD966;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Redes sociais */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 0.5px solid rgba(255,215,0,0.15);
        }

        .social-links a {
            color: rgba(255,255,255,0.5);
            font-size: 1.3rem;
            transition: all 0.3s;
        }

        .social-links a:hover {
            color: #FFD966;
            transform: translateY(-3px);
        }

        .status-text {
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            margin-top: 12px;
        }

        footer {
            text-align: center;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.2);
            margin-top: 20px;
        }

        @media (max-width: 550px) {
            .inner { padding: 25px 20px 30px; }
            .station-title h1 { font-size: 1.1rem; }
            .logo-img { width: 45px; height: 45px; }
            .image-frame { width: 210px; height: 210px; }
            #playPauseBtn { width: 65px; height: 65px; font-size: 1.5rem; }
            .ctrl-btn { width: 48px; height: 48px; font-size: 1.1rem; }
        }

        @media (max-width: 400px) {
            .station-header { flex-direction: column; text-align: center; }
            .logo-area { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="glass-radio" id="radioContainer">
    <div class="inner">
        <!-- Header com logo -->
        <div class="station-header">
            <div class="logo-area">
                <img src="logo.png" class="logo-img" alt="NaldoA Play" onerror="this.src='https://via.placeholder.com/55?text=NP'">
                <div class="station-title">
                    <h1>NALDOA PLAY</h1>
                    <p>A SUA RÁDIO WEB!</p>
                </div>
            </div>
            <div class="live-badge">
                <span class="live-dot"></span>
                <span>AO VIVO</span>
            </div>
        </div>

        <!-- Slideshow de imagens -->
        <div class="slideshow-section">
            <div class="blur-backdrop" id="blurBackdrop"></div>
            <div class="image-frame" id="imageFrame">
                <img id="slideshowImg" class="slideshow-img" src="img/IMG_4484.jpg" alt="Imagem">
            </div>
            <div class="image-caption" id="imageCaption">Momento NaldoA Play</div>
        </div>

        <!-- Informações da música -->
        <div class="track-info">
            <div class="track-title" id="trackTitle">SINTONIZANDO...</div>
            <div class="track-artist" id="trackArtist">NALDOA PLAY</div>
        </div>

        <!-- Controles -->
        <div class="controls">
            <button class="ctrl-btn" id="prevBtn"><i class="fas fa-backward-step"></i></button>
            <button class="ctrl-btn" id="playPauseBtn"><i class="fas fa-play" id="playIcon"></i></button>
            <button class="ctrl-btn" id="nextBtn"><i class="fas fa-forward-step"></i></button>
        </div>

        <!-- Barra de progresso -->
        <div class="progress-section">
            <div class="progress-area" id="progressArea">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-stamp">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <!-- Volume -->
        <div class="volume-row">
            <i class="fas fa-volume-up"></i>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
        </div>

        <!-- Redes sociais -->
        <div class="social-links">
            <a href="https://instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://youtube.com/" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://tiktok.com/" target="_blank"><i class="fab fa-tiktok"></i></a>
            <a href="https://twitter.com/" target="_blank"><i class="fab fa-twitter"></i></a>
        </div>

        <div class="status-text" id="statusMsg">🔊 Pronto para tocar</div>
        <footer>NaldoA Play © 2026 | 24 horas no ar</footer>
    </div>
</div>

<script>
    // ============================================================
    // NALDOA PLAY - STREAM + SLIDESHOW DE IMAGENS
    // ============================================================
    
    const STREAM_URL = "https://stream.zeno.fm/xx785t45mf9uv";
    
    // ========== CONFIGURAÇÃO DAS IMAGENS ==========
    // Gera automaticamente os nomes das imagens de IMG_4484.jpg até IMG_4596.jpg
    const imagens = [];
    for (let i = 4484; i <= 4596; i++) {
        imagens.push(`img/IMG_${i}.jpg`);
    }
    
    let currentImageIndex = 0;
    let slideshowInterval = null;
    
    // Elementos
    const audio = new Audio();
    audio.src = STREAM_URL;
    audio.crossOrigin = "anonymous";
    audio.preload = "auto";
    
    let isPlaying = false;
    
    // Elementos DOM
    const playBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const slideshowImg = document.getElementById('slideshowImg');
    const blurBackdrop = document.getElementById('blurBackdrop');
    const imageCaption = document.getElementById('imageCaption');
    const progressBar = document.getElementById('progressBar');
    const progressArea = document.getElementById('progressArea');
    const currentTimeSpan = document.getElementById('currentTime');
    const durationSpan = document.getElementById('durationTime');
    const volumeSlider = document.getElementById('volumeSlider');
    const statusMsg = document.getElementById('statusMsg');
    const radioContainer = document.getElementById('radioContainer');
    const imageFrame = document.getElementById('imageFrame');
    
    // ========== FUNÇÕES DO SLIDESHOW ==========
    
    function updateImage(index) {
        const imgPath = imagens[index];
        slideshowImg.src = imgPath;
        blurBackdrop.style.backgroundImage = `url(${imgPath})`;
        blurBackdrop.style.backgroundSize = 'cover';
        blurBackdrop.style.backgroundPosition = 'center';
        
        // Extrair número da imagem para legenda
        const match = imgPath.match(/IMG_(\d+)\.jpg/);
        if (match) {
            imageCaption.textContent = `Momento #${match[1]}`;
        } else {
            imageCaption.textContent = `Momento NaldoA Play`;
        }
    }
    
    function nextImage() {
        currentImageIndex = (currentImageIndex + 1) % imagens.length;
        updateImage(currentImageIndex);
    }
    
    function prevImage() {
        currentImageIndex = (currentImageIndex - 1 + imagens.length) % imagens.length;
        updateImage(currentImageIndex);
    }
    
    function startSlideshow() {
        if (slideshowInterval) clearInterval(slideshowInterval);
        slideshowInterval = setInterval(() => {
            nextImage();
        }, 8000); // Troca a cada 8 segundos
    }
    
    function stopSlideshow() {
        if (slideshowInterval) {
            clearInterval(slideshowInterval);
            slideshowInterval = null;
        }
    }
    
    // ========== FUNÇÕES DO PLAYER ==========
    
    // Playlist de demonstração para metadados da música
    const playlistDemo = [
        { title: "BATIDÃO EXPLOSIVO", artist: "DJ NALDOA" },
        { title: "ELETRO HITS 2025", artist: "NALDOA PLAY" },
        { title: "SÓ AS TOP", artist: "RÁDIO NALDOA" },
        { title: "PISTA QUENTE", artist: "DJ NALDOA" },
        { title: "FUNK MANDELADO", artist: "NALDOA SELECT" },
        { title: "PAGODE DO NALDOA", artist: "SAMBA AO VIVO" },
        { title: "SERTANEJO TOP", artist: "NALDOA PLAY" },
        { title: "ROCK IN RIO", artist: "NALDOA" }
    ];
    
    let currentMusicIndex = 0;
    let musicIntervalId = null;
    
    function rotateTrackInfo() {
        const track = playlistDemo[currentMusicIndex % playlistDemo.length];
        trackTitle.textContent = track.title;
        trackArtist.textContent = track.artist;
        currentMusicIndex++;
        
        // Atualizar Media Session
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: track.title,
                artist: track.artist,
                album: 'NaldoA Play',
                artwork: [{ src: slideshowImg.src, sizes: '512x512' }]
            });
        }
    }
    
    function startMusicRotation() {
        if (musicIntervalId) clearInterval(musicIntervalId);
        musicIntervalId = setInterval(() => {
            if (isPlaying) rotateTrackInfo();
        }, 30000);
    }
    
    function stopMusicRotation() {
        if (musicIntervalId) clearInterval(musicIntervalId);
    }
    
    // Controle de áudio
    function togglePlay() {
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
            playIcon.className = "fas fa-play";
            playBtn.classList.remove('playing');
            radioContainer.classList.remove('playing');
            statusMsg.textContent = "⏸️ Pausado";
            stopSlideshow();
            stopMusicRotation();
        } else {
            audio.play().then(() => {
                isPlaying = true;
                playIcon.className = "fas fa-stop";
                playBtn.classList.add('playing');
                radioContainer.classList.add('playing');
                statusMsg.textContent = "🎧 AO VIVO - NALDOA PLAY 🎧";
                startSlideshow();
                startMusicRotation();
                rotateTrackInfo();
            }).catch((err) => {
                console.log(err);
                statusMsg.textContent = "🔊 Clique novamente para ouvir";
            });
        }
    }
    
    function nextTrackSimulate() {
        if (!isPlaying) return;
        rotateTrackInfo();
        statusMsg.textContent = "🎵 Próxima faixa";
        setTimeout(() => {
            if (isPlaying) statusMsg.textContent = "🎧 AO VIVO - NALDOA PLAY 🎧";
        }, 2000);
    }
    
    function prevTrackSimulate() {
        if (!isPlaying) return;
        currentMusicIndex = (currentMusicIndex - 2 + playlistDemo.length) % playlistDemo.length;
        rotateTrackInfo();
        statusMsg.textContent = "🎵 Voltar faixa";
        setTimeout(() => {
            if (isPlaying) statusMsg.textContent = "🎧 AO VIVO - NALDOA PLAY 🎧";
        }, 2000);
    }
    
    // Barra de progresso decorativa
    let progressInterval = null;
    
    function startProgressAnimation() {
        if (progressInterval) clearInterval(progressInterval);
        let fakeProgress = 0;
        progressInterval = setInterval(() => {
            if (isPlaying) {
                fakeProgress = (fakeProgress + 0.5) % 100;
                progressBar.style.width = fakeProgress + '%';
                const fakeSeconds = Math.floor((fakeProgress / 100) * 180);
                const mins = Math.floor(fakeSeconds / 60);
                const secs = fakeSeconds % 60;
                currentTimeSpan.textContent = `${mins}:${secs < 10 ? '0'+secs : secs}`;
                durationSpan.textContent = "3:00";
            }
        }, 500);
    }
    
    function stopProgressAnimation() {
        if (progressInterval) clearInterval(progressInterval);
        progressBar.style.width = '0%';
        currentTimeSpan.textContent = "0:00";
    }
    
    // Volume
    volumeSlider.addEventListener('input', (e) => {
        audio.volume = e.target.value;
    });
    audio.volume = 0.8;
    
    // Eventos do áudio
    audio.addEventListener('playing', () => {
        startProgressAnimation();
        statusMsg.textContent = "🎧 AO VIVO - NALDOA PLAY 🎧";
    });
    
    audio.addEventListener('pause', () => {
        stopProgressAnimation();
    });
    
    audio.addEventListener('error', () => {
        statusMsg.textContent = "⚠️ Reconectando...";
        setTimeout(() => {
            if (isPlaying) audio.play().catch(() => {});
        }, 3000);
    });
    
    // Botões
    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrackSimulate);
    prevBtn.addEventListener('click', prevTrackSimulate);
    
    // Navegação manual das imagens (quando pausado)
    nextBtn.addEventListener('dblclick', () => {
        if (!isPlaying) nextImage();
    });
    prevBtn.addEventListener('dblclick', () => {
        if (!isPlaying) prevImage();
    });
    
    // Inicializar primeira imagem
    updateImage(0);
    
    // Carregar stream
    audio.load();
    statusMsg.textContent = "🔊 Clique no play para ouvir";
    
    // Media Session
    if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', () => togglePlay());
        navigator.mediaSession.setActionHandler('pause', () => togglePlay());
        navigator.mediaSession.setActionHandler('nexttrack', () => nextTrackSimulate());
        navigator.mediaSession.setActionHandler('previoustrack', () => prevTrackSimulate());
    }
    
    // Fallback para imagens que não carregam
    slideshowImg.onerror = function() {
        this.src = 'https://via.placeholder.com/300x300?text=NALDOA+PLAY';
    };
</script>
</body>
</html>
