<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXNA Downloader Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; }
        .custom-glass { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <div class="w-full max-w-2xl custom-glass border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl my-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-red-500 via-orange-500 to-amber-500 bg-clip-text text-transparent sm:text-4xl">
                EXNA Downloader
            </h1>
            <p class="text-slate-400 mt-2 text-sm">Conversor inteligente multimídia para Playlists e Vídeos avulsos.</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">URL da Playlist ou Vídeo do YouTube</label>
                <input type="text" id="playlistUrl" 
                    placeholder="https://youtube.com/playlist?list=... ou watch?v=..." 
                    class="w-full bg-slate-950/90 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-orange-500 text-sm mb-4">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-950/40 p-4 rounded-xl border border-slate-800/60">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Formato de Saída</label>
                    <select id="formatoMídia" onchange="alternarOpcoesQualidade()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-orange-500">
                        <option value="mp3">Áudio (MP3)</option>
                        <option value="mp4">Vídeo (MP4)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Qualidade Máxima</label>
                    <select id="qualidadeMídia" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-orange-500"></select>
                </div>
            </div>

            <button onclick="iniciarProcessamento()" id="btnAcao"
                class="w-full mt-2 bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 text-white font-medium py-3 rounded-xl transition-all duration-300 shadow-lg flex items-center justify-center gap-2 text-sm">
                <span id="btnText">Analisar & Começar Download</span>
            </button>
        </div>

        <div id="statusPainel" class="hidden mt-8 space-y-4 border-t border-slate-800/80 pt-6">
            <div class="flex justify-between items-center text-sm bg-slate-950/40 p-3 rounded-xl border border-slate-800/50">
                <div class="flex items-center gap-2">
                    <span class="relative flex h-2 w-2" id="pingStatus">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
                    </span>
                    <span id="statusTxt" class="font-medium text-orange-400">Iniciando conexão...</span>
                </div>
                <span id="contador" class="text-slate-400 font-mono text-xs bg-slate-900 px-2 py-1 rounded border border-slate-800">0 / 0</span>
            </div>
            
            <div id="listaMusicas" class="max-h-80 overflow-y-auto space-y-3 pr-1"></div>
        </div>
    </div>

    <footer class="w-full text-center text-xs text-slate-600 tracking-wide pt-8 pb-4">
        Ecossistemas EXNA &copy; 2026 — NaldoA
    </footer>

    <script>
        const BACKEND_URL = 'https://exna-downloader.onrender.com'; 
        let filaDeMidias = [];
        let indexAtual = 0;

        function alternarOpcoesQualidade() {
            const formato = document.getElementById('formatoMídia').value;
            const qualidadeSelect = document.getElementById('qualidadeMídia');
            if (formato === 'mp3') {
                qualidadeSelect.innerHTML = `
                    <option value="320">320 kbps (Alta Fidelidade)</option>
                    <option value="256">256 kbps (Média-Alta)</option>
                    <option value="128">128 kbps (Econômica)</option>
                `;
            } else {
                qualidadeSelect.innerHTML = `
                    <option value="1080">1080p (Full HD)</option>
                    <option value="720">720p (HD)</option>
                    <option value="480">480p (Padrão)</option>
                `;
            }
        }
        alternarOpcoesQualidade();

        // Função inteligente para esperar o Render acordar antes de dar erro
        async function aguardarServidor() {
            const statusTxt = document.getElementById('statusTxt');
            let tentativas = 0;
            while (tentativas < 15) {
                try {
                    statusTxt.innerText = "Acordando o servidor na nuvem (pode levar 1 min)...";
                    const checagem = await fetch(`${BACKEND_URL}/api/ping`);
                    if (checagem.ok) return true;
                } catch (e) {
                    tentativas++;
                    await new Promise(r => setTimeout(r, 5000)); // Espera 5 segundos antes de tentar de novo
                }
            }
            return false;
        }

        async function iniciarProcessamento() {
            const urlInput = document.getElementById('playlistUrl').value.trim();
            const formato = document.getElementById('formatoMídia').value;
            const qualidade = document.getElementById('qualidadeMídia').value;
            
            const btn = document.getElementById('btnAcao');
            const btnText = document.getElementById('btnText');
            const painel = document.getElementById('statusPainel');
            const statusTxt = document.getElementById('statusTxt');
            const lista = document.getElementById('listaMusicas');

            if (!urlInput) return alert('Por favor, insira uma URL.');

            filaDeMidias = [];
            indexAtual = 0;
            lista.innerHTML = '';
            painel.classList.remove('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-40', 'cursor-not-allowed');
            btnText.innerText = 'Conectando...';

            // Executa a checagem inteligente do servidor em modo de repouso
            const servidorPronto = await aguardarServidor();
            if(!servidorPronto) {
                statusTxt.innerText = 'O servidor demorou muito para responder. Tente novamente em instantes.';
                statusTxt.className = 'font-medium text-red-400';
                btn.disabled = false;
                btn.classList.remove('opacity-40', 'cursor-not-allowed');
                btnText.innerText = 'Analisar & Começar Download';
                return;
            }

            statusTxt.innerText = 'Buscando informações da lista...';

            try {
                if (!urlInput.includes('list=')) {
                    const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                    const match = urlInput.match(reg);
                    const videoId = (match && match[2].length == 11) ? match[2] : null;
                    if(!videoId) throw new Error();
                    filaDeMidias = [{ id: videoId, title: 'Vídeo Individual', url: urlInput }];
                } else {
                    const resposta = await fetch(`${BACKEND_URL}/api/playlist?url=${encodeURIComponent(urlInput)}`);
                    const dados = await resposta.json();
                    if (dados.error) throw new Error(dados.error);
                    filaDeMidias = dados.tracks;
                }

                document.getElementById('contador').innerText = `0 / ${filaDeMidias.length}`;
                statusTxt.innerText = 'Lista carregada com sucesso!';
                statusTxt.className = 'font-medium text-emerald-400';

                lista.innerHTML = filaDeMidias.map((track, idx) => `
                    <div id="item-${idx}" class="flex items-center gap-3 p-3 bg-slate-950/50 rounded-xl border border-slate-800/60 text-xs">
                        <img src="https://img.youtube.com/vi/${track.id}/mqdefault.jpg" alt="Capa" class="w-16 h-10 object-cover rounded-lg border border-slate-800 shadow">
                        <div class="flex-1 min-w-0">
                            <p class="truncate text-slate-200 font-medium text-sm">${track.title}</p>
                            <p class="text-slate-500 text-[10px] mt-0.5">Formato: <span class="uppercase font-bold text-slate-400">${formato}</span> (${formato === 'mp3' ? qualidade+'kbps' : qualidade+'p'})</p>
                        </div>
                        <span id="badge-${idx}" class="text-slate-500 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-md font-bold uppercase tracking-wider text-[10px]">Fila</span>
                    </div>
                `).join('');

                baixarProximaMídia(formato, qualidade);

            } catch (erro) {
                statusTxt.innerText = 'Erro ao processar os links. Verifique se a lista é pública.';
                statusTxt.className = 'font-medium text-red-400';
                btn.disabled = false;
                btn.classList.remove('opacity-40', 'cursor-not-allowed');
                btnText.innerText = 'Analisar & Começar Download';
            }
        }

        async function baixarProximaMídia(formato, qualidade) {
            const statusTxt = document.getElementById('statusTxt');
            const btn = document.getElementById('btnAcao');
            const btnText = document.getElementById('btnText');

            if (indexAtual >= filaDeMidias.length) {
                statusTxt.innerText = `🎉 Pronto! Playlist processada e baixada com sucesso.`;
                statusTxt.className = 'font-medium text-emerald-400';
                btn.disabled = false;
                btn.classList.remove('opacity-40', 'cursor-not-allowed');
                btnText.innerText = 'Analisar & Começar Download';
                return;
            }

            const midiaAtual = filaDeMidias[indexAtual];
            statusTxt.innerText = `Baixando: ${midiaAtual.title}`;
            statusTxt.className = 'font-medium text-orange-400';
            document.getElementById('contador').innerText = `${indexAtual + 1} / ${filaDeMidias.length}`;

            const badge = document.getElementById(`badge-${indexAtual}`);
            const linha = document.getElementById(`item-${indexAtual}`);
            
            badge.innerText = 'Baixando';
            badge.className = 'text-orange-400 bg-orange-950/40 border border-orange-800/40 px-2.5 py-1 rounded-md font-bold uppercase tracking-wider text-[10px]';
            linha.classList.add('border-orange-500/20', 'bg-orange-950/10');
            linha.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            window.location.href = `${BACKEND_URL}/api/download?url=${encodeURIComponent(midiaAtual.url)}&format=${formato}&quality=${qualidade}`;

            setTimeout(() => {
                badge.innerText = `${formato === 'mp3' ? qualidade + 'K' : quality + 'P'} OK`;
                badge.className = 'text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 px-2.5 py-1 rounded-md font-bold uppercase tracking-wider text-[10px]';
                linha.classList.remove('border-orange-500/20', 'bg-orange-950/10');
                linha.classList.add('border-emerald-500/20', 'opacity-50');

                indexAtual++;
                baixarProximaMídia(formato, qualidade);
            }, 8000); // Janela estável para processamento de codec do FFmpeg
        }
    </script>
</body>
</html>
