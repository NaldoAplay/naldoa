<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EXNA FM - A Rádio que toca todas!</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EXNA FM">
  <link rel="apple-touch-icon" href="logo-quadrada.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0d041a; 
      height: 100vh;
      height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    .bg-blur {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('logo-quadrada.png') no-repeat center center;
      background-size: cover;
      filter: blur(50px) brightness(0.22);
      z-index: -1;
      transform: scale(1.1);
      transition: background-image 1s ease-in-out;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(24px + env(safe-area-inset-top)) 20px 12px 20px;
      background: rgba(13, 4, 26, 0.7); 
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      mix-blend-mode: screen; 
    }

    .titulo-radio h1 {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.2px;
      background: linear-gradient(135deg, #ffffff, #c5c5c5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
    }

    .titulo-radio p {
      font-size: 9px;
      color: #ff2d55;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 1px;
    }

    .redes-sociais {
      display: flex;
      gap: 16px;
    }

    .redes-sociais a {
      color: #fff;
      font-size: 18px;
      text-decoration: none;
      opacity: 0.8;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
    }

    .player-container {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 32px;
      padding: 22px 25px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .capa-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #000;
    }

    .capa-streaming {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s ease;
    }

    .tocando .capa-streaming {
      transform: scale(1.03);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 45, 85, 0.12);
      color: #ff2d55;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 45, 85, 0.2);
    }

    .status-badge .ponto-pisca {
      width: 5px;
      height: 5px;
      background-color: #ff2d55;
      border-radius: 50%;
      animation: piscar 1.6s infinite;
    }

    @keyframes piscar {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    .container-letreiro {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      margin-bottom: 4px;
    }

    #txtFrase {
      display: inline-block;
      font-size: 20px;
      font-weight: 700;
      padding-left: 100%;
      animation: barraTexto 14s linear infinite;
    }

    @keyframes barraTexto {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    .info-musica p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 20px;
      font-weight: 600;
    }

    .controles {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .btn-play-live {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 28px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
      margin: 0 auto; 
    }

    footer {
      text-align: center;
      padding: 10px 14px calc(24px + env(safe-area-inset-bottom)) 14px;
      background: rgba(13, 4, 26, 0.8);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="bg-blur" id="fundoDinamico"></div>

  <header>
    <div class="logo-area">
      <img src="logo-quadrada.png" alt="Logo EXNA FM" class="logo-img">
      <div class="titulo-radio">
        <h1>EXNA FM</h1>
        <p>A Rádio que toca todas!</p>
      </div>
    </div>
    
    <div class="redes-sociais">
      <a href="https://www.instagram.com/naldoaoficial" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://www.tiktok.com/@djnaldoaoficial" target="_blank"><i class="fab fa-tiktok"></i></a>
      <a href="https://youtube.com/@djnaldoaoficial" target="_blank"><i class="fab fa-youtube"></i></a>
    </div>
  </header>

  <main>
    <div class="player-container" id="playerCard">
      <div class="capa-wrapper">
        <img src="logo-quadrada.png" id="capaRadio" alt="Capa EXNA" class="capa-streaming">
      </div>
      
      <div class="status-badge">
        <div class="ponto-pisca"></div>
        Ao Vivo
      </div>

      <div class="info-musica">
        <div class="container-letreiro">
          <span id="txtFrase">EXNA FM - A RÁDIO QUE TOCA TODAS!</span>
        </div>
        <p>Sintonizado no Melhor Ritmo</p>
      </div>
      
      <div class="controles">
        <button class="btn-play-live" id="btnPlayLive">
          <i class="fas fa-play" id="iconePlay"></i>
        </button>
      </div>
    </div>
  </main>

  <footer>
    <p>EXNA FM &copy; 2026</p>
  </footer>

  <audio id="audioRadio" crossorigin="anonymous"></audio>

  <script>
    const urlArchiveJson = "https://archive.org/metadata/exna-fm";
    const audio = document.getElementById('audioRadio');
    const btnPlayLive = document.getElementById('btnPlayLive');
    const iconePlay = document.getElementById('iconePlay');
    const playerCard = document.getElementById('playerCard');
    const txtFrase = document.getElementById('txtFrase');
    const capaRadio = document.getElementById('capaRadio');
    const fundoDinamico = document.getElementById('fundoDinamico');

    let playlistMp3 = [];
    let indiceAtualGlobal = 0;
    let jaSintonizouPrimeiraVez = false;
    
    // Média matemática estimada de 3 minutos APENAS para calcular a entrada sintonizada inicial
    const DURACAO_FAIXA_ESTIMADA = 180; 

    const slogansRadio = [
      "EXNA FM - A RÁDIO QUE TOCA TODAS!",
      "CONEXÃO TOTAL • SÓ AS MELHORES CONSTANTEMENTE",
      "ECOSSISTEMAS EXNA • SOM, TECNOLOGIA E RITMO",
      "SUA TRILHA SONORA DIÁRIA 24 HORAS NO AR"
    ];
    let indexFrase = 0;
    const termosCapas = ["electronic-music", "house-music", "progressive-house", "trance", "dance-hits", "techno-remix"];

    async function carregarAutoDJ() {
      try {
        const resposta = await fetch(urlArchiveJson);
        const dados = await resposta.json();
        const arquivosServidor = dados.files;

        arquivosServidor.forEach(arq => {
          if (arq.name.endsWith('.mp3')) {
            playlistMp3.push({
              id: arq.name,
              url: `https://archive.org/download/exna-fm/${arq.name}`
            });
          }
        });

        if (playlistMp3.length > 0) {
          playlistMp3.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
          
          // Prepara o ponto inicial sintonizado ao carregar a página
          calcularPontoDeSintoniaInicial();
          
          setInterval(alternarSloganTexto, 14000);
        }
      } catch (erro) {
        console.error(erro);
        txtFrase.innerText = "EXNA FM - ERRO DE SINTONIA";
      }
    }

    function alternarSloganTexto() {
      indexFrase = (indexFrase + 1) % slogansRadio.length;
      txtFrase.innerText = slogansRadio[indexFrase];
    }

    async function buscarCapaDoiTunes(sementeId) {
      try {
        const indexTermo = sementeId % termosCapas.length;
        const resposta = await fetch(`https://itunes.apple.com/search?term=${termosCapas[indexTermo]}&entity=album&limit=20`);
        const resultado = await resposta.json();
        
        if (resultado.results && resultado.results.length > 0) {
          const capaHD = resultado.results[sementeId % resultado.results.length].artworkUrl100.replace('100x100bb.jpg', '600x600bb.jpg');
          capaRadio.src = capaHD;
          fundoDinamico.style.backgroundImage = `url('${capaHD}')`;
          atualizarMetadadosSistema();
        }
      } catch (e) {
        capaRadio.src = "logo-quadrada.png";
        fundoDinamico.style.backgroundImage = "url('logo-quadrada.png')";
      }
    }

    // --- MODO 1: CALCULA O AO VIVO SÓ NO MOMENTO DA ENTRADA ---
    function calcularPontoDeSintoniaInicial() {
      if (jaSintonizouPrimeiraVez) return;

      const tempoAgora = new Date();
      const segundosPassadosDoDia = (tempoAgora.getHours() * 3600) + (tempoAgora.getMinutes() * 60) + tempoAgora.getSeconds();
      
      const duracaoTotalGrade = playlistMp3.length * DURACAO_FAIXA_ESTIMADA;
      const segundoAtualNoLoopDaRadio = segundosPassadosDoDia % duracaoTotalGrade;
      
      indiceAtualGlobal = Math.floor(segundoAtualNoLoopDaRadio / DURACAO_FAIXA_ESTIMADA);
      const segundoDeEntradaNaMusica = segundoAtualNoLoopDaRadio % DURACAO_FAIXA_ESTIMADA;

      const musicaCronometrada = playlistMp3[indiceAtualGlobal];
      audio.src = musicaCronometrada.url;
      audio.currentTime = segundoDeEntradaNaMusica; 
      
      buscarCapaDoiTunes(indiceAtualGlobal);
    }

    function comandarPlayer() {
      if (audio.paused) {
        // Se for o primeiro clique do usuário ao entrar na página, força a sincronia ao vivo do relógio
        if (!jaSintonizouPrimeiraVez) {
          const tempoAgora = new Date();
          const segundosPassadosDoDia = (tempoAgora.getHours() * 3600) + (tempoAgora.getMinutes() * 60) + tempoAgora.getSeconds();
          audio.currentTime = segundosPassadosDoDia % DURACAO_FAIXA_ESTIMADA;
          jaSintonizouPrimeiraVez = true; // Trava para não cortar mais baseado no relógio!
        }

        audio.play().then(() => {
          iconePlay.className = "fas fa-pause";
          playerCard.classList.add('tocando');
          atualizarMetadadosSistema();
        }).catch(err => console.log(err));
      } else {
        audio.pause();
        iconePlay.className = "fas fa-play";
        playerCard.classList.remove('tocando');
      }
    }

    function atualizarMetadadosSistema() {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: "EXNA FM - A Rádio que toca todas!", 
          artist: 'AO VIVO', 
          album: 'EXNA FM - A Rádio que toca todas!',
          artwork: [
            { src: capaRadio.src, sizes: '600x600', type: 'image/jpeg' }
          ]
        });

        navigator.mediaSession.setActionHandler('play', comandarPlayer);
        navigator.mediaSession.setActionHandler('pause', comandarPlayer);
      }
    }

    // --- MODO 2: FLUXO CONTÍNUO REAL (Sem interrupções e sem cortes de tempo) ---
    // O evento 'ended' avisa nativamente o iOS que o arquivo acabou por completo, mantendo a rádio acordada em background.
    audio.addEventListener('ended', () => {
      // Avança para a próxima da lista em loop contínuo e orgânico
      indiceAtualGlobal = (indiceAtualGlobal + 1) % playlistMp3.length;
      const proximaMusica = playlistMp3[indiceAtualGlobal];
      
      audio.src = proximaMusica.url;
      // Não mexemos no currentTime aqui, a música nova começará obrigatoriamente do segundo 0!
      buscarCapaDoiTunes(indiceAtualGlobal);

      audio.play().then(() => {
        playerCard.classList.add('tocando');
        iconePlay.className = "fas fa-pause";
      }).catch(e => console.log("Erro de transição em segundo plano:", e));
    });

    btnPlayLive.addEventListener('click', comandarPlayer);
    carregarAutoDJ();
  </script>
</body>
</html>
