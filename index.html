<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EXNA MUSIC - Google Drive Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo-quadrada.png">
            
    <style>
        :root {
            --primary-purple: #8a2be2;
            --neon-aqua: #66fcf1;
            --neon-pink: #ff0055;
            --dark-bg: #050608;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        .blur-background {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: url('logo-quadrada.png');
            background-position: center;
            background-size: cover;
            filter: blur(60px) brightness(0.3);
            z-index: -1;
            transition: background-image 0.8s ease-in-out;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .glass-player {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            width: 100%;
            max-width: 380px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            position: relative;
        }

        .radio-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
        }

        .header-brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .radio-top-logo {
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 0 8px var(--neon-aqua));
        }

        .radio-brand-text h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin: 0;
            text-align: left;
        }
        .radio-brand-text h2 span { color: var(--neon-aqua); }
        .radio-brand-text p {
            margin: 0;
            font-size: 0.7rem;
            color: var(--neon-pink);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: left;
        }

        .hamburger-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.3s;
            padding: 5px 10px;
        }
        .hamburger-btn:hover {
            color: var(--neon-aqua);
            filter: drop-shadow(0 0 5px var(--neon-aqua));
        }

        .sync-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--neon-aqua);
            color: var(--neon-aqua);
            padding: 10px 18px;
            border-radius: 50px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .sync-btn:hover {
            background: var(--neon-aqua);
            color: #000;
            box-shadow: 0 0 15px var(--neon-aqua);
        }

        .cover-area {
            width: 190px;
            height: 190px;
            margin: 0 auto 20px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }

        .playing .cover-area {
            border-color: var(--neon-aqua);
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.2);
        }

        .cover-img { width: 100%; height: 100%; object-fit: cover; background-color: #111; }

        .info-area h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-area p {
            font-size: 1rem;
            color: var(--neon-aqua);
            margin: 4px 0 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 20px;
        }

        .progress-bar {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 5px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--neon-aqua);
            box-shadow: 0 0 8px var(--neon-aqua);
        }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-btn:hover, .nav-btn.active { color: var(--neon-aqua); filter: drop-shadow(0 0 5px var(--neon-aqua)); }

        .play-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(45deg, var(--primary-purple), var(--neon-pink));
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
        }
        .play-btn.active { background: #fff; color: #000; box-shadow: 0 0 25px #fff; }

        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--neon-pink);
        }

        .playlist-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 320px;
            height: 100vh;
            background: rgba(5, 6, 8, 0.95);
            backdrop-filter: blur(25px);
            border-left: 1px solid var(--glass-border);
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            z-index: 9999;
            transition: cubic-bezier(0.16, 1, 0.3, 1) 0.4s;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .playlist-sidebar.open { right: 0; }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .sidebar-header h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin: 0;
            color: var(--neon-aqua);
            letter-spacing: 1px;
        }

        .close-sidebar-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .close-sidebar-btn:hover { color: var(--neon-pink); }

        .playlist-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.01);
        }
        .playlist-item:hover { background: rgba(255, 255, 255, 0.04); }
        
        .playlist-item.current-track {
            background: rgba(102, 252, 241, 0.15);
            border: 1px solid rgba(102, 252, 241, 0.3);
            color: var(--neon-aqua);
        }

        .list-thumb {
            width: 35px;
            height: 35px;
            border-radius: 6px;
            object-fit: cover;
            background-color: #111;
        }

        .track-meta-box {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-meta-box span { display: block; font-size: 0.7rem; color: #666; margin-top: 1px; }

        footer {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.5);
            border-top: 1px solid var(--glass-border);
            position: relative;
            z-index: 1;
        }
        .social-links { margin-bottom: 10px; display: flex; justify-content: center; gap: 20px; }
        .social-links a { color: var(--neon-aqua); font-size: 1.3rem; transition: 0.3s; text-decoration: none; }
        .social-links a:hover { color: var(--neon-pink); }
        .copyright { font-size: 0.7rem; color: #555; text-transform: uppercase; }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        button { touch-action: manipulation; }
    </style>
</head>
<body>

    <div class="blur-background" id="bg-glow"></div>

    <div class="playlist-sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-list-ul"></i> MINHA PLAYLIST</h3>
            <button class="close-sidebar-btn" onclick="fecharSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <div class="playlist-scroll-area" id="playlist-box">
            <div style="text-align: center; color: #444; padding: 20px;">Carregando...</div>
        </div>
    </div>

    <main>
        <div class="glass-player" id="main-player">
            
            <div class="radio-header">
                <div class="header-brand-box">
                    <img src="logo-quadrada.png" class="radio-top-logo" alt="EXNA Logo">
                    <div class="radio-brand-text">
                        <h2>EXNA <span>MUSIC</span></h2>
                        <p>Google Drive Player</p>
                    </div>
                </div>
                <button class="hamburger-btn" onclick="abrirSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
            </div>

            <button class="sync-btn" onclick="sincronizarGoogleDrive()">
                <i class="fab fa-google-drive"></i> SINCRONIZAR COM DRIVE
            </button>

            <div class="cover-area">
                <img src="logo-quadrada.png" id="track-cover" class="cover-img" alt="Capa">
            </div>

            <div class="info-area">
                <h1 id="track-title">EXNA MUSIC</h1>
                <p id="artist-name">Sincronize para começar</p>
            </div>

            <div class="progress-container">
                <span id="time-current">0:00</span>
                <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
                <span id="time-duration">0:00</span>
            </div>

            <div class="controls-row">
                <button class="nav-btn" id="shuffle-btn" onclick="toggleShuffle()"><i class="fas fa-random"></i></button>
                <button class="nav-btn" onclick="musicaAnterior()"><i class="fas fa-step-backward"></i></button>
                <button class="play-btn" id="master-play" onclick="togglePlayPause()" disabled>
                    <i class="fas fa-play" id="btn-icon"></i>
                </button>
                <button class="nav-btn" onclick="proximaMusica()"><i class="fas fa-step-forward"></i></button>
                <button class="nav-btn" id="loop-btn" onclick="toggleLoop()"><i class="fas fa-redo"></i></button>
            </div>

            <div class="volume-container">
                <i class="fas fa-volume-down"></i>
                <input type="range" id="volume" class="volume-slider" value="80" min="0" max="100" oninput="ajustarVolume(this.value)">
                <i class="fas fa-volume-up"></i>
            </div>
            
            <p id="status-text" style="margin-top:20px; font-size: 0.75rem; color: #45a29e;">Aguardando sincronização</p>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://www.instagram.com/naldoaoficial" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://youtube.com/@djnaldoaoficial" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://www.tiktok.com/@djnaldoaoficial" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
        <div class="copyright">EXNA MUSIC © 2026</div>
    </footer>

    <audio id="audio-core" crossorigin="anonymous" preload="auto"></audio>

    <script>
        // ==================== CONFIGURAÇÕES ====================
        const PASTA_ID = '1vcukZmaqRgdkg6hEe-zgMjY7H9VwwY9J'; 
        const API_KEY = 'AIzaSyBVpSXuoQT0jjh6nqzKo5U1IYlaP_qolSs'; 
        const DB_NAME = 'ExnaMusicDB';
        const DB_VERSION = 3;

        // ==================== ELEMENTOS ====================
        const player = document.getElementById('audio-core');
        const btnPlay = document.getElementById('master-play');
        const iconPlay = document.getElementById('btn-icon');
        const cardPlayer = document.getElementById('main-player');
        const txtTitulo = document.getElementById('track-title');
        const txtArtista = document.getElementById('artist-name');
        const imgCapa = document.getElementById('track-cover');
        const bgGlow = document.getElementById('bg-glow');
        const txtStatus = document.getElementById('status-text');
        const playlistBox = document.getElementById('playlist-box');
        const progressBar = document.getElementById('progress');
        const tempoAtualSpan = document.getElementById('time-current');
        const tempoTotalSpan = document.getElementById('time-duration');
        
        // ==================== VARIÁVEIS ====================
        let playlist = [];           
        let ordemExecucao = [];      
        let indiceAtual = 0;         
        let modoShuffle = false;
        let modoLoop = false;
        let cacheCapas = new Map();
        let db = null;
        let sincronizando = false;
        let primeiraVez = true;
        
        // ==================== FUNÇÕES DE BANCO DE DADOS ====================
        function abrirBancoDados() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('playlist')) {
                        db.createObjectStore('playlist', { keyPath: 'id' });
                    }
                    if (!db.objectStoreNames.contains('estado')) {
                        db.createObjectStore('estado', { keyPath: 'chave' });
                    }
                };
                
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                
                request.onerror = (e) => reject(e);
            });
        }
        
        async function salvarPlaylistNoBanco() {
            if (!db || !playlist.length) return;
            const tx = db.transaction(['playlist'], 'readwrite');
            const store = tx.objectStore('playlist');
            store.clear();
            playlist.forEach(musica => store.put(musica));
        }
        
        async function carregarPlaylistDoBanco() {
            if (!db) return [];
            return new Promise((resolve) => {
                const tx = db.transaction(['playlist'], 'readonly');
                const store = tx.objectStore('playlist');
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result || []);
                request.onerror = () => resolve([]);
            });
        }
        
        async function salvarEstado() {
            if (!db) return;
            const tx = db.transaction(['estado'], 'readwrite');
            const store = tx.objectStore('estado');
            
            const estado = {
                chave: 'player_state',
                indiceAtual: indiceAtual,
                tempo: player.currentTime || 0,
                volume: player.volume,
                shuffle: modoShuffle,
                loop: modoLoop,
                ordemExecucao: ordemExecucao,
                playlistIds: playlist.map(m => m.id)
            };
            store.put(estado);
        }
        
        async function carregarEstado() {
            if (!db) return null;
            return new Promise((resolve) => {
                const tx = db.transaction(['estado'], 'readonly');
                const store = tx.objectStore('estado');
                const request = store.get('player_state');
                request.onsuccess = () => resolve(request.result || null);
                request.onerror = () => resolve(null);
            });
        }
        
        // ==================== BUSCAR CAPAS ONLINE ====================
        async function buscarCapaOnline(musicaNome, artistaNome) {
            const chave = `${artistaNome}|${musicaNome}`.toLowerCase();
            if (cacheCapas.has(chave)) return cacheCapas.get(chave);
            
            const query = encodeURIComponent(`${artistaNome} ${musicaNome}`);
            
            try {
                const res = await fetch(`https://itunes.apple.com/search?term=${query}&limit=1&entity=song`);
                const data = await res.json();
                if (data.results && data.results[0]) {
                    const capa = data.results[0].artworkUrl100?.replace('100x100', '600x600');
                    if (capa) {
                        cacheCapas.set(chave, capa);
                        return capa;
                    }
                }
            } catch(e) {}
            
            try {
                const res = await fetch(`https://api.deezer.com/search?q=${query}&limit=1`);
                const data = await res.json();
                if (data.data && data.data[0] && data.data[0].album) {
                    const capa = data.data[0].album.cover_big;
                    if (capa) {
                        cacheCapas.set(chave, capa);
                        return capa;
                    }
                }
            } catch(e) {}
            
            cacheCapas.set(chave, null);
            return null;
        }
        
        // ==================== SINCRONIZAR COM GOOGLE DRIVE ====================
        async function sincronizarGoogleDrive() {
            if (sincronizando) return;
            sincronizando = true;
            txtStatus.innerHTML = '<span class="loading"></span> Sincronizando com Google Drive...';
            
            // Buscar TODOS os arquivos (sem filtro de nome)
            const url = `https://www.googleapis.com/drive/v3/files?q='${PASTA_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data.files || data.files.length === 0) {
                    txtStatus.innerText = "Nenhum arquivo encontrado!";
                    sincronizando = false;
                    return;
                }
                
                // PEGA TODOS OS MP3 (sem filtro de nome duplicado)
                const musicasDrive = data.files.filter(f => f.name.toLowerCase().endsWith('.mp3'));
                const imagensDrive = data.files.filter(f => f.mimeType.includes('image'));
                
                console.log(`📁 Total de MP3 encontrados: ${musicasDrive.length}`);
                
                if (musicasDrive.length === 0) {
                    txtStatus.innerText = "Nenhum MP3 encontrado!";
                    sincronizando = false;
                    return;
                }
                
                // Carregar playlist atual do banco
                const playlistAtual = await carregarPlaylistDoBanco();
                const idsExistentes = new Set(playlistAtual.map(m => m.id));
                
                // Processar TODAS as músicas (incluindo as que já existem para atualizar capas)
                const musicasProcessadas = [];
                
                for (let i = 0; i < musicasDrive.length; i++) {
                    const m = musicasDrive[i];
                    const nomeSemExtensao = m.name.replace(/\.[^/.]+$/, "");
                    let artista = "EXNA MUSIC";
                    let titulo = nomeSemExtensao;
                    
                    if (nomeSemExtensao.includes(" - ")) {
                        const partes = nomeSemExtensao.split(" - ");
                        artista = partes[0].trim();
                        titulo = partes.slice(1).join(" - ").trim(); // Pega o resto todo após o primeiro " - "
                    }
                    
                    // Verifica se tem capa local (pelo nome completo do arquivo)
                    const capaLocal = imagensDrive.find(img => 
                        img.name.toLowerCase() === nomeSemExtensao.toLowerCase() + '.jpg' ||
                        img.name.toLowerCase() === nomeSemExtensao.toLowerCase() + '.png' ||
                        img.name.toLowerCase().startsWith(nomeSemExtensao.toLowerCase())
                    );
                    
                    let capaUrl = capaLocal ? `https://www.googleapis.com/drive/v3/files/${capaLocal.id}?alt=media&key=${API_KEY}` : null;
                    
                    // Se não tem capa local e é música nova ou não tem capa, busca online
                    const musicaExistente = playlistAtual.find(p => p.id === m.id);
                    if (!capaUrl && (!musicaExistente || !musicaExistente.capaUrl || musicaExistente.capaUrl === 'logo-quadrada.png')) {
                        capaUrl = await buscarCapaOnline(titulo, artista);
                    } else if (musicaExistente && musicaExistente.capaUrl && musicaExistente.capaUrl !== 'logo-quadrada.png') {
                        capaUrl = musicaExistente.capaUrl;
                    }
                    
                    musicasProcessadas.push({
                        id: m.id,
                        nome: titulo,
                        artista: artista,
                        capaUrl: capaUrl || 'logo-quadrada.png',
                        url: `https://www.googleapis.com/drive/v3/files/${m.id}?alt=media&key=${API_KEY}`
                    });
                    
                    // Atualizar status a cada 10 músicas
                    if (i % 10 === 0) {
                        txtStatus.innerHTML = `<span class="loading"></span> Processando: ${i+1}/${musicasDrive.length}`;
                    }
                }
                
                playlist = musicasProcessadas;
                await salvarPlaylistNoBanco();
                
                txtStatus.innerText = `✅ ${playlist.length} músicas sincronizadas!`;
                
                // Inicializar ordem de execução
                if (ordemExecucao.length === 0 || ordemExecucao.length !== playlist.length) {
                    ordemExecucao = playlist.map((_, i) => i);
                    if (modoShuffle) {
                        for (let i = ordemExecucao.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [ordemExecucao[i], ordemExecucao[j]] = [ordemExecucao[j], ordemExecucao[i]];
                        }
                    }
                }
                
                btnPlay.disabled = false;
                renderizarPlaylist();
                
                // Se é a primeira vez ou não tem música carregada
                if (primeiraVez || (player.src === '' || player.src === null)) {
                    primeiraVez = false;
                    await carregarEstadoSalvo();
                }
                
            } catch (e) {
                console.error(e);
                txtStatus.innerText = "Erro ao sincronizar!";
            } finally {
                sincronizando = false;
            }
        }
        
        // ==================== CARREGAR ESTADO SALVO ====================
        async function carregarEstadoSalvo() {
            const estado = await carregarEstado();
            
            if (estado && estado.playlistIds && estado.ordemExecucao) {
                const idsAtuais = playlist.map(m => m.id);
                const valido = estado.playlistIds.length === idsAtuais.length && 
                              estado.playlistIds.every(id => idsAtuais.includes(id));
                
                if (valido && estado.ordemExecucao.length === playlist.length) {
                    ordemExecucao = estado.ordemExecucao;
                    indiceAtual = estado.indiceAtual;
                    if (indiceAtual >= ordemExecucao.length) indiceAtual = 0;
                } else {
                    ordemExecucao = playlist.map((_, i) => i);
                    indiceAtual = 0;
                }
            } else if (playlist.length > 0) {
                ordemExecucao = playlist.map((_, i) => i);
                indiceAtual = 0;
            }
            
            // Restaurar modos
            if (estado) {
                modoShuffle = estado.shuffle || false;
                modoLoop = estado.loop || false;
                document.getElementById('shuffle-btn').classList.toggle('active', modoShuffle);
                document.getElementById('loop-btn').classList.toggle('active', modoLoop);
                player.loop = modoLoop;
                if (estado.volume !== undefined) {
                    player.volume = estado.volume;
                    document.getElementById('volume').value = estado.volume * 100;
                }
            }
            
            // Carregar primeira música
            if (playlist.length > 0 && ordemExecucao.length > 0) {
                carregarMusica(indiceAtual);
                
                // Restaurar tempo
                if (estado && estado.tempo !== undefined && estado.tempo > 0) {
                    const restaurarTempo = () => {
                        if (player.duration && !isNaN(player.duration) && estado.tempo < player.duration) {
                            player.currentTime = estado.tempo;
                            atualizarBarraProgresso();
                        }
                        player.removeEventListener('loadedmetadata', restaurarTempo);
                        player.removeEventListener('canplay', restaurarTempo);
                    };
                    player.addEventListener('loadedmetadata', restaurarTempo);
                    player.addEventListener('canplay', restaurarTempo);
                }
            }
            
            renderizarPlaylist();
        }
        
        // ==================== FUNÇÕES DO PLAYER ====================
        function carregarMusica(index) {
            if (playlist.length === 0 || ordemExecucao.length === 0) return;
            
            if (index >= ordemExecucao.length) index = 0;
            if (index < 0) index = ordemExecucao.length - 1;
            indiceAtual = index;
            
            const idReal = ordemExecucao[indiceAtual];
            const musica = playlist[idReal];
            if (!musica) return;
            
            const wasPlaying = !player.paused;
            player.pause();
            player.src = musica.url;
            player.load();
            
            txtTitulo.innerText = musica.nome.toUpperCase();
            txtArtista.innerText = musica.artista;
            imgCapa.src = musica.capaUrl;
            bgGlow.style.backgroundImage = `url('${musica.capaUrl}')`;
            
            // FORÇA ATUALIZAÇÃO DA TELA BLOQUEADA
            atualizarTelaBloqueada(musica.nome, musica.artista, musica.capaUrl);
            
            renderizarPlaylist();
            
            if (wasPlaying) {
                setTimeout(() => player.play().catch(() => {}), 200);
            }
            
            salvarEstado();
        }
        
        function atualizarBarraProgresso() {
            if (player.duration && !isNaN(player.duration)) {
                const pct = (player.currentTime / player.duration) * 100;
                progressBar.value = pct;
                tempoAtualSpan.innerText = formatarTempo(player.currentTime);
                tempoTotalSpan.innerText = formatarTempo(player.duration);
            } else if (player.currentTime > 0) {
                tempoAtualSpan.innerText = formatarTempo(player.currentTime);
            }
        }
        
        function formatarTempo(segundos) {
            if (isNaN(segundos)) return "0:00";
            const min = Math.floor(segundos / 60);
            const sec = Math.floor(segundos % 60);
            return `${min}:${sec < 10 ? '0' + sec : sec}`;
        }
        
        function togglePlayPause() {
            if (player.paused) {
                player.play().catch(() => {});
            } else {
                player.pause();
            }
        }
        
        function proximaMusica() {
            if (playlist.length === 0) return;
            carregarMusica(indiceAtual + 1);
            player.play().catch(() => {});
        }
        
        function musicaAnterior() {
            if (playlist.length === 0) return;
            if (player.currentTime > 3) {
                player.currentTime = 0;
            } else {
                carregarMusica(indiceAtual - 1);
                player.play().catch(() => {});
            }
        }
        
        function toggleShuffle() {
            modoShuffle = !modoShuffle;
            document.getElementById('shuffle-btn').classList.toggle('active', modoShuffle);
            
            const musicaAtual = playlist[ordemExecucao[indiceAtual]];
            
            if (modoShuffle) {
                for (let i = ordemExecucao.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [ordemExecucao[i], ordemExecucao[j]] = [ordemExecucao[j], ordemExecucao[i]];
                }
            } else {
                ordemExecucao = playlist.map((_, i) => i);
            }
            
            indiceAtual = ordemExecucao.findIndex(i => playlist[i].id === musicaAtual.id);
            if (indiceAtual === -1) indiceAtual = 0;
            
            renderizarPlaylist();
            salvarEstado();
        }
        
        function toggleLoop() {
            modoLoop = !modoLoop;
            document.getElementById('loop-btn').classList.toggle('active', modoLoop);
            player.loop = modoLoop;
            salvarEstado();
        }
        
        function ajustarVolume(valor) {
            player.volume = valor / 100;
            salvarEstado();
        }
        
        // ==================== EVENTOS DO PLAYER ====================
        player.addEventListener('play', () => {
            iconPlay.className = "fas fa-stop";
            btnPlay.classList.add('active');
            cardPlayer.classList.add('playing');
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "playing";
            txtStatus.innerText = "🎵 Tocando...";
            // Atualiza tela bloqueada novamente ao tocar
            if (playlist.length > 0 && ordemExecucao[indiceAtual] !== undefined) {
                const musica = playlist[ordemExecucao[indiceAtual]];
                atualizarTelaBloqueada(musica.nome, musica.artista, musica.capaUrl);
            }
        });
        
        player.addEventListener('pause', () => {
            iconPlay.className = "fas fa-play";
            btnPlay.classList.remove('active');
            cardPlayer.classList.remove('playing');
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = "paused";
            txtStatus.innerText = "⏸️ Pausado";
            salvarEstado();
        });
        
        // CRUCIAL: Quando a música termina, toca a próxima
        player.addEventListener('ended', () => {
            console.log("🎵 Música terminou!");
            if (!modoLoop) {
                proximaMusica();
            }
        });
        
        player.addEventListener('timeupdate', () => {
            atualizarBarraProgresso();
        });
        
        player.addEventListener('error', (e) => {
            console.error("Erro no áudio:", e);
            txtStatus.innerText = "Erro na música, pulando...";
            setTimeout(() => proximaMusica(), 1000);
        });
        
        progressBar.addEventListener('input', () => {
            if (player.duration && !isNaN(player.duration)) {
                player.currentTime = (progressBar.value / 100) * player.duration;
                salvarEstado();
            }
        });
        
        // Salvar estado ao sair
        window.addEventListener('beforeunload', () => {
            salvarEstado();
        });
        
        // ==================== INTERFACE DA PLAYLIST ====================
        function renderizarPlaylist() {
            if (!playlistBox) return;
            playlistBox.innerHTML = "";
            
            if (playlist.length === 0) {
                playlistBox.innerHTML = '<div style="text-align: center; color: #444; padding: 20px;">Nenhuma música carregada</div>';
                return;
            }
            
            ordemExecucao.forEach((idReal, idx) => {
                const musica = playlist[idReal];
                const div = document.createElement('div');
                div.className = `playlist-item ${idx === indiceAtual ? 'current-track' : ''}`;
                div.onclick = () => {
                    carregarMusica(idx);
                    player.play().catch(() => {});
                    fecharSidebar();
                };
                div.innerHTML = `
                    <img src="${musica.capaUrl}" class="list-thumb" onerror="this.src='logo-quadrada.png'">
                    <div class="track-meta-box">
                        ${musica.nome.toUpperCase()}
                        <span>${musica.artista}</span>
                    </div>
                `;
                playlistBox.appendChild(div);
            });
        }
        
        function abrirSidebar() {
            document.getElementById('sidebar').classList.add('open');
        }
        
        function fecharSidebar() {
            document.getElementById('sidebar').classList.remove('open');
        }
        
        // ==================== TELA BLOQUEADA (CORRIGIDA) ====================
        function atualizarTelaBloqueada(titulo, artista, capaUrl) {
            if ('mediaSession' in navigator) {
                // Garantir que a capa seja uma URL válida
                const imagemUrl = (capaUrl && capaUrl !== 'logo-quadrada.png') ? capaUrl : 'logo-quadrada.png';
                
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: titulo || 'EXNA MUSIC',
                    artist: artista || 'EXNA',
                    album: 'EXNA MUSIC PLAYER',
                    artwork: [
                        { src: imagemUrl, sizes: '512x512', type: 'image/png' },
                        { src: 'logo-quadrada.png', sizes: '512x512', type: 'image/png' }
                    ]
                });
                
                // Configurar ações dos botões do fone/carro
                navigator.mediaSession.setActionHandler('play', () => player.play());
                navigator.mediaSession.setActionHandler('pause', () => player.pause());
                navigator.mediaSession.setActionHandler('previoustrack', () => musicaAnterior());
                navigator.mediaSession.setActionHandler('nexttrack', () => proximaMusica());
                
                console.log(`🖼️ Tela bloqueada atualizada: ${titulo} - ${imagemUrl}`);
            }
        }
        
        // ==================== INSTALAÇÃO PWA ====================
        let deferredPrompt;
        const pwaBtn = document.createElement('button');
        pwaBtn.style.cssText = "position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:#ff0055;color:#fff;border:none;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:999;font-size:1.3rem;box-shadow:0 0 15px #ff0055;";
        pwaBtn.innerHTML = '<i class="fas fa-download"></i>';
        document.body.appendChild(pwaBtn);
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            pwaBtn.style.display = 'flex';
        });
        
        pwaBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                pwaBtn.style.display = 'none';
            }
        });
        
        // ==================== INICIALIZAÇÃO ====================
        (async function init() {
            await abrirBancoDados();
            const playlistSalva = await carregarPlaylistDoBanco();
            if (playlistSalva.length > 0) {
                playlist = playlistSalva;
                ordemExecucao = playlist.map((_, i) => i);
                btnPlay.disabled = false;
                renderizarPlaylist();
                await carregarEstadoSalvo();
                txtStatus.innerText = `${playlist.length} músicas carregadas`;
            } else {
                txtStatus.innerText = "Clique em SINCRONIZAR para começar";
            }
        })();
    </script>
</body>
</html>
