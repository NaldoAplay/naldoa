<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0a0f1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EXNA TV">
    
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="manifest.json">
    
    <title>EXNA TV - Canais ao Vivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1e;
            font-family: 'Inter', sans-serif;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .tv-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background: radial-gradient(ellipse at 30% 40%, #0f1422, #05080c);
        }

        /* Header fixo */
        .tv-header {
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(15px);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,215,0,0.2);
            flex-shrink: 0;
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area img {
            width: 36px;
            height: 36px;
            border-radius: 10px;
        }

        .logo-area h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .back-btn {
            background: rgba(255,215,0,0.15);
            padding: 6px 14px;
            border-radius: 30px;
            text-decoration: none;
            color: #FFD966;
            font-size: 0.7rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 0.5px solid rgba(255,215,0,0.3);
        }

        /* Player */
        .player-area {
            background: #00000066;
            backdrop-filter: blur(10px);
            padding: 12px;
            flex-shrink: 0;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        #videoPlayer {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
        }

        .fullscreen-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            z-index: 20;
            transition: 0.2s;
        }

        .fullscreen-btn:active {
            transform: scale(0.95);
        }

        .channel-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            padding: 0 4px;
            flex-wrap: wrap;
        }

        .channel-meta img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            background: #1e1e2e;
            border-radius: 10px;
            padding: 5px;
        }

        .info-time {
            flex: 1;
            min-width: 0;
        }

        .info-time .channel-name {
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-time .datetime {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.5);
            margin-top: 2px;
        }

        .fav-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #FFD966;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .fav-btn.active {
            background: #FFD966;
            color: #0a0f1e;
        }

        /* Lista de canais */
        .channels-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .tab-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            color: #ccc;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .tab-btn.active {
            background: #FFD966;
            color: #0a0f1e;
        }

        .channels-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .channel-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .channel-card:hover {
            background: rgba(255,215,0,0.1);
        }

        .channel-card.playing {
            background: rgba(255,215,0,0.2);
            border-color: #FFD966;
        }

        .card-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            background: #1e1e2e;
            border-radius: 10px;
            padding: 5px;
        }

        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-group {
            font-size: 0.65rem;
            color: rgba(255,255,255,0.5);
        }

        .card-fav {
            color: rgba(255,255,255,0.3);
            font-size: 0.9rem;
            cursor: pointer;
            width: 36px;
            text-align: center;
        }

        .card-fav.active {
            color: #FFD966;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #aaa;
            font-size: 0.85rem;
        }

        .channels-area::-webkit-scrollbar {
            width: 4px;
        }

        .channels-area::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }

        .channels-area::-webkit-scrollbar-thumb {
            background: #FFD966;
            border-radius: 4px;
        }

        /* Tela cheia */
        .video-container:-webkit-full-screen {
            width: 100%;
            height: 100%;
            border-radius: 0;
        }

        .video-container:fullscreen {
            width: 100%;
            height: 100%;
            border-radius: 0;
        }

        .video-container:-webkit-full-screen video {
            height: 100%;
        }

        .video-container:fullscreen video {
            height: 100%;
        }

        @media (min-width: 600px) {
            .channels-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .tv-header { padding: 12px 20px; }
            .player-area { padding: 16px 20px; }
            .channels-area { padding: 16px 20px; }
            .logo-area h1 { font-size: 1.4rem; }
            .logo-area img { width: 42px; height: 42px; }
        }

        @media (min-width: 900px) {
            .channels-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="tv-app">
    <div class="tv-header">
        <div class="logo-area">
            <img src="logo.png" alt="Logo">
            <h1>EXNA TV</h1>
        </div>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Rádio</a>
    </div>

    <div class="player-area">
        <div class="video-container" id="videoContainer">
            <video id="videoPlayer" controls autoplay playsinline></video>
            <button id="fullscreenBtn" class="fullscreen-btn"><i class="fas fa-expand"></i></button>
        </div>
        <div class="channel-meta" id="channelMeta">
            <img id="currentLogo" src="logo.png" alt="Logo">
            <div class="info-time">
                <div class="channel-name" id="currentName">Selecione um canal</div>
                <div class="datetime" id="currentDateTime"></div>
            </div>
            <button id="currentFavBtn" class="fav-btn"><i class="far fa-star"></i></button>
        </div>
    </div>

    <div class="channels-area">
        <div class="tabs">
            <button class="tab-btn active" data-filter="all">📺 Todos</button>
            <button class="tab-btn" data-filter="fav">⭐ Favoritos</button>
        </div>
        <div id="channelsList" class="channels-grid">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> Carregando canais...</div>
        </div>
    </div>
</div>

<script>
    const M3U_URL = 'https://iptv-org.github.io/iptv/countries/br.m3u';
    
    let allChannels = [];
    let favoriteIds = new Set();
    let currentChannel = null;
    let currentFilter = 'all';
    
    const video = document.getElementById('videoPlayer');
    const videoContainer = document.getElementById('videoContainer');
    const channelsDiv = document.getElementById('channelsList');
    const currentNameSpan = document.getElementById('currentName');
    const currentLogoImg = document.getElementById('currentLogo');
    const currentFavBtn = document.getElementById('currentFavBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const currentDateTimeSpan = document.getElementById('currentDateTime');
    
    // Atualizar data e hora
    function updateDateTime() {
        const now = new Date();
        const options = { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' };
        currentDateTimeSpan.textContent = now.toLocaleDateString('pt-BR', options);
    }
    updateDateTime();
    setInterval(updateDateTime, 60000);
    
    function loadFavorites() {
        const saved = localStorage.getItem('exna_tv_favorites');
        if (saved) {
            favoriteIds = new Set(JSON.parse(saved));
        }
    }
    
    function saveFavorites() {
        localStorage.setItem('exna_tv_favorites', JSON.stringify([...favoriteIds]));
        updateAllFavoriteButtons();
    }
    
    function toggleFavorite(channel) {
        if (favoriteIds.has(channel.id)) {
            favoriteIds.delete(channel.id);
        } else {
            favoriteIds.add(channel.id);
        }
        saveFavorites();
        if (currentChannel && currentChannel.id === channel.id) {
            updateCurrentFavoriteButton();
        }
        renderChannels();
    }
    
    function isFavorite(id) {
        return favoriteIds.has(id);
    }
    
    function updateCurrentFavoriteButton() {
        if (currentChannel) {
            const isFav = isFavorite(currentChannel.id);
            currentFavBtn.innerHTML = isFav ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>';
        }
    }
    
    function updateAllFavoriteButtons() {
        document.querySelectorAll('.card-fav').forEach(btn => {
            const id = btn.dataset.id;
            if (id && isFavorite(id)) {
                btn.classList.add('active');
                btn.innerHTML = '<i class="fas fa-star"></i>';
            } else if (id) {
                btn.classList.remove('active');
                btn.innerHTML = '<i class="far fa-star"></i>';
            }
        });
        updateCurrentFavoriteButton();
    }
    
    function playChannel(channel) {
        currentChannel = channel;
        video.src = channel.url;
        video.play().catch(e => console.log('Clique no play do player'));
        
        currentNameSpan.textContent = channel.name;
        if (channel.logo && channel.logo.trim() !== '' && (channel.logo.startsWith('http') || channel.logo.startsWith('https'))) {
            currentLogoImg.src = channel.logo;
        } else {
            currentLogoImg.src = 'logo.png';
        }
        updateCurrentFavoriteButton();
        
        document.querySelectorAll('.channel-card').forEach(card => {
            card.classList.remove('playing');
            if (card.dataset.id === channel.id) {
                card.classList.add('playing');
            }
        });
    }
    
    async function fetchChannels() {
        try {
            const response = await fetch(M3U_URL);
            const text = await response.text();
            
            const lines = text.split('\n');
            const channels = [];
            let current = null;
            
            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const match = line.match(/#EXTINF:-?\d+\s+(?:tvg-logo="([^"]*)"\s+)?(?:group-title="([^"]*)"\s+)?(?:tvg-id="([^"]*)"\s+)?(?:tvg-name="([^"]*)"\s+)?(.*)/i);
                    if (match) {
                        const logo = match[1] || '';
                        const group = match[2] || 'Geral';
                        const tvgId = match[3] || '';
                        const tvgName = match[4] || '';
                        let name = (match[5] || '').replace(/,$/, '').trim();
                        if (!name && tvgName) name = tvgName;
                        if (!name) name = 'Canal sem nome';
                        
                        current = {
                            id: tvgId || name.replace(/\s/g, '_'),
                            name: name,
                            group: group,
                            logo: logo,
                            url: ''
                        };
                    }
                } else if (line && !line.startsWith('#') && current) {
                    current.url = line;
                    if (current.url && current.name) {
                        channels.push(current);
                    }
                    current = null;
                }
            }
            
            if (channels.length === 0) {
                channels.push({
                    id: 'demo1',
                    name: 'Canal Demo - M3U não carregou',
                    group: 'Informação',
                    logo: '',
                    url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8'
                });
            }
            
            allChannels = channels;
            renderChannels();
            
            if (allChannels.length > 0 && !currentChannel) {
                playChannel(allChannels[0]);
            }
        } catch (error) {
            channelsDiv.innerHTML = `<div class="loading"><i class="fas fa-exclamation-triangle"></i> Erro ao carregar lista de canais.</div>`;
        }
    }
    
    function renderChannels() {
        let filtered = [...allChannels];
        if (currentFilter === 'fav') {
            filtered = filtered.filter(ch => isFavorite(ch.id));
        }
        
        if (filtered.length === 0) {
            channelsDiv.innerHTML = `<div class="loading">Nenhum canal encontrado${currentFilter === 'fav' ? ' nos favoritos' : ''}</div>`;
            return;
        }
        
        channelsDiv.innerHTML = filtered.map(ch => {
            let logoUrl = (ch.logo && ch.logo.trim() !== '' && (ch.logo.startsWith('http') || ch.logo.startsWith('https'))) ? ch.logo : 'logo.png';
            return `
            <div class="channel-card ${currentChannel && currentChannel.id === ch.id ? 'playing' : ''}" data-id="${ch.id}" data-url="${ch.url}" data-name="${ch.name.replace(/"/g, '&quot;')}" data-logo="${logoUrl}">
                <img class="card-logo" src="${logoUrl}" onerror="this.src='logo.png'">
                <div class="card-info">
                    <div class="card-title">${ch.name}</div>
                    <div class="card-group">${ch.group}</div>
                </div>
                <div class="card-fav ${isFavorite(ch.id) ? 'active' : ''}" data-id="${ch.id}">
                    ${isFavorite(ch.id) ? '<i class="fas fa-star"></i>' : '<i class="far fa-star"></i>'}
                </div>
            </div>
        `}).join('');
        
        document.querySelectorAll('.channel-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.closest('.card-fav')) return;
                
                const channel = {
                    id: card.dataset.id,
                    name: card.dataset.name,
                    url: card.dataset.url,
                    logo: card.dataset.logo
                };
                playChannel(channel);
            });
            
            const favBtn = card.querySelector('.card-fav');
            if (favBtn) {
                favBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const ch = {
                        id: favBtn.dataset.id,
                        name: card.dataset.name,
                        url: card.dataset.url,
                        logo: card.dataset.logo
                    };
                    toggleFavorite(ch);
                });
            }
        });
    }
    
    // Tela cheia CORRIGIDA - entra e sai
    function toggleFullscreen() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (videoContainer.requestFullscreen) {
                videoContainer.requestFullscreen();
            } else if (videoContainer.webkitRequestFullscreen) {
                videoContainer.webkitRequestFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    }
    
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    
    // Detectar saída da tela cheia (ESC)
    document.addEventListener('fullscreenchange', exitHandler);
    document.addEventListener('webkitfullscreenchange', exitHandler);
    
    function exitHandler() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            console.log('Saiu da tela cheia');
        }
    }
    
    currentFavBtn.addEventListener('click', () => {
        if (currentChannel) {
            toggleFavorite(currentChannel);
        }
    });
    
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderChannels();
        });
    });
    
    loadFavorites();
    fetchChannels();
    
    if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', () => video.play());
        navigator.mediaSession.setActionHandler('pause', () => video.pause());
    }
</script>
</body>
</html>
